---
- name: ADDONS OMniLeads application installation
  hosts: 
    - omnileads_app
    - omnileads_aio
  tags:
    - addons
  vars:    
    INSTALL_PREFIX: "/opt/omnileads"
    services:
      - { name: 'wallboard_listener', src: '{{ addons_repo_path }}templates/wallboard_listener.service' }
      - { name: 'wallboard_worker', src: '{{ addons_repo_path }}templates/wallboard_worker.service' }
      - { name: 'bulk_messages', src: '{{ addons_repo_path }}templates/bulk_messages.service' }
      - { name: 'survey_worker', src: '{{ addons_repo_path }}templates/survey_worker.service' }

  tasks:
    - name: ADDON Copy systemd services
      template:
        src: "{{ item.src }}"
        dest: "/etc/systemd/system/{{ item.name }}.service"
      loop: "{{ services }}"
      tags:
        - install
        - upgrade
        - update

    - name: ADDON Enable and start systemd services
      systemd:
        name: "{{ item.name }}.service"
        state: restarted
        enabled: yes
        daemon_reload: yes
      loop: "{{ services }}"
      tags:
        - install
        - upgrade
        - restart