---

- name: DIALER installation and configuration
  hosts: 
    - omnileads_dialer
    - omnileads_aio
  tags:
    - dialer
  tasks:

  - name: DIALER Create a podman network
    containers.podman.podman_network:
      name: omnidialer
    failed_when: false
    tags:
      - install
      - upgrade
      
  - name: DIALER Set environment variables for this installation
    template:
      src: "{{ item.src }}"
      dest: "{{ item.dest }}"
      mode: "0664"
      owner: "omnileads"
      group: "omnileads"
    loop:
      - { src: "{{ dialer_repo_path }}templates/dialer.env", dest: "/etc/default/dialer.env" }
    tags:
      - install
      - upgrade
      - update

  - name: DIALER Render systemd services & other files
    template:
      src: "{{ item.src }}"
      dest: "{{ item.dest }}"
    loop:
      - { src: "{{ dialer_repo_path }}templates/add_incidence_rule.service", dest: "/etc/systemd/system/dialer_add_incidence_rule.service" }
      - { src: "{{ dialer_repo_path }}templates/asterisk.service", dest: "/etc/systemd/system/dialer_asterisk.service" }
      - { src: "{{ dialer_repo_path }}templates/change_database.service", dest: "/etc/systemd/system/dialer_change_database.service" }
      - { src: "{{ dialer_repo_path }}templates/create_campaign.service", dest: "/etc/systemd/system/dialer_create_campaign.service" }
      - { src: "{{ dialer_repo_path }}templates/create_incidence_rule.service", dest: "/etc/systemd/system/dialer_create_incidence_rule.service" }
      - { src: "{{ dialer_repo_path }}templates/delete_campaign.service", dest: "/etc/systemd/system/dialer_delete_campaign.service" }
      - { src: "{{ dialer_repo_path }}templates/delete_incidence_rule.service", dest: "/etc/systemd/system/dialer_delete_incidence_rule.service" }
      - { src: "{{ dialer_repo_path }}templates/dialplan.service", dest: "/etc/systemd/system/dialer_dialplan.service" }
      - { src: "{{ dialer_repo_path }}templates/edit_campaign.service", dest: "/etc/systemd/system/dialer_edit_campaign.service" }
      - { src: "{{ dialer_repo_path }}templates/flask.service", dest: "/etc/systemd/system/dialer_flask.service" }
      - { src: "{{ dialer_repo_path }}templates/listener.service", dest: "/etc/systemd/system/dialer_listener.service" }
      - { src: "{{ dialer_repo_path }}templates/pause_campaign.service", dest: "/etc/systemd/system/dialer_pause_campaign.service" }
      - { src: "{{ dialer_repo_path }}templates/postgresql.service", dest: "/etc/systemd/system/dialer_postgresql.service" }      
      - { src: "{{ dialer_repo_path }}templates/process_campaign.service", dest: "/etc/systemd/system/dialer_process_campaign@.service" }
      - { src: "{{ dialer_repo_path }}templates/process_event.service", dest: "/etc/systemd/system/dialer_process_event@.service" }
      - { src: "{{ dialer_repo_path }}templates/process_contact.service", dest: "/etc/systemd/system/dialer_process_contact@.service" }
      - { src: "{{ dialer_repo_path }}templates/render_template.service", dest: "/etc/systemd/system/dialer_render_template.service" }
      - { src: "{{ dialer_repo_path }}templates/resume_campaign.service", dest: "/etc/systemd/system/dialer_resume_campaign.service" }
      - { src: "{{ dialer_repo_path }}templates/schedule_agenda.service", dest: "/etc/systemd/system/dialer_schedule_agenda.service" }
      - { src: "{{ dialer_repo_path }}templates/scheduler.service", dest: "/etc/systemd/system/dialer_scheduler.service" }
      - { src: "{{ dialer_repo_path }}templates/send_reports.service", dest: "/etc/systemd/system/dialer_send_reports.service" }
      - { src: "{{ dialer_repo_path }}templates/start_campaign.service", dest: "/etc/systemd/system/dialer_start_campaign.service" }
      - { src: "{{ dialer_repo_path }}templates/stop_campaign.service", dest: "/etc/systemd/system/dialer_stop_campaign.service" }
      - { src: "{{ dialer_repo_path }}templates/update_incidence_rule.service", dest: "/etc/systemd/system/dialer_update_incidence_rule.service" }
      - { src: "{{ dialer_repo_path }}templates/omnidialer.sql", dest: "/etc/default/omnidialer.sql" }
    tags:
      - install
      - upgrade
      - update

  - name: DIALER Pull images
    command: podman pull --quiet {{ item.image }}
    register: podman_pull_result
    until: podman_pull_result is success
    loop:
      - image: "{{ dialer_api_img }}"
      - image: "{{ dialer_worker_img }}"
      - image: "{{ dialer_listener_img }}"
      - image: "{{ dialer_asterisk_img }}"
      - image: "{{ dialer_dialplan_img }}"
      - image: "{{ dialer_scheduler_img }}"
    tags:
      - install
      - upgrade
      - update

  - name: DIALER Enable y Restart systemd services individuales
    systemd:
      name: "{{ item.name }}"
      state: restarted
      enabled: yes
      daemon_reload: yes
    loop:
      - { name: 'dialer_postgresql.service' }
      - { name: 'dialer_asterisk.service' }
      - { name: 'dialer_dialplan.service' }
      - { name: 'dialer_flask.service' }
      - { name: 'dialer_add_incidence_rule.service' }
      - { name: 'dialer_change_database.service' }
      - { name: 'dialer_create_campaign.service' }
      - { name: 'dialer_create_incidence_rule.service' }
      - { name: 'dialer_delete_campaign.service' }
      - { name: 'dialer_delete_incidence_rule.service' }
      - { name: 'dialer_edit_campaign.service' }
      - { name: 'dialer_pause_campaign.service' }
      - { name: 'dialer_render_template.service' }
      - { name: 'dialer_resume_campaign.service' }
      - { name: 'dialer_schedule_agenda.service' }
      - { name: 'dialer_scheduler.service' }
      - { name: 'dialer_send_reports.service' }
      - { name: 'dialer_start_campaign.service' }
      - { name: 'dialer_stop_campaign.service' }
      - { name: 'dialer_update_incidence_rule.service' }
      - { name: 'dialer_listener.service' }
    tags:
      - install
      - upgrade
      - restart
    when: omnileads_ha is not defined

  - name: DIALER Guardar número original de réplicas
    set_fact:
      dialer_replicas_count: "{{ dialer_worker_replicas }}"
    tags:
      - install
      - upgrade

  - name: DIALER Generar lista de replicas
    set_fact:
      dialer_replicas_list: "{{ range(1, dialer_replicas_count | int + 1) | list | map('string') | list }}"
    tags:
      - install
      - upgrade

  - name: DIALER Enable y Restart systemd services con replicas
    systemd:
      name: "{{ item.0 }}@{{ item.1 }}"
      state: restarted
      enabled: yes
      daemon_reload: yes
    loop: "{{ ['dialer_process_event', 'dialer_process_contact', 'dialer_process_campaign'] | product(dialer_replicas_list) | list }}"
    tags:
      - install
      - upgrade
      - restart
