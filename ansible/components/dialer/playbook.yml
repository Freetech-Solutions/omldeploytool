---

- name: DIALER Isolated deploy
  import_playbook: ../postgresql/playbook.yml
  when: inventory_hostname in groups['omnileads_dialer']

- name: DIALER Isolated deploy
  import_playbook: ../redis/playbook.yml
  when: inventory_hostname in groups['omnileads_dialer']

- name: DIALER installation and configuration
  hosts: 
    - omnileads_dialer
    - omnileads_aio
  tags:
    - dialer
  tasks:

  - name: DIALER Create a podman network
    containers.podman.podman_network:
      name: omnidialer
    failed_when: false
    tags:
      - install
      - upgrade
      
  - name: DIALER Set environment variables for this installation
    template:
      src: "{{ item.src }}"
      dest: "{{ item.dest }}"
      mode: "0664"
      owner: "omnileads"
      group: "omnileads"
    loop:
      - { src: "{{ dialer_repo_path }}templates/dialer.env", dest: "/etc/default/dialer.env" }
    tags:
      - install
      - upgrade
      - update

  - name: DIALER Render systemd services & other files
    template:
      src: "{{ item.src }}"
      dest: "{{ item.dest }}"
    loop:
      - { src: "{{ dialer_repo_path }}templates/asterisk.service", dest: "/etc/systemd/system/dialer_asterisk.service" }
      - { src: "{{ dialer_repo_path }}templates/dialplan.service", dest: "/etc/systemd/system/dialer_dialplan.service" }
      - { src: "{{ dialer_repo_path }}templates/flask.service", dest: "/etc/systemd/system/dialer_flask.service" }
      - { src: "{{ dialer_repo_path }}templates/listener.service", dest: "/etc/systemd/system/dialer_listener.service" }
      - { src: "{{ dialer_repo_path }}templates/process_campaign.service", dest: "/etc/systemd/system/dialer_process_campaign@.service" }
      - { src: "{{ dialer_repo_path }}templates/process_event.service", dest: "/etc/systemd/system/dialer_process_event@.service" }
      - { src: "{{ dialer_repo_path }}templates/process_contact.service", dest: "/etc/systemd/system/dialer_process_contact@.service" }
      - { src: "{{ dialer_repo_path }}templates/schedule_agenda.service", dest: "/etc/systemd/system/dialer_scheduler.service" }
      - { src: "{{ dialer_repo_path }}templates/send_reports.service", dest: "/etc/systemd/system/dialer_send_reports.service" }
      - { src: "{{ dialer_repo_path }}templates/render_template.service", dest: "/etc/systemd/system/dialer_render_template.service" }
      - { src: "{{ dialer_repo_path }}templates/manage_campaign.service", dest: "/etc/systemd/system/dialer_manage_campaign.service" }
      - { src: "{{ dialer_repo_path }}templates/incidence_rules.service", dest: "/etc/systemd/system/dialer_incidence_rules.service" }
    tags:
      - install
      - upgrade
      - update

  - name: DIALER Pull images
    command: podman pull --quiet {{ item.image }}
    register: podman_pull_result
    until: podman_pull_result is success
    loop:
      - image: "{{ dialer_api_img }}"
      - image: "{{ dialer_worker_img }}"
      - image: "{{ dialer_listener_img }}"
      - image: "{{ dialer_asterisk_img }}"
      - image: "{{ dialer_dialplan_img }}"
    tags:
      - install
      - upgrade
      - update

  - name: DIALER Enable y Restart systemd services individuales
    systemd:
      name: "{{ item.name }}"
      state: restarted
      enabled: yes
      daemon_reload: yes
    loop:
      - { name: 'dialer_asterisk.service' }
      - { name: 'dialer_dialplan.service' }
      - { name: 'dialer_flask.service' }
      - { name: 'dialer_scheduler.service' }
      - { name: 'dialer_send_reports.service' }
      - { name: 'dialer_render_template.service' }
      - { name: 'dialer_listener.service' }
      - { name: 'dialer_incidence_rules.service' }
      - { name: 'dialer_manage_campaign.service' }
    tags:
      - install
      - upgrade
      - restart

  - name: DIALER | Validar cantidades de réplicas
    ansible.builtin.assert:
      that:
        - (dialer_process_campaign_replicas | int) >= 0
        - (dialer_process_contact_replicas  | int) >= 0
        - (dialer_process_event_replicas    | int) >= 0
      fail_msg: "Cantidad de réplicas inválida (debe ser >= 0)."
    tags: [install, upgrade]

  # Hacé un daemon-reload una sola vez antes de tocar servicios
  - name: DIALER | systemd daemon-reload (una vez)
    ansible.builtin.systemd:
      daemon_reload: true
    tags: [install, upgrade, update]

  # --- campaign replicas ---
  - name: DIALER | Enable/Start process-campaign replicas
    ansible.builtin.systemd:
      name: "dialer_process_campaign@{{ item }}"
      enabled: true
      state: restarted         # usa 'restarted' sólo si querés forzar reinicio
    loop: "{{ query('sequence', 'start=1 end=' ~ (dialer_process_campaign_replicas | int | string)) }}"
    tags: [install, upgrade, restart]

  # --- contact replicas ---
  - name: DIALER | Enable/Start process-contact replicas
    ansible.builtin.systemd:
      name: "dialer_process_contact@{{ item }}"
      enabled: true
      state: restarted
    loop: "{{ query('sequence', 'start=1 end=' ~ (dialer_process_contact_replicas | int | string)) }}"
    tags: [install, upgrade, restart]

  # --- event replicas ---
  - name: DIALER | Enable/Start process-event replicas
    ansible.builtin.systemd:
      name: "dialer_process_event@{{ item }}"
      enabled: true
      state: restarted
    loop: "{{ query('sequence', 'start=1 end=' ~ (dialer_process_event_replicas | int | string)) }}"
    tags: [install, upgrade, restart]

