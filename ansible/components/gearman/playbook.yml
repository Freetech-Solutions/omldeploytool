---

- name: JOB SERVER OMniLeads JOB SERVER component deploy
  hosts: 
    - omnileads_data
    - omnileads_aio
  tags:
    - all_components
    - rabbitMQ
    - install
  tasks:

  - name: JOB SERVER Copy systemd service
    template:
      src: "{{ gearman_repo_path }}templates/gearman.service"
      dest: /etc/systemd/system/gearman.service
    tags:
      - upgrade
      - update

  - name: JOB SERVER Pull image
    command: podman pull --quiet {{ gearman_img }}
    register: podman_pull
    until: podman_pull is success
    tags:
      - upgrade
      - update
    when: omnileads_ha is not defined   

  - name: JOB SERVER Enable and start service
    systemd:
      name: gearman.service
      state: restarted
      enabled: yes
      daemon_reload: yes
    tags:
      - upgrade

  - name: JOB SERVER Restart service
    systemd:
      name: gearman.service
      state: restarted
      daemon_reload: yes
    tags:
      - upgrade
      - restart
    when:       
      - inventory_hostname in groups['omnileads_data'] or inventory_hostname in groups['omnileads_aio']    

