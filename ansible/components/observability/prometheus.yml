- name: OBSERVABILITY Prometheus deployment
  hosts:
    - omnileads_aio
    - omnileads_app
    - omnileads_voice
    - omnileads_data
  tags:
    - all_components
    - observability

  tasks:

    - name: OBSERVABILITY Ensure Prometheus config directory exists
    # Para dejar prometheus.yml en un path estándar
      file:
        path: /etc/prometheus
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - install
        - upgrade

    - name: OBSERVABILITY Setting prometheus_host as application_host
      set_fact:
        prometheus_host: "{{ application_host }}"
      changed_when: false
      when:
        - prometheus_host is not defined
        - inventory_hostname in groups['omnileads_voice']
      tags: 
        - install
        - upgrade
        - update

    - name: OBSERVABILITY Setting prometheus_host as 127.0.0.1
      set_fact:
        prometheus_host: "127.0.0.1"
      changed_when: false
      when:
        - inventory_hostname in groups['omnileads_aio']
      tags: 
        - install
        - upgrade
        - update

    - name: OBSERVABILITY OS_CONF podman.socket RedHat distros
      systemd:
        name: podman.socket
        state: started
        enabled: true
        daemon_reload: true
      tags:
        - install
        - upgrade
      when: ansible_facts['distribution'] in ["Rocky", "AlmaLinux"]

    - name: OBSERVABILITY Prometheus setting config & variables
      template:
        src: "{{ observability_repo_path }}templates/prometheus.yml"
        dest: /etc/prometheus/prometheus.yml
        owner: root
        group: root
        mode: "0644"
      tags:
        - install
        - upgrade

    - name: OBSERVABILITY Prometheus Copy service Systemd files
      template:
        src: "{{ observability_repo_path }}templates/{{ item }}"
        dest: /etc/systemd/system/{{ item }}
        owner: root
        group: root
        mode: "0644"
      loop:
        - prometheus.service
        - prometheus_uwsgi.service
        - prometheus_podman_exporter.service
        - prometheus_postgres.service
        - prometheus_redis.service
        - prometheus_gearman.service
        - prometheus_node_exporter.service
      tags:
        - install
        - upgrade

    - name: OBSERVABILITY Prometheus Set environment vars
      template:
        src: "{{ observability_repo_path }}templates/{{ item }}"
        dest: /etc/default/{{ item }}
        mode: "0664"
        owner: "{{ usuario }}"
        group: "{{ usuario }}"
      loop:
        - prometheus_postgres.env
        - prometheus_redis.env
      tags:
        - install
        - upgrade

    - name: OBSERVABILITY Prometheus Enable and start service
      systemd:
        name: "{{ item }}.service"
        state: restarted
        enabled: true
        daemon_reload: true
      loop:
        - prometheus
        - prometheus_uwsgi
        - prometheus_podman_exporter
        - prometheus_postgres
        - prometheus_redis
        - prometheus_gearman
        - prometheus_node_exporter
      tags:
        - install
        - upgrade


