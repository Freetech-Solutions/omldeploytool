- name: OBSERVABILITY Host exporters deployment
  hosts:
    - omnileads_aio
    - omnileads_app
    - omnileads_voice
    - omnileads_data
  tags:
    - all_components
    - observability

  tasks:

    - name: OBSERVABILITY Copy host exporter Systemd files
      template:
        src: "{{ observability_repo_path }}templates/{{ item }}.service"
        dest: /etc/systemd/system/{{ item }}.service
        owner: root
        group: root
        mode: "0644"
      loop:
        - prometheus_node_exporter
        - prometheus_podman_exporter
      tags:
        - install
        - upgrade

    - name: OBSERVABILITY Enable and restart host exporters
      systemd:
        name: "{{ item }}.service"
        state: restarted
        enabled: true
        daemon_reload: true
      loop:
        - prometheus_node_exporter
        - prometheus_podman_exporter
      tags:
        - install
        - upgrade

# Backend exporters run alongside the data services in AIT and on the AIO host.
- name: OBSERVABILITY Backend exporters deployment
  hosts:
    - omnileads_aio
    - omnileads_data
  # Keep the previous App exporters if deployment on Data fails.
  any_errors_fatal: true
  tags:
    - all_components
    - observability

  tasks:

    - name: OBSERVABILITY Set backend exporter environment vars
      template:
        src: "{{ observability_repo_path }}templates/{{ item }}"
        dest: /etc/default/{{ item }}
        mode: "0664"
        owner: "{{ usuario }}"
        group: "{{ usuario }}"
      loop:
        - prometheus_postgres.env
        - prometheus_redis.env
      tags:
        - install
        - upgrade

    - name: OBSERVABILITY Copy backend exporter Systemd files
      template:
        src: "{{ observability_repo_path }}templates/{{ item }}.service"
        dest: /etc/systemd/system/{{ item }}.service
        owner: root
        group: root
        mode: "0644"
      loop:
        - prometheus_postgres
        - prometheus_redis
        - prometheus_gearman
      tags:
        - install
        - upgrade

    - name: OBSERVABILITY Enable and restart backend exporters
      systemd:
        name: "{{ item }}.service"
        state: restarted
        enabled: true
        daemon_reload: true
      loop:
        - prometheus_postgres
        - prometheus_redis
        - prometheus_gearman
      tags:
        - install
        - upgrade


# The Prometheus server and uWSGI exporter remain on App/AIO.
- name: OBSERVABILITY Prometheus deployment
  hosts:
    - omnileads_aio
    - omnileads_app
  tags:
    - all_components
    - observability

  tasks:

    - name: OBSERVABILITY Collect services for backend exporter migration
      service_facts:
      when: inventory_hostname in groups['omnileads_app']
      tags:
        - install
        - upgrade

    - name: OBSERVABILITY Stop and disable previous backend exporters on App
      systemd:
        name: "{{ item }}.service"
        state: stopped
        enabled: false
      loop:
        - prometheus_postgres
        - prometheus_redis
        - prometheus_gearman
      when:
        - inventory_hostname in groups['omnileads_app']
        - (item + '.service') in ansible_facts.services
      tags:
        - install
        - upgrade

    - name: OBSERVABILITY Ensure Prometheus config directory exists
    # Para dejar prometheus.yml en un path estándar
      file:
        path: /etc/prometheus
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags:
        - install
        - upgrade

    - name: OBSERVABILITY Setting prometheus_host as application_host
      set_fact:
        prometheus_host: "{{ application_host }}"
      changed_when: false
      when:
        - prometheus_host is not defined
        - inventory_hostname in groups['omnileads_voice']
      tags: 
        - install
        - upgrade
        - update

    - name: OBSERVABILITY Setting prometheus_host as 127.0.0.1
      set_fact:
        prometheus_host: "127.0.0.1"
      changed_when: false
      when:
        - inventory_hostname in groups['omnileads_aio']
      tags: 
        - install
        - upgrade
        - update

    - name: OBSERVABILITY Prometheus setting config & variables
      template:
        src: "{{ observability_repo_path }}templates/prometheus.yml"
        dest: /etc/prometheus/prometheus.yml
        owner: root
        group: root
        mode: "0644"
      tags:
        - install
        - upgrade

    - name: OBSERVABILITY Prometheus Copy service Systemd files
      template:
        src: "{{ observability_repo_path }}templates/{{ item }}"
        dest: /etc/systemd/system/{{ item }}
        owner: root
        group: root
        mode: "0644"
      loop:
        - prometheus.service
        - prometheus_uwsgi.service
      tags:
        - install
        - upgrade

    - name: OBSERVABILITY Prometheus Enable and start service
      systemd:
        name: "{{ item }}.service"
        state: restarted
        enabled: true
        daemon_reload: true
      loop:
        - prometheus
        - prometheus_uwsgi
      tags:
        - install
        - upgrade
