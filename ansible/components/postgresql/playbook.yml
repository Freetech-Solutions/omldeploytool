---

- name: POSTGRESQL component deploy
  hosts: 
    - omnileads_data
    - omnileads_aio
  tags:
    - all_components
    - data
    - postgres    

  tasks:
    - name: POSTGRESQL Set environment variables for this installation
      template:
        src: '{{ item.src }}'
        dest: '{{ item.dest }}'
        mode: '0664'
        owner: "{{ usuario }}"
        group: "{{ usuario }}"
      loop:
          - { src: 'templates/postgres.env', dest: '/etc/default/postgres.env' }
          - { src: 'templates/omnidialer.sql', dest: '/etc/omnileads/omnidialer.sql' }
      tags:
        - install
        - upgrade
        - update

    - name: POSTGRESQL Copy systemd file
      template:
        src: "{{ pgsql_repo_path }}templates/postgresql.service"
        dest: /etc/systemd/system/postgresql.service
      tags: 
        - install
        - upgrade
        - update

    - name: POSTGRESQL Template files for scale tunnings are rendered
      template:
        src: '{{ item.src }}'
        dest: '{{ item.dest }}'
      loop:
        - { src: 'templates/postgresql.conf', dest: '/etc/omnileads/postgresql.conf' }
      tags:
        - install
        - upgrade
        - update
      when: scale_postgres is defined and scale_postgres  

    - name: POSTGRESQL Pull image
      command: podman pull --quiet {{ postgres_img }}
      register: podman_pull
      until: podman_pull is success
      tags:
        - install
        - upgrade
        - update

    - name: POSTGRESQL Enable and start service
      systemd:
        name: postgresql.service
        state: started
        enabled: yes
        daemon_reload: yes
      tags:
        - install
        - upgrade
        - update
      when: omnileads_ha is not defined

    - name: POSTGRESQL RESTORE generate file_timestamp
      set_fact:
        file_timestamp: "{{ ansible_date_time.epoch }}"
      tags:
        - install
        - upgrade
        - update
      when:
        - backup_filename is defined

    - name: POSTGRESQL RESTORE postgres DB pg_restore
      shell: "podman run --name pgsql_bk_{{ file_timestamp }} --env-file /etc/default/backup.env -e BACKUP_FILENAME={{ backup_filename }} --rm {{ backup_restore_img }} python restore.py"
      tags:
        - install
        - upgrade
        - update
      when:
        - backup_filename is defined

- name: POSTGRESQL Include High Availability playbook
  import_playbook: ha.yml
  when: omnileads_ha is defined
  
- name: POSTGRESQL Include Prometheus playbook
  import_playbook: prometheus.yml
  