# ansible/group_vars/all/produccion_global.yml
---
#####################################################################################################
#                                       ANSIBLE VARIABLES                                           #
#####################################################################################################
# --- ansible user auth connection
ansible_ssh_port: 22
ansible_user: "{{ vault_ansible_user }}"
# --- If you user other ssh user than root, uncomment the following lines
ansible_become: true
ansible_become_method: sudo
ansible_become_user: root

upgrade_from_2X: false
###################################################################################################
#                                       GRAL ENVIRONMENT                                          #
###################################################################################################

# --- time zone (for example: America/Argentina/Cordoba)
TZ: America/Argentina/Cordoba

# --- TLS/SSL Certs configuration (selfsigned, custom or certbot letsencrypt)
# --- https://gitlab.com/omnileads/omldeploytool/-/blob/develop/ansible/README.md?ref_type=heads#tls-cert-provisioning
certs: selfsigned
# ssl_cert_file_name: cert.pem
# key_file_name: key.pem

# --- Your email for notifications 
notification_email: "{{ vault_notification_email }}"

###################################################################################################
#                                       DJANGO UWSGI                                              #
###################################################################################################

# Django secrets
# --- Kamailio WebRTC auth ephemeral key
kamailio_webrtc_auth_eph_key: "{{ vault_kamailio_webrtc_auth_eph_key }}"
# --- Django SECRET_KEY (sessions, CSRF, signed cookies)
django_secret_key: "{{ vault_django_secret_key }}"

# --- Session Cookie Age, is the time in seconds that will last 
# --- the https session when inactivity
SCA: 3600
# --- Session API token (seconds)
api_token_expired_after: 3600
# --- Ephemeral Credentials TTL (ECTTL) is the time in seconds 
# --- that will last the SIP credentials used to authenticate a SIP user
# --- in the telephony system
ECCTL: 28800
# --- Presence log/heartbeat (optional overrides; defaults shown)
PRESENCE_LOG_RECONNECT_COOLDOWN_MS: 1500
PRESENCE_HEARTBEAT_INTERVAL_SEC: 15
PRESENCE_HEARTBEAT_TIMEOUT_SEC: 60
PRESENCE_HEARTBEAT_SWEEP_SEC: 15
PRESENCE_HEARTBEAT_LOGOUT_RECENT_SEC: 90
PRESENCE_HEARTBEAT_GUARD_TTL_SEC: 90
# --- is the attempts a user has to enter an incorrect password in login
LOGIN_FAILURE_LIMIT: 10 
# --- SMTP server params, if you want to use your own SMTP, put true and
# --- uncomment all necesary
email_smtp_relay: false
# email_backend:
# email_default_from:
# email_host:
# email_password:
# email_user:
# email_port:
# email_ssl_certfile:
# email_ssl_keyfile:
# email_use_ssl:
# email_use_tls:    

#####################################################################################################
#                                      UWSGI App Server                                             #
#####################################################################################################

# If you set scale_uwsgi to true, then you must assign values to 
# processes, threads, listen_queue_size, and worker_reload_mercy.
# https://uwsgi-docs.readthedocs.io/en/latest/index.html

scale_uwsgi: true
uwsgi_processes: 4
uwsgi_threads: 1
uwsgi_listen_queue_size: 2048
uwsgi_worker_reload_mercy: 60
uwsgi_evil_reload_on_rss: 3096

#####################################################################################################
#                                       POSTGRESQL                                                  #
#####################################################################################################
postgres_port: 5432
postgres_user: omnileads
postgres_password: "{{ vault_postgres_password }}"
postgres_database: omnileads
# --- *postgres* or *defaultdb* depend ...
postgres_maintenance_db: postgres
postgres_ssl: false
postgres_utc: false
# --- If you have a PGSQL cluster you can activated cluster mode
# --- in order to split INSERT (RW node) & QUERIES (RO node)
postgres_ha: false
# --- Read Only connection host address (in case of RW/RO postgres cluster):
# postgres_ro_vip: 

# Postgres performance tuning
# https://wiki.postgresql.org/wiki/Tuning_Your_PostgreSQL_Server
scale_postgres: True
postgres_max_connections: 100
postgres_shared_buffers: 1GB
postgres_idle_in_transaction_session_timeout: 60000
postgres_statement_timeout: 60000
postgres_effective_cache_size: 2GB
postgres_wal_buffers: 32MB
postgres_checkpoint_timeout: 10min
postgres_work_mem:  12MB
postgres_maintenance_work_mem: 128MB

#####################################################################################################
#                                Object Storage BUCKET config                                       #
#####################################################################################################
# --- minio auth Web and Console admin params
s3_http_admin_user: "{{ vault_minio_http_admin_user }}"
s3_http_admin_pass: "{{ vault_minio_http_admin_pass }}"
# --- bucket params    
bucket_name: "{{ vault_bucket_name }}"
bucket_access_key: "{{ vault_bucket_access_key }}"
bucket_secret_key: "{{ vault_bucket_secret_key }}"

# --- if your bucket doesn't need region, leave this value (us-east-1)
bucket_region: us-east-1

# --- if your bucket use a selfsigned SSL cert, uncomment and put this value to true
# bucket_ssl_selfsigned: True

# --- if you have your own bucket (standalone host or cloud service) put here the URL
# --- example VULTR: https://ewr1.vultrobjects.com
# --- example Digital Ocean: https://sfo3.digitaloceanspaces.com
# --- example onpremise: https://192.168.100.10
bucket_url: "{{ vault_bucket_url }}"
bucket_endpoint: "{{ bucket_url }}"
bucket_endpoint_internal: "{{ bucket_url }}"

#####################################################################################################
#                                       TTS & STT                                      #
#####################################################################################################

# openai, gemini, gcp (google cloud STT) or local (faster-whisper)
callrec_transcriptions_engine: local
# for Gemini STT use the API key from the Google Cloud project
# for OpenAI STT use the API key from the OpenAI account
callrec_transcriber_api_key: "{{ vault_callrec_transcriber_api_key }}"
# for GCP (google clou platform speach to text) you have to provide the google credentials json file
# you must place them inside instances/tenant_name_folder/ with the name: google_credentials.json.

#####################################################################################################
#                              ACD (Automatic Call Distribution)                                    #
#####################################################################################################
# --- Asterisk AMI params
ami_user: "{{ vault_acd_api_user }}"
ami_password: "{{ vault_acd_api_password }}"
acd_rtp_port_min: 40000
acd_rtp_port_max: 50000

# --- Log level for ACD
acd_log_level: info

# If you set asterisk_scale to true, then you must assign values to
# asterisk_mem_limit, asterisk_pjsip_threadpool_idle_timeout & asterisk_pjsip_threadpool_max_size
# https://docs.asterisk.org/Deployment/Performance-Tuning/ 

# acd_pod_cpus: 1

# asterisk_scale: true
# asterisk_mem_limit: 1G
# asterisk_pjsip_threadpool_idle_timeout: 120
# asterisk_pjsip_threadpool_max_size: 25 # 25 for 4 cores, 50 for 8 cores
# asterisk_pjsip_threadpool_initial_size=8 # number of cores x 2
# asterisk_pjsip_threadpool_auto_increment=5
# asterisk_pjsip_timer_t1=100
# asterisk_pjsip_timer_b=6400
# asterisk_stasis_initial_size = 10
# asterisk_stasis_idle_timeout_sec = 120
# asterisk_stasis_max_size = 60

# voicebot integration
# voicebot_headers_vars: X-Voicebot-callID: business_id|X-Voicebot-customerID: id_customer|X-Voicebot-CampID: camp_id
#####################################################################################################
#                                       REDIS                                                       #
#####################################################################################################
# Redis performance tuning
# https://loadforge.com/guides/enhancing-redis-performance-top-configuration-tweaks-to-accelerate-data-access
# scale_redis: True
# redis_maxmemory: 2gb
# redis_maxmemory_policy: allkeys-lru
# redis_tcp_backlog: 511
# redis_maxclients: 2000
# redis_lazyfree_lazy_eviction: yes
# redis_lazyfree_lazy_expire: yes

#####################################################################################################
#                                       TELEPHONY EDGE PROXY                                        #
#####################################################################################################
# kamailio shm & pkg memory params 
# https://www.kamailio.org/wiki/tutorials/troubleshooting/memory

kamailio_shm_size: 512
kamailio_pkg_size: 64
kamailio_certs_location: /etc/kamailio/certs

# --- Kamailio log level
# --- 0: Error, 1: Warning, 2: Debug
kamailio_log_level: 0

# --- Kamailio VoIP Edge Proxy
# if you have your own instances put here the IP or hostname, otherwise leave commented
# kamailio_pstn_host: 172.16.201.2
kamailio_pstn_port: 5060

kamailio_webrtc_iface: eth1

# --- RTPengine VoIP Edge Proxy
# if you have your own instances put here the IP or hostname, otherwise leave commented
# rtpengine_host: rtpengine.sephir.tech
rtpengine_ctl_port: 22222

# --- RTPengine scenary for SIP & RTP
# --- "custom" instance (you can set your own PJSIP Asterisk contact address and RTPengine interface)
rtpengine_env: prod
# rtpengine_custom_net_cfg: obligatorio en host RTPengine remoto con ACD en LAN:
#   internal/<IP_LAN_RTPE>;external/<IP_WAN_RTPE>
# rtpengine_custom_net_cfg: "internal/10.10.10.19;external/24.199.118.40"
# --- if you want to deploy behind NAT, you must to uncomment and set this IPADDR
# nat_ip_addr: X.X.X.X
# --- RTPengine port range
rtpengine_rtp_port_min: 20000
rtpengine_rtp_port_max: 30000
# --- Log level for RTPengine
# 0 ERROR, 1 WARNING, 2 INFO, 3 DEBUG
rtpengine_log_level: 1
# --- Only if VOIP_ENV=custom, you can set custom RTPENGINE_RTP_ADDR
# --- you can change ${RTPENGINE_HOSTNAME} and ${PUBLIC_IP}
# (https://rtpengine.readthedocs.io/en/latest/rtpengine.html)
# rtpengine_rtp_addr: "internal/${RTPENGINE_HOSTNAME};external/${PUBLIC_IP}"
# If you set scale_rtpengine to true, then you must assign values to 
# rtpengine_timeout, rtpengine_offer-timeout, rtpengine_silent-timeout & rtpengine_final-timeout
# https://rtpengine.readthedocs.io/en/latest/rtpengine.html
# rtpengine_timeout: 15
# rtpengine_offer_timeout: 15
# rtpengine_silent_timeout: 120
# rtpengine_final_timeout: 3600

#####################################################################################################
#                                       DIALER                                                      #
#####################################################################################################

# --- Call attempts per second
dialer_caps: 3
# --- Number of dialer container replicas
dialer_process_campaign_replicas: 5
dialer_process_event_replicas: 1
# --- Log level for Dialer, 0: Error, 1: Warning, 2: Debug
dialer_log_level: 1
# --- Dialer API user & password
dialer_password: "{{ vault_dialer_password }}"

#####################################################################################################
#                                       INTEGRATIONS                                                #
#####################################################################################################

#------------------------------------- Web Proxy setting ----------------------------------
# --- Web Proxy setting
# proxy_url: https://X.X.X.X:PPPP

#------------------------------------- Google Maps ----------------------------------
# --- google maps integration credentials
google_maps_api_key: NULL
google_maps_center: '{ "lat": -31.416668, "lng": -64.183334 }'
google_api_key: "{{ vault_google_api_key }}"
google_cloud_projectid: "{{ vault_google_cloud_projectid }}"

#------------------------------------- Wazuh Agent ----------------------------------
# --- OS agent (FIM / logs) enrolled to a central Wazuh Manager.
# --- El rol se ejecuta cuando wazuh_manager está definido (y wazuh != false).
# --- Override por tenant: instances/<tenant>/vars.yml
# --- Disable por host/tenant: wazuh: false en inventory.yml o vars.yml
#
wazuh: false
# --- IP/FQDN del Manager (obligatorio para instalar). Preferible por tenant en vars.yml
# --- o vía Vault: wazuh_manager: "{{ vault_wazuh_manager }}"
# wazuh_manager: ""
# --- Debe existir exactamente en el Manager (crear el grupo antes del enrollment).
wazuh_agent_group: omnileads_prod
# wazuh_registration_password: "{{ vault_wazuh_registration_password }}"
# wazuh_agent_name: "{{ inventory_hostname }}"

#------------------------------------- Observability ----------------------------------
# --- Observability integrations with Loki & Homer

# --- Request by promtail (Loki server):
loki_url: "{{ vault_loki_url }}"
loki_user: "{{ vault_loki_user }}"
loki_password: "{{ vault_loki_password }}"

# --- HAProxy (host edge): orígenes permitidos para https://<fqdn>/prom (Prometheus bajo
# --- /prom). Si no se define o queda vacío, HAProxy deniega /prom por defecto.
haproxy_prom_allowed_src: "{{ vault_haproxy_prom_allowed_src }}"

# --- Request by Asterisk hep module:
homer_host: "{{ vault_homer_host }}"
homer_port: "{{ vault_homer_port }}"

#------------------------------------- Jitsi Video Calls ----------------------------------
# --- Request by Web-Video Inbound Calls 
# --- Put here the JITSI host URL
# video_host: 

#------------------------------------- CRM Integration ----------------------------------
# --- Request by CRM integration callrec search & list API endpoint
# custom_cors_allowed_origins: https://example1.net,https://example2.com,https://example3.tech
# custom_cors_allow_headers: access-control-allow-origin,cache-control

#####################################################################################################
#                                       BACKUP AUTOMATIONS                                          #
#####################################################################################################
# Enable daily PostgreSQL Database backups into centralized Object Storage bucket

backup_bucket_url: "{{ vault_bucket_url }}"
backup_bucket_name: "{{ vault_backup_bucket_name }}"
backup_bucket_access_key: "{{ vault_bucket_access_key }}"
backup_bucket_secret_key: "{{ vault_bucket_secret_key }}"

# --- if your bucket use a selfsigned SSL cert, uncomment and put this value to true
# backup_bucket_dont_verify_ssl: False

# Time format from 00:00 to 23:59
cron_backup_mm: 00
cron_backup_hh: 01 
