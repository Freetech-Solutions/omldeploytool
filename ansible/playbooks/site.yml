---
# Por capas: datos (statefull/stateless) → edge → cómputo (pods) → AIO.
# Los grupos vacíos se omiten al resolver el patrón de hosts.
- import_playbook: site_core.yml
  vars:
    oml_play_hosts: "data_statefull:data_stateless"

- import_playbook: site_restore.yml
  vars:
    oml_play_hosts: "omlapp_web:omnileads_aio"

- import_playbook: site_core.yml
  vars:
    oml_play_hosts: "edge"

- import_playbook: site_core.yml
  vars:
    oml_play_hosts: "omlapp_web:omlapp_workers:dialer_workers:acd:callrec_processor"

- import_playbook: site_core.yml
  vars:
    oml_play_hosts: "omnileads_aio"
