---
# Invocado desde site.yml con vars: oml_play_hosts (grupos pod + omnileads_aio).
# Si se ejecuta solo, usa el patrón completo.
- name: "OMniLeads site deployment ({{ oml_play_hosts | default('data_statefull:data_stateless:edge:omlapp_web:omlapp_workers:dialer_workers:acd:callrec_processor:omnileads_aio') }})"
  hosts: "{{ oml_play_hosts | default('data_statefull:data_stateless:edge:omlapp_web:omlapp_workers:dialer_workers:acd:callrec_processor:omnileads_aio') }}"
  gather_facts: true
  gather_subset:
    - "!hardware"
    - "!virtual"
    - "!facter"
    - "!ohai"
  vars_files:
    - ../group_vars/all/runtime.yml
    - ../group_vars/all/vault.yml
    - ../group_vars/all/images.yml
    - ../group_vars/all/tenants_global.yml
  pre_tasks:
    - name: Normalize topology and component switches
      ansible.builtin.include_role:
        name: topology_normalize
      tags:
        - always
  roles:
    - role: upgrade_from_2X
      vars:
        upgrade_from_2X_phase: cleanup_systemd
      tags: [upgrade_from_2X, upgrade, prerequisitos]
    - role: upgrade_from_2X
      vars:
        upgrade_from_2X_phase: prepare_apt
      tags: [upgrade_from_2X, upgrade, prerequisitos]
    - role: upgrade_from_2X
      vars:
        upgrade_from_2X_phase: upgrade_to_debian13
      tags: [upgrade_from_2X, upgrade, upgrade_debian13, prerequisitos]
    - role: prerequisitos
      tags: [install, upgrade, update, prerequisitos]
    - role: wazuh-agent
      when: component_wazuh_agent_enabled | bool
      tags: [install, upgrade, update, wazuh-agent]
    # No poner tags en el rol con lista desde Jinja: Ansible la anida y las tareas fallan con
    # "the field 'tags' should be a list of str/int, but the item '[...]' is a list".
    # Los tags van en cada tarea de roles/pods/tasks/main.yml (tags: "{{ pods_role_tags }}").
    - role: pods
    - role: minio
      when: component_minio_enabled | bool
      tags: [install, upgrade, update, minio, data]
    - role: postgresql
      when: component_postgresql_enabled | bool
      tags: [install, upgrade, update, postgres, data]
    - role: upgrade_from_2X
      vars:
        upgrade_from_2X_phase: restore_dbs
      when: upgrade_from_2X | default(false) | bool
      tags: [upgrade_from_2X, upgrade, postgres]
    - role: gearman
      when: component_gearman_enabled | bool
      tags: [install, upgrade, update, gearman, data]
    - role: redis
      when: component_redis_enabled | bool
      tags: [install, upgrade, update, redis, data]
    - role: telephony_edge
      when: component_telephony_edge_enabled | bool
      tags: [install, upgrade, update, telephony-edge, voice]
    - role: haproxy
      when: component_haproxy_enabled | bool
      tags: [install, upgrade, update, haproxy, edge]
    - role: acd
      when: component_acd_enabled | bool
      tags: [install, upgrade, update, acd, voice]
    - role: websockets
      when: component_websockets_enabled | bool
      tags: [install, upgrade, update, websockets, app]
    - role: omlapp
      when: component_omlapp_enabled | bool
      tags: [install, upgrade, update, omlapp, app]
    - role: omlapp_workers
      when: component_omlapp_workers_enabled | bool
      tags: [install, upgrade, update, omlapp_workers, omlapp-workers, omlapp, app]
    - role: interaction_processor
      when: component_interaction_processor_enabled | bool
      tags: [install, upgrade, update, interaction_processor, voice]
    - role: dialer
      when: component_dialer_enabled | bool
      tags: [install, upgrade, update, dialer]
    - role: nginx
      when: component_nginx_enabled | bool
      tags: [install, upgrade, update, nginx, app]
    - role: observability_prometheus
      when: component_observability_prometheus_enabled | bool
      tags: [install, upgrade, update, observability, app]
    - role: observability_promtail
      when: component_observability_promtail_enabled | bool
      tags: [install, upgrade, update, observability]
    - role: addons
      when: component_addons_enabled | bool
      tags: [install, upgrade, update, addons, app]
    - role: qa
      when: component_qa_enabled | bool
      tags: [install, upgrade, update, qa, app]
