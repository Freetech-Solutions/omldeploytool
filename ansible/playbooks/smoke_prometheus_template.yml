---
# Renderiza prometheus.yml sin cargar group_vars (evita vault). Útil para CI / smoke test.
- name: Smoke test — plantilla Prometheus (cluster con edge)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    tenant_id: tenant_smoke_multi
    omni_ip_lan: 10.0.0.1
    oml_tenant_hosts:
      - mock_aio
      - mock_edge
    postgres_host: 10.0.1.1
    redis_host: 10.0.1.2
    gearman_host: 10.0.1.2
    nginx_host: 10.0.1.3
    acd_host: 10.0.1.4
    rtpengine_host: 10.0.1.5
    edge_host: 10.0.1.5
    kamailio_host: 10.0.1.5
    kamailio_pstn_host: 10.0.1.5
    haproxy_metrics_port: 8404
    kamailio_pstn_metrics_port: 9273
    kamailio_webrtc_metrics_port: 9274
  tasks:
    - name: Inventario en memoria para hostvars en el template
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        omni_ip_lan: "{{ item.ip }}"
        groups: "{{ item.groups }}"
      loop:
        - { name: mock_aio, ip: 10.0.1.3, groups: ['mock_tenant_hosts', 'omlapp_web'] }
        - { name: mock_edge, ip: 10.0.1.5, groups: ['mock_tenant_hosts', 'edge'] }

    - name: Renderizar prometheus.yml
      ansible.builtin.template:
        src: ../roles/observability_prometheus/templates/prometheus.yml
        dest: /tmp/oml_prometheus_smoke.yml
        mode: "0644"

    - name: Comprobar YAML válido
      ansible.builtin.set_fact:
        _smoke_parsed: "{{ lookup('file', '/tmp/oml_prometheus_smoke.yml') | from_yaml }}"
      changed_when: false

    - name: Comprobar jobs edge en cluster
      ansible.builtin.assert:
        that:
          - "'tenant_smoke_multi_haproxy' in (_smoke_parsed.scrape_configs | map(attribute='job_name') | list)"
          - "'tenant_smoke_multi_kamailio_pstn' in (_smoke_parsed.scrape_configs | map(attribute='job_name') | list)"
          - "'tenant_smoke_multi_kamailio_webrtc' in (_smoke_parsed.scrape_configs | map(attribute='job_name') | list)"
      changed_when: false

- name: Smoke test — un solo host (equivalente AIO)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    tenant_id: tenant_smoke_aio
    omni_ip_lan: 10.0.0.50
    oml_tenant_hosts:
      - mock_aio_only
    postgres_host: 10.0.0.50
    redis_host: 10.0.0.50
    gearman_host: 10.0.0.50
    nginx_host: 10.0.0.50
    acd_host: 10.0.0.50
    rtpengine_host: 10.0.0.50
    kamailio_host: 10.0.0.50
    kamailio_pstn_host: 10.0.0.50
  tasks:
    - name: Host mock AIO
      ansible.builtin.add_host:
        name: mock_aio_only
        omni_ip_lan: 10.0.0.50
        groups: mock_aio

    - name: Renderizar prometheus.yml (AIO)
      ansible.builtin.template:
        src: ../roles/observability_prometheus/templates/prometheus.yml
        dest: /tmp/oml_prometheus_smoke_aio.yml
        mode: "0644"

    - name: Comprobar YAML válido
      ansible.builtin.set_fact:
        _smoke_parsed_aio: "{{ lookup('file', '/tmp/oml_prometheus_smoke_aio.yml') | from_yaml }}"
      changed_when: false

    - name: Comprobar jobs Kamailio sin HAProxy en AIO
      ansible.builtin.assert:
        that:
          - "'tenant_smoke_aio_haproxy' not in (_smoke_parsed_aio.scrape_configs | map(attribute='job_name') | list)"
          - "'tenant_smoke_aio_kamailio_pstn' in (_smoke_parsed_aio.scrape_configs | map(attribute='job_name') | list)"
          - "'tenant_smoke_aio_kamailio_webrtc' in (_smoke_parsed_aio.scrape_configs | map(attribute='job_name') | list)"
      changed_when: false
