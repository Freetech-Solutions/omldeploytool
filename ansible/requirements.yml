---
# Colecciones de Ansible Galaxy requeridas para el deploy de OMniLeads.
# Versiones exactas, alineadas a ansible-core==2.17.14 (requirements.txt).
# Instalar: ansible-galaxy collection install -r requirements.yml
# Si hay una major más nueva ya instalada: agregar --force (galaxy no downgraded sola).
# No usar --upgrade: sube majors y rompe módulos (p. ej. postgresql 5.x quitó el alias port).
# (ver ansible/bootstrap.sh).
collections:
  # postgresql_db (roles/omlapp, roles/backup). 5.0.0 exige login_port (no port).
  - name: community.postgresql
    version: "5.0.0"

  # podman_volume (prerequisitos) y podman_network (dialer)
  - name: containers.podman
    version: "1.20.2"

  # selinux, mount, sysctl (prerequisitos); callbacks profile_tasks / timer (ansible.cfg)
  - name: ansible.posix
    version: "2.2.2"

  # timezone (prerequisitos) y archive (upgrade_from_2X).
  # 13.x pide ansible-core >=2.18; 12.6.5 es la última que soporta 2.17.
  - name: community.general
    version: "12.6.5"

  # Filtros/lookups de red (ipaddr, json_query, etc.).
  - name: ansible.netcommon
    version: "8.7.0"
  - name: ansible.utils
    version: "6.1.1"
