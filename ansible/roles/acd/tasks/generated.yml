
- name: ACD Set environment variables for this installation
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0640"
    owner: "{{ usuario }}"
    group: "{{ usuario }}"
  register: acd_env_files
  notify: Restart acd services
  loop:
    - { src: "acd-config.env", dest: "/etc/default/acd-config.env" }
    - { src: "acd-fastagi.env", dest: "/etc/default/acd-fastagi.env" }
    - { src: "acd-server.env", dest: "/etc/default/acd-server.env" }
    - { src: "acd-app.env", dest: "/etc/default/acd-app.env" }
  tags:
    - install
    - upgrade
    - update

- name: ACD Deploy systemd/Quadlet templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  register: acd_quadlet_units
  notify: Restart acd services
  loop:
    - { src: acd-server.service, dest: /etc/containers/systemd/acd-server.container, mode: "0644" }
    - { src: acd-app.service, dest: /etc/containers/systemd/acd-app.container, mode: "0644" }
    - { src: acd-config.service, dest: /etc/containers/systemd/acd-config.container, mode: "0644" }
    - { src: acd-fastagi.service, dest: /etc/containers/systemd/acd-fastagi.container, mode: "0644" }
  tags: [install, upgrade, update]

- name: ACD Reload systemd after Quadlet changes
  ansible.builtin.systemd:
    daemon_reload: yes
  when: acd_quadlet_units is changed
  tags: [install, upgrade, update]

- name: ACD Determine changed services
  ansible.builtin.set_fact:
    acd_changed_services: >-
      {{
        (
          (
            [
              'acd-server.service',
              'acd-app.service',
              'acd-config.service',
              'acd-fastagi.service'
            ]
            if acd_env_files is changed else []
          )
          +
          (
            acd_quadlet_units.results | default([])
            | selectattr('changed', 'equalto', true)
            | map(attribute='dest')
            | map('basename')
            | map('replace', '.container', '.service')
            | list
          )
        )
        | unique
        | list
      }}
  changed_when: false
  tags: [install, upgrade, update]

# Workaround podman 5.x + recarga de env en upgrade (host network / acd_trunk_sip_port):
# tras cambios en .container o /etc/default/acd-*.env hay que rearma el pod antes
# de arrancar contenedores; un restart del .pod.service aplica la nueva red host
# y variables (ACD_SIP_*_BIND_*, ARI_URL, etc.).
- name: ACD Reinit acd pod (workaround podman 5.x / env upgrade)
  ansible.builtin.systemd:
    name: "{{ acd_pod_systemd_unit | default('acd-pod.service') }}"
    state: restarted
  when: (acd_quadlet_units is changed) or (acd_env_files is changed)
  tags: [install, upgrade, update]

- name: ACD Ensure acd pod is active
  ansible.builtin.systemd:
    name: "{{ acd_pod_systemd_unit | default('acd-pod.service') }}"
    state: started
    enabled: yes
  tags: [install, upgrade, update]

- name: ACD Enable and start systemd services
  systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - acd-server.service
    - acd-app.service
    - acd-config.service
    - acd-fastagi.service
  tags:
    - install
    - upgrade
    - update
