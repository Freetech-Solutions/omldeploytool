---
- name: ADDON Copy Quadlet container units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/containers/systemd/{{ item.name }}.container"
    mode: "0644"
  loop: "{{ addons_services }}"
  register: addons_quadlet_units
  notify: Restart addons services
  tags:
    - install
    - upgrade
    - update

- name: ADDON Reload systemd after Quadlet changes
  ansible.builtin.systemd:
    daemon_reload: true
  when: addons_quadlet_units is changed
  tags:
    - install
    - upgrade
    - update

- name: ADDON Determine changed services
  ansible.builtin.set_fact:
    addons_changed_services: >-
      {{
        addons_quadlet_units.results | default([])
        | selectattr('changed', 'equalto', true)
        | map(attribute='item.name')
        | map('regex_replace', '$', '.service')
        | list
      }}
  changed_when: false
  tags:
    - install
    - upgrade
    - update

- name: ADDON Enable and start systemd services
  ansible.builtin.systemd:
    name: "{{ item.name }}.service"
    state: started
    enabled: true
  loop: "{{ addons_services }}"
  tags:
    - install
    - upgrade
    - restart
