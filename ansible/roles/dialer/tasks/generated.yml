
- name: DIALER Define managed services
  ansible.builtin.set_fact:
    dialer_managed_services:
      - dialer_api.service
      - dialer_incidence_rules.service
      - dialer_manage_campaign.service
      - dialer_scheduler.service
      - dialer_send_reports.service
      - dialer_render_template.service
  changed_when: false
  tags: [install, upgrade, update]

- name: DIALER Create a podman network
  containers.podman.podman_network:
    name: omnidialer
  failed_when: false
  tags:
    - install
    - upgrade

- name: DIALER Set environment variables for this installation
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0640"
    owner: "{{ usuario }}"
    group: "{{ usuario }}"
  register: dialer_env_files
  notify: Restart dialer pods
  loop:
    - { src: dialer.env, dest: /etc/default/dialer.env }
  tags: [install, upgrade, update]

- name: DIALER Render omnidialer SQL init script
  ansible.builtin.template:
    src: omnidialer.sql
    dest: /etc/omnileads/omnidialer.sql
    mode: "0640"
    owner: "{{ usuario }}"
    group: "{{ usuario }}"
  tags: [install, upgrade, update]

- name: DIALER Deploy Quadlet container templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
  register: dialer_quadlet_units
  notify: Restart dialer pods
  loop:
    - { src: flask.container, dest: /etc/containers/systemd/dialer_api.container, mode: "0644" }
    - { src: incidence_rules.container, dest: /etc/containers/systemd/dialer_incidence_rules.container, mode: "0644" }
    - { src: manage_campaign.container, dest: /etc/containers/systemd/dialer_manage_campaign.container, mode: "0644" }
    - { src: "process_campaign@.container", dest: "/etc/containers/systemd/dialer_process_campaign@.container", mode: "0644" }
    - { src: "process_contact@.container", dest: "/etc/containers/systemd/dialer_process_contact@.container", mode: "0644" }
    - { src: "process_event@.container", dest: "/etc/containers/systemd/dialer_process_event@.container", mode: "0644" }
    - { src: render_template.container, dest: /etc/containers/systemd/dialer_render_template.container, mode: "0644" }
    - { src: schedule_agenda.container, dest: /etc/containers/systemd/dialer_scheduler.container, mode: "0644" }
    - { src: send_reports.container, dest: /etc/containers/systemd/dialer_send_reports.container, mode: "0644" }
  tags: [install, upgrade, update]

- name: DIALER | Validar cantidades de réplicas
  ansible.builtin.assert:
    that:
      - (dialer_process_campaign_replicas | int) >= 0
      - (dialer_process_contact_replicas | int) >= 0
      - (dialer_process_event_replicas | int) >= 0
    fail_msg: "Cantidad de réplicas inválida (debe ser >= 0)."
  tags: [install, upgrade]

# Quadlet genera unidades en daemon-reload; una sola recarga antes de start/restart.
- name: DIALER | systemd daemon-reload (Quadlet + unidades clásicas)
  ansible.builtin.systemd:
    daemon_reload: true
  when: dialer_quadlet_units is changed
  tags: [install, upgrade, update]

- name: DIALER Determine changed services
  ansible.builtin.set_fact:
    dialer_changed_services: >-
      {{
        (
          (
            dialer_managed_services
            if dialer_env_files is changed else []
          )
          +
          (
            dialer_quadlet_units.results | default([])
            | selectattr('changed', 'equalto', true)
            | map(attribute='dest')
            | map('basename')
            | map('replace', '.container', '.service')
            | select('in', dialer_managed_services)
            | list
          )
        )
        | unique
        | list
      }}
  changed_when: false
  tags: [install, upgrade, update]

- name: DIALER Enable and start services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - dialer_api.service
    - dialer_incidence_rules.service
    - dialer_manage_campaign.service
    - dialer_scheduler.service
    - dialer_send_reports.service
    - dialer_render_template.service
  tags: [install, upgrade, update]
