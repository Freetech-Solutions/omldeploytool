# ISO/IEC 27001 — Control 8.9 (Gestión de la configuración):
# Variables centralizadas para jails SSH / Kamailio / HTTPS reproducibles.
#
# ISO/IEC 27001 — Control 8.16 (Monitoreo de actividades):
# Protección contra fuerza bruta SSH, flood SIP y probes HTTPS vía fail2ban + nftables.
---
# Fallbacks del rol. Config operativa en:
#   - group_vars/all/tenants_global.yml (todos los tenants)
#   - instances/<tenant>/vars.yml (override por tenant)
#   - inventory.yml host/group vars (p. ej. fail2ban: false)
#
# Jail sshd en todos los hosts de pods.
# En hosts edge/AIO: kamailio-pstn (PIKE).
# HTTPS: nginx-https (AIO sin grupo edge) o haproxy-https (hosts edge con HAProxy).

fail2ban_bantime: 1h
fail2ban_findtime: 10m
fail2ban_maxretry: 5

# CIDRs/IPs adicionales (bastion, red de admin). Se suman a localhost y omni_ip_lan.
fail2ban_ignoreip_extra: []

# Jail kamailio-pstn + PIKE en Kamailio PSTN (solo hosts edge/AIO).
fail2ban_kamailio_pike: true

# Jail nginx-https (AIO / sin HAProxy edge). Desactivar: fail2ban_nginx_https: false
fail2ban_nginx_https: true
# Jail haproxy-https (grupo edge). Desactivar: fail2ban_haproxy_https: false
fail2ban_haproxy_https: true
# Umbrales propios de probes HTTPS (más altos que SSH para no banear ruido esporádico).
fail2ban_https_bantime: 1h
fail2ban_https_findtime: 10m
fail2ban_https_maxretry: 20
# nftables = solo puertos del jail (80/443); nftables-allports = drop total.
fail2ban_https_banaction: nftables
# Fragmentos regex (alternados con |) que deben aparecer en el request URI.
# Escapar metacaracteres regex (p. ej. \.php). No matchear paths legítimos de OML.
fail2ban_https_probe_patterns:
  - '/\.env'
  - '/\.git'
  - '/wp-admin'
  - '/wp-login'
  - '/xmlrpc'
  - '/phpmyadmin'
  - '/adminer'
  - '/cgi-bin'
  - '/actuator'
  - '/vendor/phpunit'
  - '/HNAP1'
  - '/manager/html'
  - '\.php(?:\?|\s|")'
  - '\.asp(?:\?|\s|")'
  - '\.aspx(?:\?|\s|")'
# Status HTTP que cuentan como fallo junto con un probe pattern.
fail2ban_https_status:
  - 400
  - 401
  - 403
  - 404
  - 444
# Métodos HTTP considerados en el filter.
fail2ban_https_methods:
  - GET
  - POST
  - HEAD
  - PUT
  - DELETE
  - PATCH
  - OPTIONS

fail2ban_package_state: present
fail2ban_service_enabled: true
fail2ban_service_state: started

# Destino del drop-in (no pisa jail.conf de la distro).
fail2ban_jail_d_conf: /etc/fail2ban/jail.d/99-omnileads.conf
fail2ban_filter_kamailio_pike: /etc/fail2ban/filter.d/kamailio-pike.conf
fail2ban_filter_nginx_https: /etc/fail2ban/filter.d/nginx-https.conf
fail2ban_filter_haproxy_https: /etc/fail2ban/filter.d/haproxy-https.conf
