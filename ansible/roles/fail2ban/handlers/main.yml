# ISO/IEC 27001 — Control 8.9: reinicio controlado tras cambios de configuración.
---
- name: restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
    enabled: "{{ fail2ban_service_enabled | bool }}"
    daemon_reload: true
