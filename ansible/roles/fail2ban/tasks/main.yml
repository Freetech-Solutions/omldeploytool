# ISO/IEC 27001 — Control 8.9 (Gestión de la configuración):
# Instalación idempotente de fail2ban (jail SSH + Kamailio PSTN) vía Ansible.
#
# ISO/IEC 27001 — Control 8.16 (Monitoreo de actividades):
# Ban automático de IPs con fuerza bruta SSH / flood SIP (nftables; ufw/firewalld off).
---
- name: FAIL2BAN Ensure EPEL on Rocky or Alma Linux
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_facts['distribution'] in ["Rocky", "AlmaLinux"]

- name: FAIL2BAN Install packages (Debian)
  ansible.builtin.apt:
    name:
      - fail2ban
      - nftables
    state: "{{ fail2ban_package_state }}"
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
  when: ansible_os_family == "Debian"

- name: FAIL2BAN Install packages (Rocky/Alma)
  ansible.builtin.dnf:
    name:
      - fail2ban
      - nftables
    state: "{{ fail2ban_package_state }}"
  when: ansible_facts['distribution'] in ["Rocky", "AlmaLinux"]

- name: FAIL2BAN Parse ITSP IPv4s from itsp_nodes for ignoreip
  ansible.builtin.set_fact:
    fail2ban_itsp_ips: >-
      {{
        (
          (itsp_nodes | default('') | string).split(',')
          | map('trim')
          | reject('equalto', '')
          | map('regex_replace', '^label=', '')
          | map('regex_replace', ':.*$', '')
          | map('trim')
          | select('match', '^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$')
          | list
        )
        if (oml_runs_edge | default(false) | bool)
        else []
      }}

- name: FAIL2BAN Build ignoreip list
  ansible.builtin.set_fact:
    fail2ban_ignoreip_list: >-
      {{
        (['127.0.0.1/8', '::1']
         + (
             groups['all'] | default([])
             | map('extract', hostvars)
             | selectattr('omni_ip_lan', 'defined')
             | map(attribute='omni_ip_lan')
             | select('string')
             | reject('equalto', '')
             | list
           )
         + (
             [omni_ip_wan]
             if (
               (oml_runs_edge | default(false) | bool)
               and (omni_ip_wan is defined)
               and ((omni_ip_wan | string | length) > 0)
             )
             else []
           )
         + (fail2ban_itsp_ips | default([]))
         + (fail2ban_ignoreip_extra | default([]))
        )
        | unique
        | list
      }}

- name: FAIL2BAN Ensure jail.d directory exists
  ansible.builtin.file:
    path: /etc/fail2ban/jail.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: FAIL2BAN Ensure filter.d directory exists
  ansible.builtin.file:
    path: /etc/fail2ban/filter.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - oml_runs_edge | default(false) | bool
    - fail2ban_kamailio_pike | default(true) | bool

- name: FAIL2BAN Deploy Kamailio PIKE filter
  ansible.builtin.template:
    src: kamailio-pike.conf.j2
    dest: "{{ fail2ban_filter_kamailio_pike }}"
    owner: root
    group: root
    mode: '0644'
  notify: restart fail2ban
  when:
    - oml_runs_edge | default(false) | bool
    - fail2ban_kamailio_pike | default(true) | bool

- name: FAIL2BAN Deploy jail drop-in (SSH + optional Kamailio PSTN)
  ansible.builtin.template:
    src: 99-omnileads.conf.j2
    dest: "{{ fail2ban_jail_d_conf }}"
    owner: root
    group: root
    mode: '0644'
  notify: restart fail2ban

- name: FAIL2BAN Ensure fail2ban service is enabled and started
  ansible.builtin.systemd:
    name: fail2ban
    enabled: "{{ fail2ban_service_enabled | bool }}"
    state: "{{ fail2ban_service_state }}"
  when: fail2ban_package_state != "absent"
