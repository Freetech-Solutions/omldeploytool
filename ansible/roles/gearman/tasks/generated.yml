
- name: JOB SERVER Copy Quadlet file
  ansible.builtin.template:
    src: gearman.service
    dest: /etc/containers/systemd/gearman.container
    mode: "0644"
  register: gearman_quadlet_file
  notify: Restart gearman service
  tags:
    - install
    - upgrade
    - update

- name: JOB SERVER Reload systemd after Quadlet changes
  ansible.builtin.systemd:
    daemon_reload: yes
  when: gearman_quadlet_file.changed
  tags:
    - install
    - upgrade
    - update

- name: JOB SERVER Check image cache
  command: podman image exists {{ GEARMAN_IMG }}
  register: gearman_image_cache
  changed_when: false
  failed_when: gearman_image_cache.rc not in [0, 1]
  tags:
    - install
    - upgrade
    - update

- name: JOB SERVER Pull image when missing or forced
  command: podman pull --quiet {{ GEARMAN_IMG }}
  register: gearman_pull
  retries: 3
  delay: 5
  until: gearman_pull is success
  tags:
    - install
    - upgrade
    - update
  when: force_image_pull | bool or gearman_image_cache.rc != 0

- name: JOB SERVER Enable and start service
  systemd:
    name: gearman.service
    state: started
    enabled: yes
  tags:
    - install
    - upgrade
    - update
