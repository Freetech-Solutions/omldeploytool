---
component_haproxy_enabled: false
haproxy_http_port: 80
haproxy_https_port: 443
# Backend nginx: HAProxy hace SSL re-encrypt al 443 de nginx para evitar
# el redirect 301 -> https del server block de nginx en puerto 80, que
# generaba un bucle de redirecciones (HAProxy termina TLS, nginx :80
# redirige a https, el cliente vuelve a HAProxy, ...).
haproxy_backend_port: 443
haproxy_backend_ssl: true
haproxy_backend_ssl_verify: none
haproxy_pem_dir: /etc/omnileads/haproxy
haproxy_pem_file: "{{ haproxy_pem_dir }}/oml.pem"
haproxy_sticky_cookie: SRVID
# Prometheus detrás de HAProxy (path /prom → omni_ip_lan:9090 en omlapp_web / AIO).
haproxy_prom_path_prefix: /prom
haproxy_prom_backend_port: 9090
# Lista de CIDRs permitidos como origen para /prom; vacío = denegar /prom (403).
haproxy_prom_allowed_src: []
# Frontend nativo Prometheus (HAProxy 3.x): bind en omni_ip_lan, solo LAN.
haproxy_metrics_enabled: true
haproxy_metrics_port: 8404
# Vacío = permitir scrape desde redes privadas RFC1918. No reutiliza haproxy_prom_allowed_src
# (ese ACL suele listar IPs públicas para /prom desde Internet).
haproxy_metrics_allowed_src: []
