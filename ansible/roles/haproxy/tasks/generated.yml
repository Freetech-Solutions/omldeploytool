---
- name: HAPROXY Resolve nginx backend peers for this tenant
  ansible.builtin.set_fact:
    haproxy_nginx_peers: >-
      {{
        (
          haproxy_web_peers
          if (haproxy_web_peers | length > 0)
          else haproxy_nodes_peers
        )
      }}
  vars:
    haproxy_structural_groups:
      - all
      - aio_instances
      - cluster_instances
      - omnileads_aio
      - data_statefull
      - data_stateless
      - edge
      - omlapp_web
      - omlapp_workers
      - dialer_workers
      - acd
      - callrec_processor
    haproxy_tenant_group: "{{ (group_names | difference(haproxy_structural_groups)) | first | default('') }}"
    haproxy_tenant_hosts: >-
      {{
        (groups[haproxy_tenant_group] | default([]))
        if (haproxy_tenant_group | length > 0) else []
      }}
    haproxy_web_peers: "{{ haproxy_tenant_hosts | intersect(groups['omlapp_web'] | default([])) | list }}"
    haproxy_nodes_peers: "{{ haproxy_tenant_hosts | intersect(groups['omnileads_aio'] | default([])) | list }}"
  changed_when: false
  tags:
    - install
    - upgrade
    - update

- name: HAPROXY Set Prometheus backend peers (mismo tier que nginx)
  ansible.builtin.set_fact:
    haproxy_prometheus_peers: "{{ haproxy_nginx_peers }}"
  changed_when: false
  tags:
    - install
    - upgrade
    - update

- name: HAPROXY Assert at least one nginx backend exists
  ansible.builtin.assert:
    that:
      - haproxy_nginx_peers | length > 0
    fail_msg: >-
      HAProxy en edge requiere al menos un host backend de nginx del mismo
      tenant: primero busca en omlapp_web y, si no hay, usa omnileads_aio.
      Revisa el inventario.
  tags:
    - install
    - upgrade
    - update

# Resolver IPs vía set_fact (VariableManager) y no dentro del .j2: hostvars[h].omni_ip_lan
# en el template no re-expande referencias anidadas tipo {{ vault_* }} del inventario.
- name: HAPROXY Resolve backend peer LAN IPs
  ansible.builtin.set_fact:
    haproxy_nginx_backend_ips: >-
      {{
        haproxy_nginx_peers
        | map('extract', hostvars, 'omni_ip_lan')
        | map('trim')
        | list
      }}
    haproxy_prometheus_backend_ips: >-
      {{
        haproxy_prometheus_peers
        | map('extract', hostvars, 'omni_ip_lan')
        | map('trim')
        | list
      }}
  changed_when: false
  tags:
    - install
    - upgrade
    - update

- name: HAPROXY Assert backend IPs look like IPv4
  ansible.builtin.assert:
    that:
      - haproxy_nginx_backend_ips | length > 0
      - >-
          (haproxy_nginx_backend_ips
           | select('match', '^\\d+\\.\\d+\\.\\d+\\.\\d+$')
           | list
           | length)
          == (haproxy_nginx_backend_ips | length)
      - >-
          (haproxy_prometheus_backend_ips
           | select('match', '^\\d+\\.\\d+\\.\\d+\\.\\d+$')
           | list
           | length)
          == (haproxy_prometheus_backend_ips | length)
    fail_msg: >-
      omni_ip_lan de peers HAProxy no resolvió a IPv4 (¿referencia vault sin expandir?):
      nginx={{ haproxy_nginx_backend_ips }} prometheus={{ haproxy_prometheus_backend_ips }}
  tags:
    - install
    - upgrade
    - update

- name: HAPROXY Ensure PEM directory exists
  ansible.builtin.file:
    path: "{{ haproxy_pem_dir }}"
    state: directory
    owner: "{{ usuario }}"
    group: "{{ usuario }}"
    mode: "0750"
  tags:
    - install
    - upgrade
    - update

- name: HAPROXY Slurp TLS certificate
  ansible.builtin.slurp:
    src: "{{ certs_location | default('/etc/omnileads/certs') }}/cert.pem"
  register: haproxy_slurp_cert
  tags:
    - install
    - upgrade
    - update

- name: HAPROXY Slurp TLS private key
  ansible.builtin.slurp:
    src: "{{ certs_location | default('/etc/omnileads/certs') }}/key.pem"
  register: haproxy_slurp_key
  tags:
    - install
    - upgrade
    - update

- name: HAPROXY Assemble PEM bundle for HAProxy (cert + key)
  ansible.builtin.copy:
    dest: "{{ haproxy_pem_file }}"
    content: "{{ haproxy_slurp_cert.content | b64decode }}\n{{ haproxy_slurp_key.content | b64decode }}\n"
    owner: "{{ usuario }}"
    group: "{{ usuario }}"
    mode: "0600"
  notify: Restart haproxy service
  tags:
    - install
    - upgrade
    - update

- name: HAPROXY Locate host CA bundle for backend TLS verify
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/ssl/certs/ca-certificates.crt
    - /etc/pki/tls/certs/ca-bundle.crt
  register: haproxy_host_ca_stat
  when:
    - haproxy_backend_ssl | default(false) | bool
    - (haproxy_backend_ssl_verify | default('required')) != 'none'
  tags:
    - install
    - upgrade
    - update

- name: HAPROXY Slurp host CA bundle (if present)
  ansible.builtin.slurp:
    src: "{{ (haproxy_host_ca_stat.results | selectattr('stat.exists') | map(attribute='item') | list | first) }}"
  register: haproxy_slurp_host_ca
  when:
    - haproxy_backend_ssl | default(false) | bool
    - (haproxy_backend_ssl_verify | default('required')) != 'none'
    - haproxy_host_ca_stat is defined
    - (haproxy_host_ca_stat.results | selectattr('stat.exists') | list | length) > 0
  tags:
    - install
    - upgrade
    - update

- name: HAPROXY Assemble backend CA trust store
  ansible.builtin.copy:
    dest: "{{ haproxy_backend_ssl_ca_file }}"
    content: "{{ haproxy_slurp_cert.content | b64decode }}{{ ('\n' ~ (haproxy_slurp_host_ca.content | b64decode)) if (haproxy_slurp_host_ca is defined and haproxy_slurp_host_ca.content is defined) else '' }}\n"
    owner: "{{ usuario }}"
    group: "{{ usuario }}"
    mode: "0644"
  when:
    - haproxy_backend_ssl | default(false) | bool
    - (haproxy_backend_ssl_verify | default('required')) != 'none'
  notify: Restart haproxy service
  tags:
    - install
    - upgrade
    - update

- name: HAPROXY Deploy HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/default/haproxy.cfg
    mode: "0644"
  notify: Restart haproxy service
  tags:
    - install
    - upgrade
    - update

- name: HAPROXY Deploy Quadlet container unit
  ansible.builtin.template:
    src: haproxy.container.j2
    dest: /etc/containers/systemd/haproxy.container
    mode: "0644"
  register: haproxy_quadlet_unit
  notify: Restart haproxy service
  tags:
    - install
    - upgrade
    - update

- name: HAPROXY Reload systemd after Quadlet changes
  ansible.builtin.systemd:
    daemon_reload: true
  when: haproxy_quadlet_unit is changed
  tags:
    - install
    - upgrade
    - update

- name: HAPROXY Enable and start HAProxy service
  ansible.builtin.systemd:
    name: haproxy.service
    state: started
    enabled: true
    daemon_reload: true
  tags:
    - install
    - upgrade
    - update
