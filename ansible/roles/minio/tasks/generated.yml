---
- name: MINIO set environment variables for this installation
  ansible.builtin.template:
    src: minio.env
    dest: /etc/default/minio.env
    mode: "0640"
    owner: "{{ usuario }}"
    group: "{{ usuario }}"
  register: minio_env_file
  notify: Restart minio service
  tags:
    - install
    - upgrade
    - update

- name: MINIO Ensure Quadlet directory exists
  ansible.builtin.file:
    path: /etc/containers/systemd
    state: directory
    mode: "0755"
  tags:
    - install
    - upgrade
    - update

- name: MINIO Copy Quadlet file
  ansible.builtin.template:
    src: minio.service
    dest: /etc/containers/systemd/minio.container
    mode: "0644"
  register: minio_quadlet_file
  notify: Restart minio service
  tags:
    - install
    - upgrade
    - update

- name: MINIO Reload systemd after Quadlet changes
  ansible.builtin.systemd:
    daemon_reload: true
  when: minio_quadlet_file.changed
  tags:
    - install
    - upgrade
    - update

- name: MINIO Enable and start oml minio service
  ansible.builtin.systemd:
    name: minio.service
    state: started
    enabled: yes
  tags:
    - install
    - upgrade

# Imagen mc para tareas de admin contra MinIO en el pod data_statefull (red compartida vía container:minio-server).
- name: MINIO Check mc image cache
  ansible.builtin.command:
    cmd: podman image exists {{ minio_mc_container_image }}
  register: minio_mc_image_cache
  changed_when: false
  failed_when: minio_mc_image_cache.rc not in [0, 1]
  tags:
    - install
    - upgrade
    - update

- name: MINIO Pull mc image for bootstrap tasks when missing or forced
  ansible.builtin.command:
    cmd: podman pull --quiet {{ minio_mc_container_image }}
  register: minio_mc_pull
  retries: 3
  delay: 5
  until: minio_mc_pull is success
  when: force_image_pull | bool or minio_mc_image_cache.rc != 0
  tags:
    - install
    - upgrade
    - update

- name: Force handlers to run immediately (Boot up MinIO)
  meta: flush_handlers
  tags:
    - install
    - upgrade
    - update

- name: MINIO Wait for MinIO to accept connections
  ansible.builtin.wait_for:
    host: "{{ omni_ip_lan }}"
    port: 9000
    timeout: 60
  tags:
    - install
    - upgrade
    - update

- name: MINIO Check whether bootstrap resources already exist
  ansible.builtin.shell: |
    set -euo pipefail
    MC_HOME=$(mktemp -d)
    chmod 700 "$MC_HOME"
    trap 'rm -rf "$MC_HOME"' EXIT

    podman run --rm -v "$MC_HOME:/root/.mc" --network=host {{ minio_mc_container_image }} \
      alias set MINIO http://{{ omni_ip_lan }}:9000 \
      {{ s3_http_admin_user | quote }} \
      {{ s3_http_admin_pass | quote }} >/dev/null

    set +e
    podman run --rm -v "$MC_HOME:/root/.mc" --network=host {{ minio_mc_container_image }} \
      ls MINIO/omnileads >/dev/null 2>&1
    bucket_rc=$?

    podman run --rm -v "$MC_HOME:/root/.mc" --network=host {{ minio_mc_container_image }} \
      admin user info MINIO {{ bucket_access_key | quote }} >/dev/null 2>&1
    user_rc=$?
    set -e

    test "$bucket_rc" -eq 0 -a "$user_rc" -eq 0
  args:
    executable: /bin/bash
  register: minio_bootstrap_state
  changed_when: false
  failed_when: false
  tags:
    - install
    - upgrade
    - update

- name: MINIO bootstrap bucket and S3 user (shared mc config dir)
  ansible.builtin.shell: |
    set -euo pipefail
    MC_HOME=$(mktemp -d)
    chmod 700 "$MC_HOME"
    trap 'rm -rf "$MC_HOME"' EXIT

    # Reintentos por si MinIO tarda un poco más en levantar
    ALIAS_OK=0
    for _ in $(seq 1 15); do
      if podman run --rm -v "$MC_HOME:/root/.mc" --network=host {{ minio_mc_container_image }} \
          alias set MINIO http://{{ omni_ip_lan }}:9000 \
          {{ s3_http_admin_user | quote }} {{ s3_http_admin_pass | quote }}; then
        ALIAS_OK=1
        break
      fi
      sleep 2
    done

    if [ "$ALIAS_OK" -ne 1 ]; then
      echo "No fue posible configurar alias mc contra MinIO" >&2
      exit 1
    fi

    podman run --rm -v "$MC_HOME:/root/.mc" --network=host {{ minio_mc_container_image }} \
      mb MINIO/omnileads || true
    podman run --rm -v "$MC_HOME:/root/.mc" --network=host {{ minio_mc_container_image }} \
      admin user add MINIO {{ bucket_access_key | quote }} {{ bucket_secret_key | quote }} || true
    podman run --rm -v "$MC_HOME:/root/.mc" --network=host {{ minio_mc_container_image }} \
      admin policy attach MINIO readwrite --user {{ bucket_access_key | quote }} || true
  args:
    executable: /bin/bash
  when: minio_env_file.changed or minio_quadlet_file.changed or minio_bootstrap_state.rc != 0
  tags:
    - install
    - upgrade
