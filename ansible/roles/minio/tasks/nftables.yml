---
# ISO/IEC 27001 — Control 8.9 / 8.22:
# Restrict TCP/minio_api_port and TCP/minio_console_port on the MinIO host to
# inventory omni_ip_lan (+ local Podman bridge + optional extras).
# Dedicated nft table; no flush ruleset.
- name: MINIO NFT Install nftables package (Debian)
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
  when: ansible_os_family == "Debian"
  tags:
    - install
    - upgrade
    - update

- name: MINIO NFT Ensure EPEL on Rocky or Alma Linux
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_facts['distribution'] in ["Rocky", "AlmaLinux"]
  tags:
    - install
    - upgrade
    - update

- name: MINIO NFT Install nftables package (Rocky/Alma)
  ansible.builtin.dnf:
    name: nftables
    state: present
  when: ansible_facts['distribution'] in ["Rocky", "AlmaLinux"]
  tags:
    - install
    - upgrade
    - update

- name: MINIO NFT Inspect omnileads Podman network
  ansible.builtin.command:
    argv:
      - podman
      - network
      - inspect
      - "{{ oml_network | default('omnileads') }}"
  register: minio_nftables_bridge_inspect
  changed_when: false
  failed_when: false
  tags:
    - install
    - upgrade
    - update

- name: MINIO NFT Parse bridge IPv4 subnets
  ansible.builtin.set_fact:
    minio_nftables_bridge_cidrs: "{{ _minio_nft_bridge_cidrs }}"
  vars:
    _minio_nft_networks: "{{ (minio_nftables_bridge_inspect.stdout | from_json) if ((minio_nftables_bridge_inspect.rc | default(1)) == 0 and ((minio_nftables_bridge_inspect.stdout | default('', true) | length) > 0)) else [] }}"
    _minio_nft_bridge_cidrs: "{{ ((_minio_nft_networks | first | default({})).subnets | default([]) | map(attribute='subnet') | map('string') | map('trim') | reject('equalto', '') | select('match', '^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+/[0-9]+$') | list) if ((_minio_nft_networks | type_debug == 'list') and ((_minio_nft_networks | length) > 0)) else [] }}"
  tags:
    - install
    - upgrade
    - update

# Mismo criterio que topology_normalize: omni_ip_lan o, si falta/vacío, ansible_host.
# to_json/from_json evita acumulación en loop y coerciones de listas con >-.
- name: MINIO NFT Resolve inventory LAN CIDRs
  ansible.builtin.set_fact:
    minio_nftables_lan_cidrs: "{{ _nft_lan_json | from_json }}"
  vars:
    _nft_lan_json: |
      {% set ns = namespace(cidrs=[]) %}
      {% for h in groups['all'] | default([]) %}
      {% set ip = hostvars[h].omni_ip_lan | default(hostvars[h].ansible_host | default('', true), true) | string | trim %}
      {% if ip is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$') %}
      {% set ns.cidrs = ns.cidrs + [ip ~ '/32'] %}
      {% endif %}
      {% endfor %}
      {{ ns.cidrs | unique | list | to_json }}
  tags:
    - install
    - upgrade
    - update

- name: MINIO NFT Build client allowlist
  ansible.builtin.set_fact:
    minio_nftables_clients: "{{ (_lan + _bridge + _extra + _self) | unique | list }}"
  vars:
    _lan: "{{ minio_nftables_lan_cidrs | default([]) }}"
    _bridge: "{{ minio_nftables_bridge_cidrs | default([]) }}"
    _extra: "{{ (minio_nftables_extra_src | default([]) | map('string') | map('trim') | reject('equalto', '') | list) }}"
    _self_ip: "{{ omni_ip_lan | default(ansible_host | default('', true), true) | string | trim }}"
    _self: "{{ [(_self_ip ~ '/32')] if (_self_ip is match('^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$')) else [] }}"
  tags:
    - install
    - upgrade
    - update

- name: MINIO NFT Fail when allowlist is empty
  ansible.builtin.assert:
    that:
      - (minio_nftables_clients | length) > 0
    fail_msg: >-
      minio_nftables_clients quedó vacío
      (lan={{ minio_nftables_lan_cidrs | default([]) | length }},
      bridge={{ minio_nftables_bridge_cidrs | default([]) | length }},
      extra={{ minio_nftables_extra_src | default([]) | length }},
      host={{ inventory_hostname }},
      omni_ip_lan={{ omni_ip_lan | default('') }},
      ansible_host={{ ansible_host | default('') }}).
      No se aplica el drop de TCP/{{ minio_api_port }} y TCP/{{ minio_console_port }}.
  tags:
    - install
    - upgrade
    - update

- name: MINIO NFT Render allowlist rules
  ansible.builtin.template:
    src: oml-minio.nft.j2
    dest: "{{ minio_nftables_rules_path }}"
    mode: "0644"
    owner: root
    group: root
  register: minio_nftables_rules_file
  tags:
    - install
    - upgrade
    - update

- name: MINIO NFT Validate rules syntax
  ansible.builtin.command:
    argv:
      - nft
      - -c
      - -f
      - "{{ minio_nftables_rules_path }}"
  changed_when: false
  tags:
    - install
    - upgrade
    - update

- name: MINIO NFT Apply allowlist rules
  ansible.builtin.command:
    argv:
      - nft
      - -f
      - "{{ minio_nftables_rules_path }}"
  register: minio_nftables_apply
  changed_when: minio_nftables_rules_file.changed
  tags:
    - install
    - upgrade
    - update

- name: MINIO NFT Install systemd unit for boot reload
  ansible.builtin.template:
    src: oml-minio-nft.service.j2
    dest: "/etc/systemd/system/{{ minio_nftables_unit }}"
    mode: "0644"
    owner: root
    group: root
  register: minio_nftables_unit_file
  tags:
    - install
    - upgrade
    - update

- name: MINIO NFT Enable and start systemd unit
  ansible.builtin.systemd:
    name: "{{ minio_nftables_unit }}"
    enabled: true
    state: "{{ 'restarted' if (minio_nftables_rules_file.changed or minio_nftables_unit_file.changed) else 'started' }}"
    daemon_reload: "{{ minio_nftables_unit_file.changed }}"
  tags:
    - install
    - upgrade
    - update
