---
# ISO/IEC 27001 — Control 8.9 / 8.22:
# Restrict omlapp_web PublishPorts: TCP/9191 (stats) always; TCP/80+443 only when
# group edge exists (HAProxy backend). Dedicated nft table; no flush ruleset.
- name: NGINX NFT Install nftables package (Debian)
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
  when: ansible_os_family == "Debian"
  tags:
    - install
    - upgrade
    - update
    - nginx
    - app

- name: NGINX NFT Ensure EPEL on Rocky or Alma Linux
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_facts['distribution'] in ["Rocky", "AlmaLinux"]
  tags:
    - install
    - upgrade
    - update
    - nginx
    - app

- name: NGINX NFT Install nftables package (Rocky/Alma)
  ansible.builtin.dnf:
    name: nftables
    state: present
  when: ansible_facts['distribution'] in ["Rocky", "AlmaLinux"]
  tags:
    - install
    - upgrade
    - update
    - nginx
    - app

- name: NGINX NFT Inspect omnileads Podman network
  ansible.builtin.command:
    argv:
      - podman
      - network
      - inspect
      - "{{ oml_network | default('omnileads') }}"
  register: nginx_nftables_bridge_inspect
  changed_when: false
  failed_when: false
  tags:
    - install
    - upgrade
    - update
    - nginx
    - app

- name: NGINX NFT Parse bridge IPv4 subnets
  ansible.builtin.set_fact:
    nginx_nftables_bridge_cidrs: "{{ _nginx_nft_bridge_cidrs }}"
  vars:
    _nginx_nft_networks: "{{ (nginx_nftables_bridge_inspect.stdout | from_json) if ((nginx_nftables_bridge_inspect.rc | default(1)) == 0 and ((nginx_nftables_bridge_inspect.stdout | default('', true) | length) > 0)) else [] }}"
    _nginx_nft_bridge_cidrs: "{{ ((_nginx_nft_networks | first | default({})).subnets | default([]) | map(attribute='subnet') | map('string') | map('trim') | reject('equalto', '') | select('match', '^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+/[0-9]+$') | list) if ((_nginx_nft_networks | type_debug == 'list') and ((_nginx_nft_networks | length) > 0)) else [] }}"
  tags:
    - install
    - upgrade
    - update
    - nginx
    - app

# Mismo criterio que topology_normalize: omni_ip_lan o, si falta/vacío, ansible_host.
# to_json/from_json evita acumulación en loop y coerciones de listas con >-.
- name: NGINX NFT Resolve inventory LAN CIDRs
  ansible.builtin.set_fact:
    nginx_nftables_lan_cidrs: "{{ _nft_lan_json | from_json }}"
  vars:
    _nft_lan_json: |
      {% set ns = namespace(cidrs=[]) %}
      {% for h in groups['all'] | default([]) %}
      {% set ip = hostvars[h].omni_ip_lan | default(hostvars[h].ansible_host | default('', true), true) | string | trim %}
      {% if ip is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$') %}
      {% set ns.cidrs = ns.cidrs + [ip ~ '/32'] %}
      {% endif %}
      {% endfor %}
      {{ ns.cidrs | unique | list | to_json }}
  tags:
    - install
    - upgrade
    - update
    - nginx
    - app

- name: NGINX NFT Build stats client allowlist (TCP/9191)
  ansible.builtin.set_fact:
    nginx_nftables_stats_clients: "{{ (_lan + _bridge + _extra + _self) | unique | list }}"
  vars:
    _lan: "{{ nginx_nftables_lan_cidrs | default([]) }}"
    _bridge: "{{ nginx_nftables_bridge_cidrs | default([]) }}"
    _extra: "{{ (nginx_nftables_extra_src | default([]) | map('string') | map('trim') | reject('equalto', '') | list) }}"
    _self_ip: "{{ omni_ip_lan | default(ansible_host | default('', true), true) | string | trim }}"
    _self: "{{ [(_self_ip ~ '/32')] if (_self_ip is match('^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$')) else [] }}"
  tags:
    - install
    - upgrade
    - update
    - nginx
    - app

- name: NGINX NFT Decide whether to filter HTTP/HTTPS (group edge present)
  ansible.builtin.set_fact:
    nginx_nftables_http_enabled: "{{ (groups['edge'] | default([]) | length) > 0 }}"
  tags:
    - install
    - upgrade
    - update
    - nginx
    - app

- name: NGINX NFT Resolve edge LAN CIDRs
  ansible.builtin.set_fact:
    nginx_nftables_edge_lan_cidrs: "{{ _nft_edge_json | from_json }}"
  vars:
    _nft_edge_json: |
      {% set ns = namespace(cidrs=[]) %}
      {% for h in ((groups['edge'] | default([])) + (groups['omnileads_aio'] | default([]))) | unique %}
      {% set ip = hostvars[h].omni_ip_lan | default(hostvars[h].ansible_host | default('', true), true) | string | trim %}
      {% if ip is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$') %}
      {% set ns.cidrs = ns.cidrs + [ip ~ '/32'] %}
      {% endif %}
      {% endfor %}
      {{ ns.cidrs | unique | list | to_json }}
  when: nginx_nftables_http_enabled | bool
  tags:
    - install
    - upgrade
    - update
    - nginx
    - app

- name: NGINX NFT Build edge client allowlist (TCP/80+443)
  ansible.builtin.set_fact:
    nginx_nftables_edge_clients: "{{ (['127.0.0.1/8'] + _edge + _extra + _self) | unique | list }}"
  vars:
    _edge: "{{ nginx_nftables_edge_lan_cidrs | default([]) }}"
    _extra: "{{ (nginx_nftables_extra_src | default([]) | map('string') | map('trim') | reject('equalto', '') | list) }}"
    _self_ip: "{{ omni_ip_lan | default(ansible_host | default('', true), true) | string | trim }}"
    _self: "{{ [(_self_ip ~ '/32')] if ((oml_runs_edge | default(false) | bool) and (_self_ip is match('^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$'))) else [] }}"
  when: nginx_nftables_http_enabled | bool
  tags:
    - install
    - upgrade
    - update
    - nginx
    - app

- name: NGINX NFT Fail when allowlists are empty
  ansible.builtin.assert:
    that:
      - (nginx_nftables_stats_clients | length) > 0
      - (not (nginx_nftables_http_enabled | bool)) or ((nginx_nftables_edge_clients | default([]) | length) > 0)
    fail_msg: >-
      nginx_nftables allowlist vacío
      (stats={{ nginx_nftables_stats_clients | default([]) | length }},
      http_enabled={{ nginx_nftables_http_enabled | default(false) }},
      edge={{ nginx_nftables_edge_clients | default([]) | length }},
      host={{ inventory_hostname }},
      omni_ip_lan={{ omni_ip_lan | default('') }},
      ansible_host={{ ansible_host | default('') }}).
      No se aplica el drop de TCP/9191 (ni 80/443 si hay grupo edge).
  tags:
    - install
    - upgrade
    - update
    - nginx
    - app

- name: NGINX NFT Render allowlist rules
  ansible.builtin.template:
    src: oml-nginx.nft.j2
    dest: "{{ nginx_nftables_rules_path }}"
    mode: "0644"
    owner: root
    group: root
  register: nginx_nftables_rules_file
  tags:
    - install
    - upgrade
    - update
    - nginx
    - app

- name: NGINX NFT Validate rules syntax
  ansible.builtin.command:
    argv:
      - nft
      - -c
      - -f
      - "{{ nginx_nftables_rules_path }}"
  changed_when: false
  tags:
    - install
    - upgrade
    - update
    - nginx
    - app

- name: NGINX NFT Apply allowlist rules
  ansible.builtin.command:
    argv:
      - nft
      - -f
      - "{{ nginx_nftables_rules_path }}"
  register: nginx_nftables_apply
  changed_when: nginx_nftables_rules_file.changed
  tags:
    - install
    - upgrade
    - update
    - nginx
    - app

- name: NGINX NFT Install systemd unit for boot reload
  ansible.builtin.template:
    src: oml-nginx-nft.service.j2
    dest: "/etc/systemd/system/{{ nginx_nftables_unit }}"
    mode: "0644"
    owner: root
    group: root
  register: nginx_nftables_unit_file
  tags:
    - install
    - upgrade
    - update
    - nginx
    - app

- name: NGINX NFT Enable and start systemd unit
  ansible.builtin.systemd:
    name: "{{ nginx_nftables_unit }}"
    enabled: true
    state: "{{ 'restarted' if (nginx_nftables_rules_file.changed or nginx_nftables_unit_file.changed) else 'started' }}"
    daemon_reload: "{{ nginx_nftables_unit_file.changed }}"
  tags:
    - install
    - upgrade
    - update
    - nginx
    - app
