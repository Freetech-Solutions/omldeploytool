---
- name: OBSERVABILITY Ensure Prometheus config directory exists
  ansible.builtin.file:
    path: /etc/prometheus
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - install
    - upgrade
    - observability

- name: OBSERVABILITY Normalize prometheus_host for compute tier (AIO, HA o omnileads_nodes)
  ansible.builtin.set_fact:
    prometheus_host: "127.0.0.1"
  changed_when: false
  when:
    - prometheus_host is not defined
    - oml_is_compute | default(false)
  tags:
    - install
    - upgrade
    - update
    - observability

- name: OBSERVABILITY Start podman.socket on RedHat compatible distros
  ansible.builtin.systemd:
    name: podman.socket
    state: started
    enabled: true
    daemon_reload: true
  when: ansible_facts['distribution'] in ["Rocky", "AlmaLinux"]
  tags:
    - install
    - upgrade
    - observability

- name: OBSERVABILITY Render Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: root
    mode: "0644"
  register: observability_prometheus_config
  notify: Restart observability services
  tags:
    - install
    - upgrade
    - observability

- name: OBSERVABILITY Render Prometheus Quadlet units
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/containers/systemd/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  register: observability_quadlet_units
  notify: Restart observability services
  loop:
    - prometheus.container
    - prometheus_uwsgi.container
    - prometheus_podman_exporter.container
    - prometheus_postgres.container
    - prometheus_redis.container
    - prometheus_node_exporter.container
    - prometheus_gearman.container
  tags:
    - install
    - upgrade
    - observability

- name: OBSERVABILITY Reload systemd after Quadlet changes
  ansible.builtin.systemd:
    daemon_reload: true
  when: observability_quadlet_units is changed
  tags:
    - install
    - upgrade
    - observability

- name: OBSERVABILITY Render exporter environments
  ansible.builtin.template:
    src: "{{ item }}"
    dest: /etc/default/{{ item }}
    owner: "{{ usuario }}"
    group: "{{ usuario }}"
    mode: "0640"
  register: observability_exporter_envs
  notify: Restart observability services
  loop:
    - prometheus_postgres.env
    - prometheus_redis.env
  tags:
    - install
    - upgrade
    - observability

- name: OBSERVABILITY Determine changed services
  ansible.builtin.set_fact:
    observability_changed_services: >-
      {{
        (
          (
            ['prometheus.service']
            if observability_prometheus_config.changed else []
          )
          +
          (
            observability_quadlet_units.results | default([])
            | selectattr('changed', 'equalto', true)
            | map(attribute='dest')
            | map('basename')
            | map('replace', '.container', '.service')
            | list
          )
          +
          (
            observability_exporter_envs.results | default([])
            | selectattr('changed', 'equalto', true)
            | map(attribute='dest')
            | map('basename')
            | map('replace', '.env', '.service')
            | list
          )
        )
        | unique
        | list
      }}
  changed_when: false
  tags:
    - install
    - upgrade
    - observability

- name: OBSERVABILITY Enable and start Prometheus services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - prometheus.service
    - prometheus_uwsgi.service
    - prometheus_podman_exporter.service
    - prometheus_postgres.service
    - prometheus_redis.service
    - prometheus_node_exporter.service
    - prometheus_gearman.service
  tags:
    - install
    - upgrade
    - observability
