---
- name: OBSERVABILITY Ensure Prometheus config directory exists
  ansible.builtin.file:
    path: /etc/prometheus
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - install
    - upgrade
    - observability

- name: OBSERVABILITY Normalize prometheus_host for compute tier (AIO o hosts de cómputo / pod)
  ansible.builtin.set_fact:
    prometheus_host: "127.0.0.1"
  changed_when: false
  when:
    - prometheus_host is not defined
    - oml_is_compute | default(false)
  tags:
    - install
    - upgrade
    - update
    - observability

- name: OBSERVABILITY Start podman.socket on RedHat compatible distros
  ansible.builtin.systemd:
    name: podman.socket
    state: started
    enabled: true
    daemon_reload: true
  when: ansible_facts['distribution'] in ["Rocky", "AlmaLinux"]
  tags:
    - install
    - upgrade
    - observability

- name: OBSERVABILITY Derive Quadlets and envs per topology tier
  ansible.builtin.set_fact:
    observability_render_prometheus_yml: "{{ oml_runs_omlapp_web | default(false) | bool }}"
    observability_quadlets: >-
      {{
        (
          ['prometheus_node_exporter.container', 'prometheus_podman_exporter.container']
          + (['prometheus.container', 'prometheus_uwsgi.container'] if (oml_runs_omlapp_web | default(false) | bool) else [])
          + (['prometheus_postgres.container'] if (oml_runs_data_statefull | default(false) | bool) else [])
          + (['prometheus_redis.container', 'prometheus_gearman.container'] if (oml_runs_data_stateless | default(false) | bool) else [])
        )
      }}
    observability_envs: >-
      {{
        (
          (['prometheus_postgres.env'] if (oml_runs_data_statefull | default(false) | bool) else [])
          + (['prometheus_redis.env'] if (oml_runs_data_stateless | default(false) | bool) else [])
        )
      }}
  changed_when: false
  tags:
    - install
    - upgrade
    - update
    - observability

- name: OBSERVABILITY Render Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: root
    mode: "0644"
  register: observability_prometheus_config
  notify: Restart observability services
  when: observability_render_prometheus_yml | bool
  tags:
    - install
    - upgrade
    - observability

- name: OBSERVABILITY Render Prometheus Quadlet units
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/containers/systemd/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  register: observability_quadlet_units
  notify: Restart observability services
  loop: "{{ observability_quadlets }}"
  when: observability_quadlets | length > 0
  tags:
    - install
    - upgrade
    - observability

- name: OBSERVABILITY Reload systemd after Quadlet changes
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - observability_quadlet_units is defined
    - observability_quadlet_units is changed
  tags:
    - install
    - upgrade
    - observability

- name: OBSERVABILITY Render exporter environments
  ansible.builtin.template:
    src: "{{ item }}"
    dest: /etc/default/{{ item }}
    owner: "{{ usuario }}"
    group: "{{ usuario }}"
    mode: "0640"
  register: observability_exporter_envs
  notify: Restart observability services
  loop: "{{ observability_envs }}"
  when: observability_envs | length > 0
  tags:
    - install
    - upgrade
    - observability

- name: OBSERVABILITY Determine changed services
  ansible.builtin.set_fact:
    observability_changed_services: >-
      {{
        (
          (
            ['prometheus.service']
            if (
              observability_render_prometheus_yml | default(false) | bool
              and observability_prometheus_config is defined
              and observability_prometheus_config is changed
            )
            else []
          )
          +
          (
            (observability_quadlet_units | default({'results': []})).results
            | selectattr('changed', 'equalto', true)
            | map(attribute='dest')
            | map('basename')
            | map('replace', '.container', '.service')
            | list
          )
          +
          (
            (observability_exporter_envs | default({'results': []})).results
            | selectattr('changed', 'equalto', true)
            | map(attribute='dest')
            | map('basename')
            | map('replace', '.env', '.service')
            | list
          )
        )
        | unique
        | list
      }}
  changed_when: false
  tags:
    - install
    - upgrade
    - observability

- name: OBSERVABILITY Enable and start Prometheus services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop: >-
    {{
      observability_quadlets
      | map('replace', '.container', '.service')
      | list
    }}
  when: observability_quadlets | length > 0
  tags:
    - install
    - upgrade
    - observability

- name: OBSERVABILITY Validate scrape reachability from Prometheus host
  ansible.builtin.import_tasks: validate_scrape.yml
  when: oml_runs_omlapp_web | default(false) | bool
  tags:
    - install
    - upgrade
    - validate
    - observability
