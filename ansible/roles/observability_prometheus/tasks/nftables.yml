---
# ISO/IEC 27001 — Control 8.9 / 8.22:
# Restrict observability PublishPorts (exporters / Prometheus) to inventory
# omni_ip_lan (+ local Podman bridge + optional extras). Dedicated nft table.
- name: OBSERVABILITY NFT Install nftables package (Debian)
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
  when: ansible_os_family == "Debian"
  tags:
    - install
    - upgrade
    - update
    - observability

- name: OBSERVABILITY NFT Ensure EPEL on Rocky or Alma Linux
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: ansible_facts['distribution'] in ["Rocky", "AlmaLinux"]
  tags:
    - install
    - upgrade
    - update
    - observability

- name: OBSERVABILITY NFT Install nftables package (Rocky/Alma)
  ansible.builtin.dnf:
    name: nftables
    state: present
  when: ansible_facts['distribution'] in ["Rocky", "AlmaLinux"]
  tags:
    - install
    - upgrade
    - update
    - observability

- name: OBSERVABILITY NFT Inspect omnileads Podman network
  ansible.builtin.command:
    argv:
      - podman
      - network
      - inspect
      - "{{ oml_network | default('omnileads') }}"
  register: observability_nftables_bridge_inspect
  changed_when: false
  failed_when: false
  tags:
    - install
    - upgrade
    - update
    - observability

- name: OBSERVABILITY NFT Parse bridge IPv4 subnets
  ansible.builtin.set_fact:
    observability_nftables_bridge_cidrs: "{{ _obs_nft_bridge_cidrs }}"
  vars:
    _obs_nft_networks: "{{ (observability_nftables_bridge_inspect.stdout | from_json) if ((observability_nftables_bridge_inspect.rc | default(1)) == 0 and ((observability_nftables_bridge_inspect.stdout | default('', true) | length) > 0)) else [] }}"
    _obs_nft_bridge_cidrs: "{{ ((_obs_nft_networks | first | default({})).subnets | default([]) | map(attribute='subnet') | map('string') | map('trim') | reject('equalto', '') | select('match', '^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+/[0-9]+$') | list) if ((_obs_nft_networks | type_debug == 'list') and ((_obs_nft_networks | length) > 0)) else [] }}"
  tags:
    - install
    - upgrade
    - update
    - observability

# Mismo criterio que topology_normalize: omni_ip_lan o, si falta/vacío, ansible_host.
# to_json/from_json evita acumulación en loop y coerciones de listas con >-.
- name: OBSERVABILITY NFT Resolve inventory LAN CIDRs
  ansible.builtin.set_fact:
    observability_nftables_lan_cidrs: "{{ _nft_lan_json | from_json }}"
  vars:
    _nft_lan_json: |
      {% set ns = namespace(cidrs=[]) %}
      {% for h in groups['all'] | default([]) %}
      {% set ip = hostvars[h].omni_ip_lan | default(hostvars[h].ansible_host | default('', true), true) | string | trim %}
      {% if ip is match('^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$') %}
      {% set ns.cidrs = ns.cidrs + [ip ~ '/32'] %}
      {% endif %}
      {% endfor %}
      {{ ns.cidrs | unique | list | to_json }}
  tags:
    - install
    - upgrade
    - update
    - observability

- name: OBSERVABILITY NFT Build client allowlist
  ansible.builtin.set_fact:
    observability_nftables_clients: "{{ (_lan + _bridge + _extra + _self) | unique | list }}"
  vars:
    _lan: "{{ observability_nftables_lan_cidrs | default([]) }}"
    _bridge: "{{ observability_nftables_bridge_cidrs | default([]) }}"
    _extra: "{{ (observability_nftables_extra_src | default([]) | map('string') | map('trim') | reject('equalto', '') | list) }}"
    _self_ip: "{{ omni_ip_lan | default(ansible_host | default('', true), true) | string | trim }}"
    _self: "{{ [(_self_ip ~ '/32')] if (_self_ip is match('^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$')) else [] }}"
  tags:
    - install
    - upgrade
    - update
    - observability

- name: OBSERVABILITY NFT Build host port list by tier
  ansible.builtin.set_fact:
    observability_nftables_ports: "{{ _ports | unique | list }}"
  vars:
    _ports: "{{ [prometheus_node_exporter_port | default(9100) | int, prometheus_podman_exporter_port | default(9882) | int] + ([prometheus_server_port | default(9090) | int, prometheus_uwsgi_exporter_port | default(9117) | int] if (oml_runs_omlapp_web | default(false) | bool) else []) + ([prometheus_postgres_exporter_port | default(9187) | int] if (oml_runs_data_statefull | default(false) | bool) else []) + ([prometheus_redis_exporter_port | default(9121) | int, prometheus_gearman_exporter_port | default(9418) | int] if (oml_runs_data_stateless | default(false) | bool) else []) + ([dialer_pacing_exporter_port | default(7099) | int] if ((oml_runs_data_stateless | default(false) | bool) and (dialer_engine | default('omnidialer') == 'omnidialer')) else []) }}"
  tags:
    - install
    - upgrade
    - update
    - observability

- name: OBSERVABILITY NFT Fail when allowlist or ports are empty
  ansible.builtin.assert:
    that:
      - (observability_nftables_clients | length) > 0
      - (observability_nftables_ports | length) > 0
    fail_msg: >-
      observability allowlist/ports vacío
      (clients={{ observability_nftables_clients | default([]) | length }},
      ports={{ observability_nftables_ports | default([]) | length }},
      lan={{ observability_nftables_lan_cidrs | default([]) | length }},
      bridge={{ observability_nftables_bridge_cidrs | default([]) | length }},
      host={{ inventory_hostname }},
      omni_ip_lan={{ omni_ip_lan | default('') }},
      ansible_host={{ ansible_host | default('') }}).
  tags:
    - install
    - upgrade
    - update
    - observability

- name: OBSERVABILITY NFT Render allowlist rules
  ansible.builtin.template:
    src: oml-observability.nft.j2
    dest: "{{ observability_nftables_rules_path }}"
    mode: "0644"
    owner: root
    group: root
  register: observability_nftables_rules_file
  tags:
    - install
    - upgrade
    - update
    - observability

- name: OBSERVABILITY NFT Validate rules syntax
  ansible.builtin.command:
    argv:
      - nft
      - -c
      - -f
      - "{{ observability_nftables_rules_path }}"
  changed_when: false
  tags:
    - install
    - upgrade
    - update
    - observability

- name: OBSERVABILITY NFT Apply allowlist rules
  ansible.builtin.command:
    argv:
      - nft
      - -f
      - "{{ observability_nftables_rules_path }}"
  register: observability_nftables_apply
  changed_when: observability_nftables_rules_file.changed
  tags:
    - install
    - upgrade
    - update
    - observability

- name: OBSERVABILITY NFT Install systemd unit for boot reload
  ansible.builtin.template:
    src: oml-observability-nft.service.j2
    dest: "/etc/systemd/system/{{ observability_nftables_unit }}"
    mode: "0644"
    owner: root
    group: root
  register: observability_nftables_unit_file
  tags:
    - install
    - upgrade
    - update
    - observability

- name: OBSERVABILITY NFT Enable and start systemd unit
  ansible.builtin.systemd:
    name: "{{ observability_nftables_unit }}"
    enabled: true
    state: "{{ 'restarted' if (observability_nftables_rules_file.changed or observability_nftables_unit_file.changed) else 'started' }}"
    daemon_reload: "{{ observability_nftables_unit_file.changed }}"
  tags:
    - install
    - upgrade
    - update
    - observability
