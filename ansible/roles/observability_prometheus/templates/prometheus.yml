global:
  scrape_interval:     10s
  evaluation_interval: 10s

scrape_configs:

  - job_name: '{{ tenant_id }}_node'
    static_configs:
{% for h in oml_tenant_hosts %}
      - targets: ['{{ hostvars[h].omni_ip_lan | default(omni_ip_lan) }}:9100']
        labels:
          tenant: '{{ tenant_id }}'
          component: 'os'
          host: '{{ h }}'
{% endfor %}

  - job_name: '{{ tenant_id }}_podman'
    static_configs:
{% for h in oml_tenant_hosts %}
      - targets: ['{{ hostvars[h].omni_ip_lan | default(omni_ip_lan) }}:9882']
        labels:
          tenant: '{{ tenant_id }}'
          component: 'podman'
          host: '{{ h }}'
{% endfor %}

  - job_name: '{{ tenant_id }}_postgres'
    static_configs:
      - targets: ['{{ postgres_host | trim }}:9187']
        labels:
          tenant: '{{ tenant_id }}'
          component: 'postgres'

  - job_name: '{{ tenant_id }}_redis'
    static_configs:
      - targets: ['{{ redis_host | trim }}:9121']
        labels:
          tenant: '{{ tenant_id }}'
          component: 'redis'

  - job_name: '{{ tenant_id }}_gearman'
    static_configs:
      - targets: ['{{ gearman_host | trim }}:9418']
        labels:
          tenant: '{{ tenant_id }}'
          component: 'gearman'

  - job_name: '{{ tenant_id }}_uwsgi'
    static_configs:
      - targets: ['{{ nginx_host | trim }}:9117']
        labels:
          tenant: '{{ tenant_id }}'
          component: 'uwsgi'

  - job_name: '{{ tenant_id }}_asterisk'
    static_configs:
      - targets: ['{{ acd_host | trim }}:7088']
        labels:
          tenant: '{{ tenant_id }}'
          component: 'asterisk'

  - job_name: '{{ tenant_id }}_rtpengine'
    static_configs:
      - targets: ['{{ rtpengine_host | trim }}:22223']
        labels:
          tenant: '{{ tenant_id }}'
          component: 'rtpengine'
