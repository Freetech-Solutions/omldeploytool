server:
  http_listen_port: 9080
  http_listen_address: {{ '0.0.0.0' }}

positions:
  filename: /tmp/positions.yaml
  sync_period: 1m

clients:
{% if tenant_id is defined and tenant_id != '' %}
  - url: http://{{ loki_host | default('127.0.0.1') }}:3100/loki/api/v1/push
    tenant_id: {{ tenant_id }}
{% else %}
  - url: http://{{ loki_host | default('127.0.0.1') }}:3100/loki/api/v1/push
{% endif %}
    batchsize: 1048576
    batchwait: 1s
    backoff_config:
      min_period: 1s
      max_period: 10s

# ============================================
# MACROS — Quadlet units are always *.service in journald
# ============================================
{%- macro journal_service_config(service, node_type) -%}
- job_name: {{ service.name }}
  journal:
    json: false
    max_age: 6h
    path: /var/log/journal
    matches: "_SYSTEMD_UNIT={{ service.unit }}"
    labels:
      job: {{ service.name }}
      tenant: {{ tenant_id | default('unknown') }}
      host: {{ inventory_hostname }}
      node_type: {{ node_type }}
      service_family: {{ service.family }}
  relabel_configs:
    - source_labels: ['__journal__systemd_unit']
      target_label: 'unit'
    - source_labels: ['__journal_container_name']
      target_label: 'container_name'
    - source_labels: ['__journal_container_id']
      regex: '(.{12}).*'
      target_label: 'container_id'
      replacement: '${1}'
{%- endmacro -%}

{%- macro journal_services_block(node_type, services_list) -%}
{% for service in services_list %}
{{ journal_service_config(service, node_type) }}
{% endfor %}
{%- endmacro -%}

{%- macro dialer_worker_type_config(worker_type, node_type) -%}
- job_name: dialer_process_{{ worker_type }}
  journal:
    json: false
    max_age: 6h
    path: /var/log/journal
    labels:
      job: dialer_process_{{ worker_type }}
      tenant: {{ tenant_id | default('unknown') }}
      host: {{ inventory_hostname }}
      node_type: {{ node_type }}
      service_family: dialer
      service_type: worker
      worker_type: {{ worker_type }}
      total_replicas: {{ vars['dialer_process_' ~ worker_type ~ '_replicas'] | default('unknown') }}
  relabel_configs:
    - source_labels: ['__journal__systemd_unit']
      regex: 'dialer_process_{{ worker_type }}@.*\.service'
      action: keep
    - source_labels: ['__journal__systemd_unit']
      target_label: 'unit'
    - source_labels: ['__journal__systemd_unit']
      regex: 'dialer_process_{{ worker_type }}@(.+)\.service'
      target_label: 'instance_id'
      replacement: '${1}'
    - source_labels: ['instance_id']
      target_label: 'worker_instance'
      replacement: '{{ worker_type }}-${1}'
    - source_labels: ['__journal_container_name']
      target_label: 'container_name'
    - source_labels: ['__journal_container_id']
      regex: '(.{12}).*'
      target_label: 'container_id'
      replacement: '${1}'
{%- endmacro -%}

{%- macro dialer_services_config(node_type, services_list) -%}
{% for service in services_list %}
{{ journal_service_config({'name': service, 'unit': service ~ '.service', 'family': 'dialer'}, node_type) }}
{% endfor %}
{%- endmacro -%}

{%- macro dialer_all_services_block() -%}
{% if dialer_engine | default('') == 'omnidialer' %}
{% if inventory_hostname in groups.get('omnileads_aio', []) %}
{% set node_type = 'aio' %}
{% elif inventory_hostname in groups.get('dialer_workers', []) %}
{% set node_type = 'dialer' %}
{% else %}
{% set node_type = 'standalone' %}
{% endif %}
{{ dialer_worker_type_config('campaign', node_type) }}
{{ dialer_worker_type_config('contact', node_type) }}
{{ dialer_worker_type_config('event', node_type) }}
{% set all_dialer_services = [
  'dialer_incidence_rules',
  'dialer_manage_campaign',
  'dialer_scheduler',
  'dialer_render_template',
  'dialer_send_reports',
] %}
{{ dialer_services_config(node_type, all_dialer_services) }}
{% endif %}
{%- endmacro -%}

