---
# Tags: group_vars/all/runtime.yml (`pods_role_tags`); si no existe, roles/pods/defaults `pods_role_tags_default`.
- name: MAIN Resolve pods for this host topology
  ansible.builtin.set_fact:
    pods_quadlets: >-
      {{
        (
          (['data_statefull'] if (oml_runs_data_statefull | default(false) | bool) else []) +
          (['data_stateless'] if (oml_runs_data_stateless | default(false) | bool) else []) +
          (['telephony_edge'] if (oml_runs_edge | default(false) | bool) else []) +
          (['omlapp_web'] if (oml_runs_omlapp_web | default(false) | bool) else []) +
          (['omlapp_workers'] if (oml_runs_omlapp_workers | default(false) | bool) else []) +
          (['dialer_workers'] if (oml_runs_dialer_workers | default(false) | bool) else []) +
          (['acd'] if (oml_runs_acd | default(false) | bool) else []) +
          (['callrec_processor'] if (oml_runs_callrec_processor | default(false) | bool) else []) +
          (['qa'] if (component_qa_enabled | default(false) | bool) else []) +
          (
            ['observability']
            if (
              (oml_runs_data_statefull | default(false) | bool)
              or (oml_runs_data_stateless | default(false) | bool)
              or (oml_runs_edge | default(false) | bool)
              or (oml_runs_omlapp_web | default(false) | bool)
              or (oml_runs_omlapp_workers | default(false) | bool)
              or (oml_runs_dialer_workers | default(false) | bool)
              or (oml_runs_acd | default(false) | bool)
              or (oml_runs_callrec_processor | default(false) | bool)
            ) else []
          )
        ) | unique | list
      }}
  tags: "{{ pods_role_tags | default(pods_role_tags_default) }}"

- name: MAIN Copy Quadlet pod files
  ansible.builtin.template:
    src: "templates/{{ item }}.pod.j2"
    dest: "/etc/containers/systemd/{{ item }}.pod"
    mode: "0644"
  loop: "{{ pods_quadlets }}"
  loop_control:
    label: "{{ item }}"
  register: pods_quadlets_render
  tags: "{{ pods_role_tags | default(pods_role_tags_default) }}"

# Siempre recargar: con loop, a veces `register is changed` no refleja bien el agregado, y sin reload
# systemd no genera las unidades <pod>-pod.service desde los .pod (Quadlet).
- name: MAIN Reload systemd to generate Quadlet pod services
  ansible.builtin.systemd:
    daemon_reload: true
  tags: "{{ pods_role_tags | default(pods_role_tags_default) }}"

- name: MAIN Build list of pods whose Quadlet definition changed
  ansible.builtin.set_fact:
    pods_quadlets_changed: >-
      {{
        pods_quadlets_render.results | default([])
        | selectattr('changed', 'equalto', true)
        | map(attribute='item')
        | list
      }}
  changed_when: false
  tags: "{{ pods_role_tags | default(pods_role_tags_default) }}"

- name: MAIN Enable and start Pod services (unchanged definitions)
  ansible.builtin.systemd:
    name: "{{ item }}-pod.service"
    state: started
    enabled: true
  loop: "{{ pods_quadlets }}"
  loop_control:
    label: "{{ item }}"
  when: item not in (pods_quadlets_changed | default([]))
  tags: "{{ pods_role_tags | default(pods_role_tags_default) }}"

# Tras un cambio en el .pod (p. ej. PublishPort) hay que recrear la infra Podman.
# systemctl stop/start no alcanza: los contenedores Quadlet (BindsTo) y el pod stale
# impiden aplicar la nueva definición. No usar systemctl enable aquí: las unidades
# *-pod.service son generadas por Quadlet (transient) y fallan con systemctl enable.
- name: MAIN Tear down Podman infra for changed Quadlet pods
  ansible.builtin.shell: |
    set -euo pipefail
    pod="{{ item }}"
    pod_unit="${pod}-pod.service"

    for cf in /etc/containers/systemd/*.container; do
      [[ -f "$cf" ]] || continue
      if grep -q "Pod=${pod}.pod" "$cf" 2>/dev/null; then
        unit="$(basename "$cf" .container).service"
        systemctl stop "$unit" 2>/dev/null || true
      fi
    done

    systemctl stop "$pod_unit" 2>/dev/null || true
    podman pod stop "$pod" 2>/dev/null || true
    podman pod rm -f "$pod" 2>/dev/null || true
  args:
    executable: /bin/bash
  loop: "{{ pods_quadlets_changed | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: (pods_quadlets_changed | default([]) | length) > 0
  changed_when: true
  tags: "{{ pods_role_tags | default(pods_role_tags_default) }}"

- name: MAIN Reload systemd after tearing down changed Quadlet pods
  ansible.builtin.systemd:
    daemon_reload: true
  when: (pods_quadlets_changed | default([]) | length) > 0
  tags: "{{ pods_role_tags | default(pods_role_tags_default) }}"

- name: MAIN Enable and start Pod services (changed definitions)
  ansible.builtin.systemd:
    name: "{{ item }}-pod.service"
    state: started
    enabled: true
  loop: "{{ pods_quadlets_changed | default([]) }}"
  loop_control:
    label: "{{ item }}"
  when: (pods_quadlets_changed | default([]) | length) > 0
  register: pods_changed_start
  ignore_errors: true
  tags: "{{ pods_role_tags | default(pods_role_tags_default) }}"

- name: MAIN Show journal for failed changed Pod start
  ansible.builtin.command:
    argv:
      - journalctl
      - -u
      - "{{ item.item }}-pod.service"
      - --no-pager
      - -n
      - "40"
  loop: "{{ pods_changed_start.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('?') }}"
  when:
    - item.failed | default(false)
  changed_when: false
  tags: "{{ pods_role_tags | default(pods_role_tags_default) }}"

- name: MAIN Fail if any changed Pod did not start
  ansible.builtin.fail:
    msg: >-
      Failed to start pod service(s):
      {{ pods_changed_start.results | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='item') | list | join(', ') }}
  when:
    - pods_changed_start.results is defined
    - pods_changed_start.results | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0
  tags: "{{ pods_role_tags | default(pods_role_tags_default) }}"
