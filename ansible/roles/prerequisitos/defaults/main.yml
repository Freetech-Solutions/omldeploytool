---
# Coincide con las etiquetas de roles en playbooks/site.yml para que las acciones
# parciales de deploy.sh (--tags voice, postgres, etc.) sigan creando red Podman y paquetes mínimos.
prerequisitos_partial_deploy_tags:
  - minio
  - postgres
  - redis
  - gearman
  - telephony-edge
  - acd
  - kamailio
  - websockets
  - omlapp
  - omlapp_workers
  - omlapp-workers
  - interaction_processor
  - dialer
  - nginx
  - observability
  - addons
  - qa
  - data
  - voice
  - app
  - nodes

# Quadlets .network en /etc/containers/systemd
prerequisitos_quadlet_networks:
  - omnileads.network

# Archivos por tenant (certs, google_credentials.json) bajo ansible/instances/<tenant_folder>/
prerequisitos_tenant_instances_dir: "{{ playbook_dir }}/../instances/{{ tenant_folder }}"

# MOTD SSH al ingresar (rol prerequisitos)
prerequisitos_motd_enabled: true
# Si está vacío, se infiere desde topology_normalize / group_names
prerequisitos_motd_component: ""
