---

- name: MAIN Install required Debian packages
  apt:
    name:
      - curl
      - net-tools
      - podman
      - wget
      - jq
      - sngrep
      - python3-boto3
      - python3-psycopg2      
    update_cache: yes
    cache_valid_time: 3600
    state: present
  when: ansible_os_family == "Debian"
  # Mismo criterio que red Quadlet / Rocky+podman: si solo queda tag `install`, los nodos nuevos
  # no reciben podman en `upgrade|update|prerequisitos_partial_*` y systemd no genera *.network.
  tags: "{{ (['install'] + ['upgrade'] + ['update'] + prerequisitos_partial_deploy_tags) | unique }}"

- name: MAIN Enable EPEL Repository on Rocky or Alma Linux
  dnf:
    name: epel-release
    state: present
  when: ansible_facts['distribution'] == "Rocky" or ansible_facts['distribution'] == "AlmaLinux" 
  tags: 
    - install

- name: MAIN Install required Rocky or Alma Linux packages
  dnf:
    name:
      - python3
      - python3-pip
      - python3-psycopg2
      - jq
      - postgresql
    state: present
  when: ansible_facts['distribution'] == "Rocky" or ansible_facts['distribution'] == "AlmaLinux" 
  tags: 
    - install

- name: MAIN Install required Centos7 SQL packages
  yum:
    name:
      - git 
      - epel-release 
      - libselinux-python3
      - python3
      - python3-pip
      - podman
    state: present
  when: ansible_facts['distribution'] == "CentOS" 
  # Sin comas dentro del Jinja: Ansible parte tags en string por comas y rompe listas tipo ['a', 'b'].
  tags: "{{ (['install'] + prerequisitos_partial_deploy_tags) | unique }}"

- name: MAIN Install PODMAN
  dnf:
    name:
      - podman
    state: present
  when: ansible_facts['distribution'] == "Rocky" or ansible_facts['distribution'] == "AlmaLinux"
  tags: "{{ (['install'] + prerequisitos_partial_deploy_tags) | unique }}"

- name: MAIN Ensure Podman Quadlet directory exists
  file:
    path: /etc/containers/systemd
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: "{{ (['install'] + ['upgrade'] + ['update'] + prerequisitos_partial_deploy_tags) | unique }}"

- name: MAIN Render Podman network Quadlet files
  template:
    src: "{{ item }}"
    dest: "/etc/containers/systemd/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ prerequisitos_quadlet_networks }}"
  loop_control:
    label: "{{ item }}"
  register: prerequisitos_network_quadlets
  tags: "{{ (['install'] + ['upgrade'] + ['update'] + prerequisitos_partial_deploy_tags) | unique }}"

# Siempre recargar tras los .network: con loop, `register is changed` / `is changed` no siempre reflejan
# el agregado; sin reload systemd no expone omnileads-network.service (Quadlet) y el restart falla.
- name: MAIN Reload systemd after network Quadlet changes
  ansible.builtin.systemd:
    daemon_reload: true
  tags: "{{ (['install'] + ['upgrade'] + ['update'] + prerequisitos_partial_deploy_tags) | unique }}"

- name: MAIN Restart Podman network when Quadlet file changed
  ansible.builtin.systemd:
    name: "{{ (item.item | regex_replace('\\.network$', '')) }}-network.service"
    state: restarted
    daemon_reload: true
  loop: "{{ prerequisitos_network_quadlets.results | default([]) }}"
  when: item.changed | default(false)
  tags: "{{ (['install'] + ['upgrade'] + ['update'] + prerequisitos_partial_deploy_tags) | unique }}"

- name: MAIN Ensure OMniLeads Podman network exists
  tags: "{{ (['install'] + ['upgrade'] + ['update'] + prerequisitos_partial_deploy_tags) | unique }}"
  block:
    - name: MAIN Start Quadlet omnileads network unit
      ansible.builtin.systemd:
        name: omnileads-network.service
        state: started
        enabled: true
        daemon_reload: true
  rescue:
    # Si el generador Quadlet no expone la unidad (Podman viejo o paquetes distintos), la red sigue siendo necesaria para los pods.
    - name: MAIN Create omnileads Podman network when Quadlet unit is missing
      ansible.builtin.command:
        argv:
          - podman
          - network
          - create
          - --driver
          - bridge
          - omnileads
      register: prerequisitos_podman_network_create
      changed_when: prerequisitos_podman_network_create.rc == 0
      failed_when: >-
        prerequisitos_podman_network_create.rc != 0 and
        not (
          ('already' in (prerequisitos_podman_network_create.stderr | default('') | lower)) or
          ('already' in (prerequisitos_podman_network_create.stdout | default('') | lower)) or
          ('exists' in (prerequisitos_podman_network_create.stderr | default('') | lower))
        )

- name: MAIN Run preflight checks
  import_tasks: checks_preflight.yml

- name: MAIN Validate normalized variables
  import_tasks: checks_validate.yml

- name: MAIN First configuration in server or servers
  import_tasks: os_configuration.yml
