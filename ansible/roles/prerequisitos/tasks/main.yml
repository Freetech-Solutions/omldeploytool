---

- name: MAIN Install required Debian packages
  ansible.builtin.apt:
    name:
      - curl
      - net-tools
      - podman
      - wget
      - jq
      - sngrep
      - python3-boto3
      - python3-psycopg2
      # Debian 13 (trixie) ya no instala cron por defecto y el módulo
      # ansible.builtin.cron (backup job) requiere el binario crontab.
      - cron
    update_cache: yes
    cache_valid_time: 3600
    state: present
    lock_timeout: 300
  when: ansible_os_family == "Debian"
  # Mismo criterio que red Quadlet / Rocky+podman: si solo queda tag `install`, los nodos nuevos
  # no reciben podman en `upgrade|update|prerequisitos_partial_*` y systemd no genera *.network.
  tags: "{{ (['install'] + ['upgrade'] + ['update'] + prerequisitos_partial_deploy_tags) | unique }}"

- name: MAIN Enable EPEL Repository on Rocky or Alma Linux
  dnf:
    name: epel-release
    state: present
  when: ansible_facts['distribution'] == "Rocky" or ansible_facts['distribution'] == "AlmaLinux" 
  tags: 
    - install

- name: MAIN Install required Rocky or Alma Linux packages
  dnf:
    name:
      - curl
      - net-tools
      - wget
      - python3
      - python3-pip
      - python3-psycopg2
      - python3-boto3
      - jq
      - postgresql
      - cronie
    state: present
  when: ansible_facts['distribution'] in ["Rocky", "AlmaLinux"]
  tags:
    - install

# Instalar cron/cronie no garantiza el daemon corriendo (en RedHat el preset lo habilita
# pero no lo inicia) y el job de backup de OS_CONF depende de él.
- name: MAIN Ensure cron service is enabled and running
  ansible.builtin.service:
    name: "{{ 'cron' if ansible_os_family == 'Debian' else 'crond' }}"
    enabled: true
    state: started
  when: >-
    ansible_os_family == "Debian" or
    ansible_facts['distribution'] in ["Rocky", "AlmaLinux"]
  tags: "{{ (['install'] + ['upgrade'] + ['update'] + prerequisitos_partial_deploy_tags) | unique }}"

- name: MAIN Install sngrep on Rocky or Alma Linux (EPEL, best-effort)
  dnf:
    name: sngrep
    state: present
  when: ansible_facts['distribution'] in ["Rocky", "AlmaLinux"]
  ignore_errors: true
  tags:
    - install

- name: MAIN Install PODMAN on Rocky or Alma Linux
  dnf:
    name:
      - podman
    state: present
  when: ansible_facts['distribution'] in ["Rocky", "AlmaLinux"]
  tags: "{{ (['install'] + prerequisitos_partial_deploy_tags) | unique }}"

- name: MAIN Get Podman version on Rocky or Alma Linux
  ansible.builtin.shell: podman --version | awk '{print $3}'
  register: _podman_version
  changed_when: false
  when: ansible_facts['distribution'] in ["Rocky", "AlmaLinux"]
  tags:
    - install

- name: MAIN Assert Podman >= 4.4 (required for Quadlet) on Rocky or Alma Linux
  ansible.builtin.assert:
    that:
      - _podman_version.stdout is version('4.4', '>=')
    fail_msg: >-
      Podman {{ _podman_version.stdout }} no soporta Quadlet (mínimo 4.4).
      Actualizar con: dnf update podman (habilitar EPEL o CRB si es necesario).
  when: ansible_facts['distribution'] in ["Rocky", "AlmaLinux"]
  tags:
    - install

- name: MAIN Ensure Podman Quadlet directory exists
  file:
    path: /etc/containers/systemd
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: "{{ (['install'] + ['upgrade'] + ['update'] + prerequisitos_partial_deploy_tags) | unique }}"

- name: MAIN Render Podman network Quadlet files
  template:
    src: "{{ item }}"
    dest: "/etc/containers/systemd/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ prerequisitos_quadlet_networks }}"
  loop_control:
    label: "{{ item }}"
  register: prerequisitos_network_quadlets
  tags: "{{ (['install'] + ['upgrade'] + ['update'] + prerequisitos_partial_deploy_tags) | unique }}"

# Siempre recargar tras los .network: con loop, `register is changed` / `is changed` no siempre reflejan
# el agregado; sin reload systemd no expone omnileads-network.service (Quadlet) y el restart falla.
- name: MAIN Reload systemd after network Quadlet changes
  ansible.builtin.systemd:
    daemon_reload: true
  tags: "{{ (['install'] + ['upgrade'] + ['update'] + prerequisitos_partial_deploy_tags) | unique }}"

- name: MAIN Check if omnileads network Quadlet unit is active
  ansible.builtin.command: systemctl is-active omnileads-network.service
  register: prerequisitos_omnileads_network_active_check
  changed_when: false
  failed_when: false
  tags: "{{ (['install'] + ['upgrade'] + ['update'] + prerequisitos_partial_deploy_tags) | unique }}"

- name: MAIN Ensure OMniLeads Podman network exists
  tags: "{{ (['install'] + ['upgrade'] + ['update'] + prerequisitos_partial_deploy_tags) | unique }}"
  block:
    - name: MAIN Start or restart Quadlet omnileads network unit
      ansible.builtin.systemd:
        name: omnileads-network.service
        state: >-
          {{ 'restarted' if (
               (prerequisitos_network_quadlets.results | default([]) | selectattr('changed', 'defined') | selectattr('changed') | list | length > 0)
               and (prerequisitos_omnileads_network_active_check.rc == 0)
             ) else 'started' }}
        enabled: true
        daemon_reload: true
  rescue:
    # Si el generador Quadlet no expone la unidad (Podman viejo o paquetes distintos), la red sigue siendo necesaria para los pods.
    - name: MAIN Create omnileads Podman network when Quadlet unit is missing
      ansible.builtin.command:
        argv:
          - podman
          - network
          - create
          - --driver
          - bridge
          - omnileads
      register: prerequisitos_podman_network_create
      changed_when: prerequisitos_podman_network_create.rc == 0
      failed_when: >-
        prerequisitos_podman_network_create.rc != 0 and
        not (
          ('already' in (prerequisitos_podman_network_create.stderr | default('') | lower)) or
          ('already' in (prerequisitos_podman_network_create.stdout | default('') | lower)) or
          ('exists' in (prerequisitos_podman_network_create.stderr | default('') | lower))
        )

- name: MAIN Run preflight checks
  import_tasks: checks_preflight.yml

- name: MAIN Validate normalized variables
  import_tasks: checks_validate.yml

- name: MAIN First configuration in server or servers
  import_tasks: os_configuration.yml
