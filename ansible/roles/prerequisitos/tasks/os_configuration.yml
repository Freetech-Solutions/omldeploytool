---
- name: OS_CONF Disable ufw
  ansible.builtin.systemd:
    name: ufw
    state: stopped
    enabled: false
  ignore_errors: true
  tags:
    - install

- name: OS_CONF Disable firewallD
  ansible.builtin.systemd:
    name: firewalld
    state: stopped
    enabled: false
  ignore_errors: true
  tags:
    - install

- name: MAIN Disable SELinux on Rocky or Alma Linux
  ansible.posix.selinux:
    state: disabled
  when: ansible_facts['distribution'] in ["Rocky", "AlmaLinux"]
  ignore_errors: true
  tags:
    - install
    - upgrade
    - update

- name: MAIN Set SELinux Permissive immediately on Rocky or Alma Linux
  ansible.builtin.command: setenforce 0
  failed_when: false
  changed_when: false
  when: ansible_facts['distribution'] in ["Rocky", "AlmaLinux"]
  tags:
    - install
    - upgrade
    - update

- name: OS_CONF Ensure group {{ usuario }} exists
  ansible.builtin.group:
    name: "{{ usuario }}"
    state: present
  tags:
    - install

- name: OS_CONF Add the {{ usuario }} user
  ansible.builtin.user:
    name: "{{ usuario }}"
    group: "{{ usuario }}"
    comment: OMniLeads OS user
    shell: /bin/bash
    home: "{{ django_deploy_path }}"
  tags:
    - install

- name: OS_CONF Check if /etc/omnileads directory exists
  ansible.builtin.stat:
    path: /etc/omnileads
  register: etc_omnileads
  tags:
    - install

- name: OS_CONF Creates /etc/omnileads directory
  ansible.builtin.file:
    path: /etc/omnileads
    state: directory
    owner: "{{ usuario }}"
    group: "{{ usuario }}"
    mode: '0764'
    recurse: true
  when: not etc_omnileads.stat.exists
  tags:
    - install

- name: OS_CONF Copy google speech credentials json
  ansible.builtin.copy:
    src: "{{ prerequisitos_tenant_instances_dir }}/google_credentials.json"
    dest: /etc/omnileads/google_credential.json
    mode: '0600'
  tags:
    - install
    - upgrade
  when:
    - callrec_transcriptions_engine is defined 
    - callrec_transcriptions_engine == "gcp"

- name: OS_CONF Ensure TLS certs directory exists
  ansible.builtin.file:
    path: "{{ certs_location | default('/etc/omnileads/certs') }}"
    state: directory
    owner: "{{ usuario }}"
    group: "{{ usuario }}"
    mode: '0755'
  tags:
    - install
    - upgrade

- name: OS_CONF Copy selfsigned SSL certs
  ansible.builtin.copy:
    src: "certs/cert.pem"
    dest: "{{ certs_location | default('/etc/omnileads/certs') }}/cert.pem"
    owner: "{{ usuario }}"
    group: "{{ usuario }}"
    mode: '0644'
  tags:
    - install
    - upgrade
  when: certs == "selfsigned"

- name: OS_CONF Copy selfsigned SSL keys
  ansible.builtin.copy:
    src: "certs/key.pem"
    dest: "{{ certs_location | default('/etc/omnileads/certs') }}/key.pem"
    owner: "{{ usuario }}"
    group: "{{ usuario }}"
    mode: '0600'
  tags:
    - install
    - upgrade
  when: certs == "selfsigned"

- name: OS_CONF Copy custom SSL certs
  ansible.builtin.copy:
    src: "{{ prerequisitos_tenant_instances_dir }}/{{ ssl_cert_file_name | default('cert.pem') }}"
    dest: "{{ certs_location | default('/etc/omnileads/certs') }}/cert.pem"
    owner: "{{ usuario }}"
    group: "{{ usuario }}"
    mode: '0644'
  tags:
    - install
    - upgrade
  when: certs == "custom"

- name: OS_CONF Copy custom SSL keys
  ansible.builtin.copy:
    src: "{{ prerequisitos_tenant_instances_dir }}/{{ ssl_key_file_name | default('key.pem') }}"
    dest: "{{ certs_location | default('/etc/omnileads/certs') }}/key.pem"
    owner: "{{ usuario }}"
    group: "{{ usuario }}"
    mode: '0600'
  tags:
    - install
    - upgrade
  when: certs == "custom"

- name: OS_CONF CERTBOT Create directories for Certbot
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  become: true
  loop:
    - /opt/certbot/
    - /opt/certbot/webroot
    - /opt/certbot/letsencrypt
  tags:
    - install
  when: certs == "certbot"

- name: OS_CONF CERTBOT launch container to generate Let's Encrypt Certs
  become: true
  ansible.builtin.command: >
    podman run -i --rm --name nginx-certbot
    -e FQDN={{ fqdn }}
    -e EMAIL={{ notification_email }}
    -e RENEW_CERTIFICATE=false
    -v '/opt/certbot/letsencrypt:/etc/letsencrypt'
    -v '/opt/certbot/webroot:/var/www/certbot'
    -p 80:80 {{ certbot_img }}
  tags:
    - install
  when: certs == "certbot"

- name: OS_CONF CERTBOT SSL Cert Copy
  become: true
  ansible.builtin.copy:
    src: "/opt/certbot/letsencrypt/archive/{{ fqdn }}/fullchain1.pem"
    dest: "{{ certs_location | default('/etc/omnileads/certs') }}/cert.pem"
    owner: "{{ usuario }}"
    group: "{{ usuario }}"
    mode: '0644'
    remote_src: true
  tags:
    - install
  when: certs == "certbot"

- name: OS_CONF CERTBOT SSL Key Copy
  become: true
  ansible.builtin.copy:
    src: "/opt/certbot/letsencrypt/archive/{{ fqdn }}/privkey1.pem"
    dest: "{{ certs_location | default('/etc/omnileads/certs') }}/key.pem"
    owner: "{{ usuario }}"
    group: "{{ usuario }}"
    mode: '0600'
    remote_src: true
  tags:
    - install
  when: certs == "certbot"

- name: OS_CONF Copy oml_manage script
  ansible.builtin.template:
    src: "templates/oml_manage.sh"
    dest: /usr/local/bin/oml_manage
    mode: '0755'
  tags:
    - install
    - upgrade

- name: OS_CONF Set timezone of server
  community.general.timezone:
    name: "{{ TZ }}"
  tags:
    - install
    - upgrade

- name: OS_CONF Configure SSH login MOTD
  when: prerequisitos_motd_enabled | default(true) | bool
  tags:
    - install
    - upgrade
  block:
    - name: OS_CONF Resolve MOTD deploy timestamp
      ansible.builtin.command: date '+%Y-%m-%d %H:%M %Z'
      environment:
        TZ: "{{ TZ }}"
      register: prerequisitos_motd_deploy_date_cmd
      changed_when: false

    - name: OS_CONF Set MOTD deploy timestamp fact
      ansible.builtin.set_fact:
        prerequisitos_motd_deploy_date: "{{ prerequisitos_motd_deploy_date_cmd.stdout }}"

    - name: OS_CONF Render OMniLeads MOTD banner
      ansible.builtin.template:
        src: motd_banner.j2
        dest: /etc/omnileads/motd.banner
        owner: root
        group: root
        mode: '0644'

    - name: OS_CONF Remove original static /etc/motd (Debian dynamic motd)
      ansible.builtin.file:
        path: /etc/motd
        state: absent
      when: ansible_os_family == "Debian"

    - name: OS_CONF Install MOTD script (Debian dynamic motd)
      ansible.builtin.template:
        src: 99-omnileads-motd.j2
        dest: /etc/update-motd.d/99-omnileads
        owner: root
        group: root
        mode: '0755'
      when: ansible_os_family == "Debian"

    - name: OS_CONF Install MOTD banner (RedHat static motd)
      ansible.builtin.template:
        src: motd_banner.j2
        dest: /etc/motd
        owner: root
        group: root
        mode: '0644'
      when: ansible_os_family == "RedHat"

    - name: OS_CONF Regenerate dynamic MOTD (Debian)
      ansible.builtin.shell: run-parts /etc/update-motd.d/ > /run/motd.dynamic
      args:
        executable: /bin/bash
      when: ansible_os_family == "Debian"
      changed_when: true

- name: OS_CONF Set Storage journald.conf
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: "^#?Storage="
    line: "Storage=volatile"
  tags:
    - install
    - upgrade

- name: OS_CONF Set RuntimeMaxUse journald.conf
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: "^#?RuntimeMaxUse="
    line: "RuntimeMaxUse={{ journald_runtime_max_use }}"
  tags:
    - install
    - upgrade

- name: OS_CONF Set RuntimeKeepFree journald.conf
  ansible.builtin.lineinfile:
    path: /etc/systemd/journald.conf
    regexp: "^#?RuntimeKeepFree="
    line: "RuntimeKeepFree={{ journald_runtime_keep_free }}"
  tags:
    - install
    - upgrade

- name: OS_CONF restart systemd-journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  tags:
    - install
    - upgrade

- name: OS_CONF stop OMniLeads App for Upgrade
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: true
  loop:
    - omnileads.service
    - nginx.service
  tags:
    - upgrade
  when:
    - oml_is_compute | default(false)
    - upgrade_from_2X is not defined

- name: OS_CONF stop PostgreSQL for Upgrade
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: true
  loop:
    - postgresql.service
  tags:
    - upgrade
  when:
    - oml_runs_data_statefull | default(false) | bool or oml_is_aio | default(false) | bool
    - postgresql_host_ha is not defined
    - not (postgres_out | default(false) | bool)
    - upgrade_from_2X is not defined

- name: OS_CONF Refresh Django static_files volume (upgrade)
  become: true
  tags:
    - upgrade
  when:
    - oml_is_compute | default(false)
  block:
    - name: OS_CONF Stop omnileads.service before volume refresh
      ansible.builtin.systemd:
        name: omnileads.service
        state: stopped
      failed_when: false

    - name: OS_CONF Remove stale Django static_files volume
      containers.podman.podman_volume:
        name: django_static
        state: absent
        force: true
      failed_when: false

    - name: OS_CONF Recreate empty Django static_files volume
      containers.podman.podman_volume:
        name: django_static
        state: present

- name: OS_CONF Swap file management
  when: swap_space is defined
  tags:
    - install
    - upgrade
  block:
    - name: OS_CONF Check if swap file exists
      ansible.builtin.stat:
        path: "{{ swap_file }}"
      register: swap_file_check

    - name: OS_CONF Create and configure swap file
      when: not swap_file_check.stat.exists
      block:
        - name: OS_CONF Create swap file
          ansible.builtin.command:
            cmd: "fallocate -l {{ swap_space }} {{ swap_file }}"
            creates: "{{ swap_file }}"

        - name: OS_CONF Set permissions on swap file
          ansible.builtin.file:
            path: "{{ swap_file }}"
            mode: '0600'

        - name: OS_CONF Format swap file
          ansible.builtin.command:
            cmd: "mkswap {{ swap_file }}"

        - name: OS_CONF Turn on swap
          ansible.builtin.command:
            cmd: "swapon {{ swap_file }}"

        - name: OS_CONF Add swap file to fstab
          ansible.posix.mount:
            path: none
            src: "{{ swap_file }}"
            fstype: swap
            opts: sw
            passno: '0'
            dump: '0'
            state: present

- name: OS_CONF Apply swappiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: '1'
    state: present
    reload: true
  tags:
    - install
    - upgrade

- name: OS_CONF BACKUP Copy Backup ENV file
  ansible.builtin.template:
    src: "templates/backup.env"
    dest: /etc/default/backup.env
    mode: '0640'
    owner: "{{ usuario }}"
    group: "{{ usuario }}"
  when: 
    - backup_bucket_url is defined
    - oml_is_compute | default(false)
  tags:
    - install
    - upgrade

- name: OS_CONF BACKUP Copy Backup BASH file
  ansible.builtin.template:
    src: "templates/backup.sh"
    dest: /usr/local/bin/oml_backup.sh
    mode: '0755'
  when: 
    - backup_bucket_url is defined
    - oml_is_compute | default(false)
  tags:
    - install
    - upgrade

- name: OS_CONF BACKUP Add a cron job BACKUP to the system crontab
  ansible.builtin.cron:
    name: "OMniLeads Backup Data"
    minute: "{{ cron_backup_mm }}"
    hour: "{{ cron_backup_hh }}"
    user: root
    job: "/usr/local/bin/oml_backup.sh > /var/log/backup_registry.log 2>&1"
    state: present
  when:
    - ansible_facts['os_family'] in ["Debian", "RedHat"]
    - backup_bucket_url is defined
    - oml_is_compute | default(false)
  tags:
    - install
    - upgrade
