- name: QA PSTN_EULATOR Pull image
  command: podman image exists {{ pstn_emulator_img }}
  register: qa_pstn_image_cache
  changed_when: false
  failed_when: qa_pstn_image_cache.rc not in [0, 1]
  tags:
    - install
    - upgrade

- name: QA PSTN_EULATOR Pull image when missing or forced
  command: podman pull --quiet {{ pstn_emulator_img }}
  register: qa_pstn_pull
  retries: 3
  delay: 5
  until: qa_pstn_pull is success
  when: force_image_pull | bool or qa_pstn_image_cache.rc != 0
  tags:
    - install
    - upgrade

- name: QA PSTN_EMULATOR environment variables for this installation
  template:
    src: "pstn.env"
    dest: /etc/default/pstn.env
    mode: "0640"
    owner: "{{ usuario }}"
    group: "{{ usuario }}"
  tags:
    - install
    - upgrade

- name: QA PSTN_EMULATOR Copy systemd service
  template:
    src: "pstn.service"
    dest: /etc/systemd/system/pstn.service
  register: qa_pstn_service_unit
  tags:
    - install
    - upgrade

- name: QA PSTN_EMULATOR systemd daemon-reload after unit file
  ansible.builtin.systemd:
    daemon_reload: true
  when: qa_pstn_service_unit is changed
  tags:
    - install
    - upgrade

- name: QA PSTN_EMULATOR start
  systemd:
    name: pstn.service
    state: restarted
    enabled: yes
  tags:
    - install
    - upgrade

