---
# rtpengine.container, kamailio_pstn.container y kamailio_webrtc.container
# declaran Pod=telephony_edge.pod, así que Quadlet inyecta
# BindsTo=telephony_edge-pod.service. Reiniciar los .service uno por uno tira
# la infra del pod y el siguiente start falla con
# "Bound to unit telephony_edge-pod.service, but unit isn't active"
# (o aparece como "Job for kamailio_pstn.service canceled.").
# Reiniciar el .pod.service rearma la infra y Quadlet vuelve a levantar los 3
# contenedores que dependen del pod.
- name: Restart telephony_edge services
  ansible.builtin.systemd:
    name: "{{ telephony_edge_pod_systemd_unit | default('telephony_edge-pod.service') }}"
    state: restarted
    daemon_reload: true
  when: (telephony_edge_changed_services | default([]) | length) > 0
  tags:
    - install
    - upgrade
    - update
