#!KAMAILIO
#
# SIP Edge Proxy single-tenant
# - Outbound (Asterisk -> ITSP): por Route header (outbound_proxy en Asterisk)
# - Inbound  (ITSP -> Asterisk): siempre hacia un único dispatcher group
# - RTPengine para SDP
#

#!substdef "!MY_IP_ADDR_PUBLIC!$env(IPADDR_PUBLIC)!g"
#!substdef "!MY_IP_ADDR_PRIVATE!$env(IPADDR_PRIVATE)!g"
#!substdef "!MY_FQDN!$env(FQDN)!g"
#!substdef "!RTPENGINE_SOCKET!$env(RTPENGINE_SOCKET)!g"
#!substdef "!MY_UDP_PORT!5060!g"

#!substdef "!MY_UDP_PUBLIC_ADDR!udp:MY_IP_ADDR_PUBLIC:MY_UDP_PORT!g"
#!substdef "!MY_UDP_PRIVATE_ADDR!udp:MY_IP_ADDR_PRIVATE:MY_UDP_PORT!g"

#!define WITH_NAT
#!define WITH_RTPENGINE
#!define WITH_PROMETHEUS

####### Global Parameters #########
debug=2
log_stderror=yes
log_facility=LOG_LOCAL0
fork=no
children=4
alias=MY_FQDN
tcp_connection_lifetime=30
force_rport=yes
mhomed=yes

#!ifdef WITH_PROMETHEUS
tcp_accept_no_cl=yes
#!endif

####### Listen Address #########
####### Listen Address #########
listen=MY_UDP_PUBLIC_ADDR
listen=MY_UDP_PRIVATE_ADDR
listen=tcp:MY_IP_ADDR_PRIVATE:9273

####### Modules Section #########
loadmodule "tm.so"
loadmodule "sl.so"

# outbound antes de rr/path si los usás
loadmodule "outbound.so"
loadmodule "siputils.so"
loadmodule "rr.so"
loadmodule "path.so"

loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "xlog.so"
loadmodule "sanity.so"

# Para outbound+UDP (warning si falta)
loadmodule "stun.so"

loadmodule "textops.so"
loadmodule "rtpengine.so"
loadmodule "nathelper.so"
loadmodule "dispatcher.so"

#!ifdef WITH_PROMETHEUS
loadmodule "kex.so"
loadmodule "xhttp.so"
loadmodule "xhttp_prom.so"
modparam("xhttp_prom", "xhttp_prom_stats", "all")
modparam("xhttp_prom", "xhttp_prom_pkg_stats", 1)
#!endif

####### Module Parameters ########
modparam("outbound", "force_outbound_flag", 1)
modparam("outbound", "flow_token_secret", "johndoessecretphrase")

modparam("rtpengine", "rtpengine_sock", "RTPENGINE_SOCKET")

modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_ping_interval", 20)
modparam("dispatcher", "ds_ping_reply_codes", "class=2;code=480;code=486")

# NAT helper (si vas a usar fix_nated_register / contact)
modparam("nathelper", "received_avp", "$avp(RECEIVED)")

####### Helper Routes #########

# Extrae DID para inbound (ITSP -> Kamailio -> Asterisk)
# Se conserva solo para logging/debug, no para routing multi-tenant.
route[GET_DID_INBOUND] {
    # Preferir R-URI user. Fallback: To user.
    $var(did) = $rU;
    if ($var(did) == "") $var(did) = $tU;

    if ($var(did) == "") {
        xlog("L_ERR", "INBOUND: DID vacío. rU='$rU' tU='$tU' Call-ID=$ci\n");
        return -1;
    }

    xlog("L_INFO", "INBOUND: DID='$var(did)'\n");
    return 1;
}

# NAT detection mínimo (no agresivo)
route[NATDETECT] {
#ifdef WITH_NAT
    if (nat_uac_test("19")) {
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else {
            if (is_first_hop()) {
                set_contact_alias();
            }
        }
    }
#endif
    return;
}

####### Routing Logic #########
include_file "/etc/kamailio/itsp_allowlist.cfg"

request_route {
    xlog("L_INFO", "============= INICIO DE PROCESAMIENTO ============\n");
    xlog("L_INFO", "Método: $rm, Source: $si:$sp, Destino: $ru, Call-ID: $ci\n");

    route(REQINIT);
    route(NATDETECT);

    # CANCEL
    if (is_method("CANCEL")) {
        xlog("L_INFO", "Procesando CANCEL\n");
        if (t_check_trans()) route(RELAY);
        exit;
    }

    # BYE: liberar RTPengine
    if (is_method("BYE")) {
#ifdef WITH_RTPENGINE
        rtpengine_delete();
#endif
    }

    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    t_check_trans();

    # ==========================================================
    # DISCRIMINACIÓN INBOUND/OUTBOUND
    # ==========================================================
    if (is_method("INVITE")) {
        if (is_present_hf("OMniLeadsOutbound")) {
            xlog("L_INFO", "Outbound INVITE detectado (OMniLeadsOutbound presente)\n");
            # sigue lógica outbound más abajo
        } else {
            xlog("L_INFO", "Inbound INVITE detectado (OMniLeadsOutbound ausente)\n");
            route(INBOUND_DISPATCH_FIXED);
            exit;
        }
    }

    # Para REGISTER:
    # - si Asterisk marca outbound con el header también, perfecto.
    # - si NO lo marca, entonces conviene tratar REGISTER siempre como outbound
    if (is_method("REGISTER") && !is_present_hf("OMniLeadsOutbound")) {
        xlog("L_INFO", "REGISTER sin OMniLeadsOutbound: asumiendo outbound (Asterisk->ITSP)\n");
    }

    # ==========================================================
    # OUTBOUND: request inicial (sin diálogo) basado en Route
    # ==========================================================
    if (@via[2] == "") {
        xlog("L_INFO", "Solicitud inicial: $rm de $si:$sp hacia $ru\n");
        xlog("L_INFO", "Cabeceras Route presentes: $hdr(Route)\n");

        if (is_present_hf("Route")) {
            xlog("L_INFO", "DEBUG: Route completo: '$hdr(Route)'\n");

            $var(route_uri_temp) = $(hdr(Route){re.subst,/<([^>]+)>.*/\1/});
            xlog("L_INFO", "DEBUG: Route sin <>: '$var(route_uri_temp)'\n");

            $du = $var(route_uri_temp);

            if (is_method("REGISTER")) {
                xlog("L_INFO", "DEBUG: REGISTER: DU='$du', manteniendo RURI='$ru'\n");
            } else {
                $ru = $var(route_uri_temp);
                xlog("L_INFO", "DEBUG: Método no-REGISTER: DU='$du' RURI='$ru'\n");

                if (is_method("INVITE")) {
                    record_route();
                    xlog("L_INFO", "Record-Route añadido para INVITE\n");
                }
            }

            remove_hf("Route");
        } else {
            xlog("L_INFO", "DEBUG: No se encontró cabecera Route\n");

            if (is_method("INVITE") || is_method("SUBSCRIBE")) {
                record_route();
                xlog("L_INFO", "DEBUG: Añadiendo Record-Route para $rm sin Route\n");
            }

            if ($rU == $null) {
                xlog("L_WARN", "DEBUG: RURI sin usuario, respondiendo 484\n");
                sl_send_reply("484", "Address Incomplete");
                exit;
            }

            $du = $ru;
            xlog("L_INFO", "DEBUG: sin Route, usando RURI como destino: '$du'\n");
        }

        if (is_method("INVITE") && has_body("application/sdp")) {
            xlog("L_INFO", "Interceptando SDP en INVITE\n");
            route(RTPENGINE_OFFER);
        }

        xlog("L_INFO", "DEBUG: ANTES DE RELAY -> DU='$du' RURI='$ru'\n");
        route(RELAY);
        exit;
    }

    # ==========================================================
    # Solicitud subsecuente (con Vias)
    # ==========================================================
    xlog("L_INFO", "DEBUG: Solicitud subsecuente, Via count: $(hdr(Via)[*])\n");

    if (!loose_route()) {
        xlog("L_WARN", "DEBUG: Fallo en loose_route() para solicitud subsecuente\n");
        sl_send_reply("403", "Forbidden - Ruta incorrecta");
        exit;
    }

    if (is_method("INVITE") && has_body("application/sdp")) {
        xlog("L_INFO", "Interceptando SDP en re-INVITE\n");
        route(RTPENGINE_OFFER);
    }

    t_on_failure("FAIL_OUTBOUND");
    route(RELAY);
    exit;
}

# ==========================================================
# INBOUND SINGLE-TENANT:
# todo lo que entra desde PSTN va al mismo dispatcher setid
# ==========================================================
route[INBOUND_DISPATCH_FIXED] {
    if (!route(IS_FROM_ITSP)) {
        xlog("L_WARN", "INBOUND rechazado: origen no permitido $si:$sp Call-ID=$ci\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }

    # Forzar salida hacia Asterisk/backend por la IP privada del edge
    force_send_socket(udp:MY_IP_ADDR_PRIVATE:5060);

    if (route(GET_DID_INBOUND) < 0) {
        sl_send_reply("484", "Address Incomplete");
        exit;
    }

    $var(setid) = 10;

    record_route();

    xlog("L_INFO", "INBOUND: DID '$var(did)' => dispatcher setid fijo '$var(setid)'\n");

    if (!ds_select_dst("$var(setid)", "4")) {
        xlog("L_ERR", "INBOUND: no hay destinos disponibles en setid '$var(setid)' Call-ID=$ci\n");
        send_reply("503", "No hay destinos disponibles");
        exit;
    }

    xlog("L_INFO", "INBOUND: destino seleccionado DU='$du' RURI='$ru' socket='$fs'\n");

    # Si inbound trae SDP, también pasamos por RTPengine
    if (has_body("application/sdp")) {
        xlog("L_INFO", "INBOUND: SDP detectado en INVITE\n");
        route(RTPENGINE_OFFER);
    }

    t_on_failure("DISPATCH_FAILURE");
    route(RELAY);
    exit;
}

route[REQINIT] {
    xlog("L_INFO", "Iniciando chequeos básicos\n");

    if (!mf_process_maxfwd_header("70")) {
        xlog("L_WARN", "Max-Forwards demasiado bajo, respondiendo 483\n");
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Mensaje SIP malformado desde $si:$sp\n");
        exit;
    }

    if (is_method("OPTIONS") && uri == myself) {
        xlog("L_INFO", "Respondiendo a OPTIONS dirigido a nosotros\n");
        sl_send_reply("200", "OK");
        exit;
    }

    xlog("L_INFO", "Chequeos básicos completados con éxito\n");
}

route[WITHINDLG] {
    if (!has_totag()) return;

    xlog("L_INFO", "Solicitud dentro de diálogo (con To-tag)\n");

    if (!loose_route()) {
        if (is_method("ACK")) {
            if (t_check_trans()) {
                route(RELAY);
            }
            exit;
        }
        sl_send_reply("404", "Not Here");
        exit;
    }

    # CLAVE: resolver R-URI alias (si existe) para llegar al Asterisk detrás de NAT
    handle_ruri_alias();

    if ($rm == "BYE") {
        xlog("L_INFO", "BYE dentro de diálogo - liberando recursos RTPengine\n");
        rtpengine_delete();
    }

    if ($rm == "INVITE" && has_body("application/sdp")) {
        xlog("L_INFO", "Interceptando SDP en re-INVITE\n");
        route(RTPENGINE_OFFER);
    }

    route(RELAY);
    exit;
}

failure_route[DISPATCH_FAILURE] {
    xlog("L_ERR", "Dispatcher destino falló. RURI=$ru DU=$du Call-ID=$ci\n");
}

route[RTPENGINE_OFFER] {
#ifdef WITH_RTPENGINE
    $var(reflags) = "replace-origin replace-session-connection ICE=remove RTP/AVP";
    if (nat_uac_test("8")) {
        $var(reflags) = $var(reflags) + " force-replace-origin force-replace-session-connection";
    }
    if (!rtpengine_manage("$var(reflags)")) {
        xlog("L_ERR", "RTPengine OFFER: error procesando SDP\n");
    } else {
        xlog("L_INFO", "RTPengine OFFER OK: $var(reflags)\n");
    }
#endif
    return;
}

route[RTPENGINE_ANSWER] {
#ifdef WITH_RTPENGINE
    $var(reflags) = "replace-origin replace-session-connection";
    if (nat_uac_test("8")) {
        $var(reflags) = $var(reflags) + " force-replace-origin force-replace-session-connection";
    }
    if (!rtpengine_manage("$var(reflags)")) {
        xlog("L_ERR", "RTPengine ANSWER: error procesando SDP\n");
    } else {
        xlog("L_INFO", "RTPengine ANSWER OK: $var(reflags)\n");
    }
#endif
    return;
}

route[RELAY] {
    xlog("L_INFO", "RELAY -> $rm a DU='$du' (RURI='$ru')\n");
    if (!t_relay()) {
        xlog("L_ERR", "Fallo en t_relay()\n");
        sl_reply_error();
    }
    exit;
}

failure_route[FAIL_OUTBOUND] {
    xlog("L_ERR", "FAIL_OUTBOUND: Call-ID=$ci\n");
    if (t_branch_timeout() || !t_branch_replied()) {
        send_reply("430", "Flow Failed");
    }
}

onreply_route {
    xlog("L_INFO", "Procesando respuesta: $rs $rr\n");

    if (nat_uac_test("19")) {
        set_contact_alias();
        xlog("L_INFO", "Agregado Contact Alias en la respuesta para lidiar con Docker NAT\n");
    }

#ifdef WITH_RTPENGINE
    if (has_body("application/sdp")) {
        xlog("L_INFO", "Interceptando SDP en respuesta\n");
        route(RTPENGINE_ANSWER);
    }
#endif
}

#!ifdef WITH_PROMETHEUS
event_route[xhttp:request] {
    if ($hu == "/metrics") {
        prom_check_uri();
        prom_dispatch();
        return;
    }
    xhttp_reply("404", "Not Found", "", "");
}
#!endif
