---
# Modelo de inventario: cada grupo pod (data_statefull, edge, omlapp_web, …) declara
# qué Quadlet corre en ese host; co-localización = mismo host en varios grupos pod.
# omnileads_aio implica todos los pods en ese host (equivalente al AIO clásico).
- name: TOPOLOGY Derive pod membership and layout
  ansible.builtin.set_fact:
    oml_is_aio: "{{ 'omnileads_aio' in group_names }}"
    oml_runs_data_statefull: "{{ ('omnileads_aio' in group_names) or ('data_statefull' in group_names) }}"
    oml_runs_data_stateless: "{{ ('omnileads_aio' in group_names) or ('data_stateless' in group_names) }}"
    oml_runs_edge: "{{ ('omnileads_aio' in group_names) or ('edge' in group_names) }}"
    oml_runs_omlapp_web: "{{ ('omnileads_aio' in group_names) or ('omlapp_web' in group_names) }}"
    oml_runs_omlapp_workers: "{{ ('omnileads_aio' in group_names) or ('omlapp_workers' in group_names) }}"
    oml_runs_dialer_workers: "{{ ('omnileads_aio' in group_names) or ('dialer_workers' in group_names) }}"
    oml_runs_acd: "{{ ('omnileads_aio' in group_names) or ('acd' in group_names) }}"
    oml_runs_callrec_processor: "{{ ('omnileads_aio' in group_names) or ('callrec_processor' in group_names) }}"
    oml_layout: >-
      {% if (groups.get('data_statefull', []) | length > 0)
          or (groups.get('data_stateless', []) | length > 0)
          or (groups.get('edge', []) | length > 0)
          or (groups.get('omlapp_web', []) | length > 0)
          or (groups.get('omlapp_workers', []) | length > 0)
          or (groups.get('dialer_workers', []) | length > 0)
          or (groups.get('acd', []) | length > 0)
          or (groups.get('callrec_processor', []) | length > 0) %}cluster{% else %}aio{% endif %}
  tags:
    - always

- name: TOPOLOGY Derive compatibility flags (roles / dialer / prerequisitos)
  ansible.builtin.set_fact:
    oml_is_aio_only: "{{ oml_layout == 'aio' }}"
    oml_is_compute: >-
      {{ ('omnileads_aio' in group_names) or ('omlapp_web' in group_names) or ('omlapp_workers' in group_names)
      or ('dialer_workers' in group_names) or ('acd' in group_names) or ('callrec_processor' in group_names) }}
    oml_has_omlapp_web: "{{ ('omnileads_aio' in group_names) or ('omlapp_web' in group_names) }}"
    oml_has_dialer_workers: "{{ ('omnileads_aio' in group_names) or ('dialer_workers' in group_names) }}"
    oml_is_data: "{{ ('data_statefull' in group_names) or ('data_stateless' in group_names) or ('omnileads_aio' in group_names) }}"
  tags:
    - always

- name: TOPOLOGY Detect external services
  ansible.builtin.set_fact:
    postgres_out: "{{ postgres_host is defined }}"
    rtpengine_out: "{{ rtpengine_host is defined }}"
    kamailio_pstn_out: "{{ kamailio_pstn_host is defined }}"
    bucket_out: "{{ bucket_url is defined }}"
  tags:
    - always

- name: TOPOLOGY Expose tenant group and host list for templates
  vars:
    _structural_groups:
      - all
      - aio_instances
      - cluster_instances
      - omnileads_aio
      - data_statefull
      - data_stateless
      - edge
      - omlapp_web
      - omlapp_workers
      - dialer_workers
      - acd
      - callrec_processor
    _tenant_group: "{{ (group_names | difference(_structural_groups)) | first | default('') }}"
  ansible.builtin.set_fact:
    oml_tenant_group: "{{ _tenant_group }}"
    oml_tenant_hosts: >-
      {{
        groups[_tenant_group]
        if (_tenant_group | length > 0 and groups[_tenant_group] is defined)
        else [inventory_hostname]
      }}
  tags:
    - always

- name: TOPOLOGY Normalize base connectivity values (aio)
  ansible.builtin.set_fact:
    data_host: "{{ data_host | default(omni_ip_lan) }}"
    edge_host: "{{ edge_host | default(omni_ip_lan) }}"
    aio_host: "{{ aio_host | default(omni_ip_lan) }}"
    omni_ip_wan: "{{ omni_ip_wan | default(nat_ip_addr | default(ansible_host)) }}"
    oml_cluster_statefull_ip: "{{ omni_ip_lan }}"
    oml_cluster_stateless_ip: "{{ omni_ip_lan }}"
  when: oml_layout == 'aio'
  tags:
    - always

# En cluster: cruzar el grupo del tenant con los grupos pod para obtener peers (omni_ip_lan).
- name: TOPOLOGY Resolve cluster peers from pod groups
  vars:
    statefull_peers: "{{ oml_tenant_hosts | intersect(groups['data_statefull'] | default([])) }}"
    stateless_peers: "{{ oml_tenant_hosts | intersect(groups['data_stateless'] | default([])) }}"
    edge_peers: "{{ oml_tenant_hosts | intersect(groups['edge'] | default([])) }}"
    web_peers: "{{ oml_tenant_hosts | intersect(groups['omlapp_web'] | default([])) }}"
    workers_omlapp_peers: "{{ oml_tenant_hosts | intersect(groups['omlapp_workers'] | default([])) }}"
    dialer_peers: "{{ oml_tenant_hosts | intersect(groups['dialer_workers'] | default([])) }}"
    acd_peers: "{{ oml_tenant_hosts | intersect(groups['acd'] | default([])) }}"
    callrec_peers: "{{ oml_tenant_hosts | intersect(groups['callrec_processor'] | default([])) }}"
    compute_peers: "{{ (web_peers + workers_omlapp_peers + dialer_peers + acd_peers + callrec_peers) | unique | list }}"
  ansible.builtin.set_fact:
    data_host: "{{ data_host | default(hostvars[statefull_peers | first].omni_ip_lan if statefull_peers | length > 0 else omni_ip_lan) }}"
    edge_host: "{{ edge_host | default(hostvars[edge_peers | first].omni_ip_lan if edge_peers | length > 0 else omni_ip_lan) }}"
    aio_host: "{{ aio_host | default(hostvars[compute_peers | first].omni_ip_lan if compute_peers | length > 0 else omni_ip_lan) }}"
    omni_ip_wan: "{{ omni_ip_wan | default(nat_ip_addr | default(ansible_host)) }}"
    oml_cluster_statefull_ip: "{{ hostvars[statefull_peers | first].omni_ip_lan if statefull_peers | length > 0 else '' }}"
    oml_cluster_stateless_ip: "{{ hostvars[stateless_peers | first].omni_ip_lan if stateless_peers | length > 0 else '' }}"
  when: oml_layout == 'cluster'
  tags:
    - always

- name: TOPOLOGY Assert cluster peers were resolved
  ansible.builtin.assert:
    that:
      - data_host is defined
      - edge_host is defined
      - aio_host is defined
    fail_msg: >-
      No se pudo inferir data_host/edge_host/aio_host. Verifica que los hosts
      del cluster estén en los grupos pod del tenant (p. ej. data_statefull,
      data_stateless, edge) y al menos un host de cómputo (omlapp_web,
      omlapp_workers, dialer_workers, acd y/o callrec_processor).
  when: oml_layout == 'cluster'
  tags:
    - always

- name: TOPOLOGY Normalize service endpoints
  ansible.builtin.set_fact:
    postgres_host: >-
      {% if postgres_host is defined %}
      {{ postgres_host | trim }}
      {% elif oml_is_aio_only %}
      {{ omni_ip_lan }}
      {% elif (oml_cluster_statefull_ip | default('') | length) > 0 %}
      {{ oml_cluster_statefull_ip }}
      {% else %}
      {{ data_host }}
      {% endif %}
    bucket_host: >-
      {%- if bucket_url is defined -%}
      {{ bucket_url }}
      {%- elif oml_is_aio_only -%}
      http://{{ omni_ip_lan }}:9000
      {%- elif (oml_cluster_statefull_ip | default('') | length) > 0 -%}
      http://{{ oml_cluster_statefull_ip }}:9000
      {%- else -%}
      http://{{ data_host }}:9000
      {%- endif -%}
    redis_host: >-
      {% if redis_host is defined %}
      {{ redis_host | trim }}
      {% elif oml_is_aio_only %}
      {{ omni_ip_lan }}
      {% elif (oml_cluster_stateless_ip | default('') | length) > 0 %}
      {{ oml_cluster_stateless_ip }}
      {% else %}
      {{ data_host }}
      {% endif %}
    gearman_host: >-
      {% if gearman_host is defined %}
      {{ gearman_host }}
      {% elif oml_is_aio_only %}
      {{ omni_ip_lan }}
      {% elif (oml_cluster_stateless_ip | default('') | length) > 0 %}
      {{ oml_cluster_stateless_ip }}
      {% else %}
      {{ data_host }}
      {% endif %}
    kamailio_host: "{{ kamailio_host | default(omni_ip_lan if oml_is_aio_only else edge_host) }}"
    acd_host: >-
      {{ acd_host | default(
        omni_ip_lan if oml_is_aio_only
        else (
          hostvars[acd_peers | first].omni_ip_lan
          if (acd_peers | default([]) | length > 0)
          else aio_host
        )
      ) }}
    # ACD_NODES (kamailio_pstn.env): lista comma-separated <ip:5060> con todos
    # los hosts del mismo tenant declarados bajo el grupo 'acd'. En AIO no hay
    # 'acd' group: kamailio_pstn corre en host network y el ACD publica 5060/udp
    # sobre 127.0.0.1 (ver pods/templates/acd.pod.j2). En cluster sin acd_peers
    # caemos al acd_host ya resuelto.
    acd_nodes: >-
      {{ acd_nodes | default(
        '127.0.0.1:5060' if oml_is_aio_only
        else (
          (acd_peers | map('extract', hostvars, 'omni_ip_lan')
                     | map('regex_replace', '$', ':5060')
                     | list | join(','))
          if (acd_peers | default([]) | length > 0)
          else (acd_host ~ ':5060')
        )
      ) }}
    rtpengine_host: "{{ rtpengine_host | default(omni_ip_lan if oml_is_aio_only else edge_host) }}"
    nginx_host: >-
      {{ nginx_host | default(
        omni_ip_lan if oml_is_aio_only
        else (
          hostvars[web_peers | first].omni_ip_lan
          if (web_peers | default([]) | length > 0)
          else aio_host
        )
      ) }}
    dialer_host: >-
      {{ dialer_host | default(
        omni_ip_lan if oml_is_aio_only
        else (
          hostvars[dialer_peers | first].omni_ip_lan
          if (dialer_peers | default([]) | length > 0)
          else (
            hostvars[web_peers | first].omni_ip_lan
            if (web_peers | default([]) | length > 0)
            else aio_host
          )
        )
      ) }}
  vars:
    web_peers: "{{ oml_tenant_hosts | intersect(groups['omlapp_web'] | default([])) }}"
    dialer_peers: "{{ oml_tenant_hosts | intersect(groups['dialer_workers'] | default([])) }}"
    acd_peers: "{{ oml_tenant_hosts | intersect(groups['acd'] | default([])) }}"
  tags:
    - always

# Bucket endpoints (S3/MinIO): si el inventario no define bucket_url, inferimos
# los endpoints público e interno desde bucket_host (computado arriba). Esto evita
# que las plantillas (acd, omlapp, nginx, interaction_processor, etc.) fallen con
# 'bucket_url is undefined' cuando el host usa MinIO self-hosted.
- name: TOPOLOGY Normalize bucket endpoints (S3/MinIO)
  ansible.builtin.set_fact:
    bucket_endpoint: "{{ bucket_url | default(bucket_host) }}"
    bucket_endpoint_internal: "{{ bucket_url | default(bucket_host) }}"
  tags:
    - always

# ACD (acd.env SIP_PROXY): en cómputo apunta al Kamailio del edge; en edge/AIO es local.
- name: TOPOLOGY Default kamailio_pstn_host when not set in inventory
  ansible.builtin.set_fact:
    kamailio_pstn_host: "{{ edge_host if (oml_runs_omlapp_web or oml_runs_omlapp_workers or oml_runs_dialer_workers or oml_runs_acd or oml_runs_callrec_processor) and not ('edge' in group_names) else omni_ip_lan }}"
  when:
    - kamailio_pstn_host is not defined
    - oml_runs_edge or oml_is_aio or oml_runs_omlapp_web or oml_runs_omlapp_workers or oml_runs_dialer_workers or oml_runs_acd or oml_runs_callrec_processor
  tags:
    - always

- name: TOPOLOGY Normalize dialer defaults
  ansible.builtin.set_fact:
    dialer_caps: "{{ dialer_caps | default(1) }}"
    dialer_process_campaign_replicas: "{{ dialer_process_campaign_replicas | default(10) }}"
    dialer_process_contact_replicas: "{{ dialer_process_contact_replicas | default(1) }}"
    dialer_process_event_replicas: "{{ dialer_process_event_replicas | default(1) }}"
  when:
    - dialer_engine is defined
    - dialer_engine == "omnidialer"
  tags:
    - always

- name: TOPOLOGY Compute component switches
  ansible.builtin.set_fact:
    component_minio_enabled: "{{ oml_runs_data_statefull and not bucket_out }}"
    component_postgresql_enabled: "{{ oml_runs_data_statefull and not postgres_out }}"
    component_redis_enabled: "{{ oml_runs_data_stateless }}"
    component_gearman_enabled: "{{ oml_runs_data_stateless }}"
    component_rtpengine_enabled: "{{ oml_runs_edge and not rtpengine_out }}"
    component_telephony_edge_enabled: "{{ oml_runs_edge }}"
    # HAProxy sólo en hosts del grupo edge explícito (no en omnileads_aio sin grupo edge).
    component_haproxy_enabled: "{{ 'edge' in group_names }}"
    component_acd_enabled: "{{ oml_runs_acd }}"
    component_websockets_enabled: "{{ oml_runs_omlapp_web }}"
    component_omlapp_enabled: "{{ oml_runs_omlapp_web }}"
    component_omlapp_workers_enabled: "{{ oml_runs_omlapp_workers }}"
    component_interaction_processor_enabled: "{{ oml_runs_omlapp_workers }}"
    component_dialer_enabled: "{{ oml_runs_dialer_workers and dialer_engine is defined and dialer_engine == 'omnidialer' }}"
    component_nginx_enabled: "{{ oml_runs_omlapp_web }}"
    component_call_logger_enabled: "{{ oml_runs_callrec_processor }}"
    component_observability_prometheus_enabled: >-
      {{
        oml_runs_omlapp_web or oml_runs_omlapp_workers or oml_runs_acd
        or oml_runs_data_statefull or oml_runs_edge or oml_runs_dialer_workers
        or oml_runs_callrec_processor
      }}
    component_observability_promtail_enabled: "{{ loki_url is defined or (oml_observability_deploy | default(false) | bool) }}"
    component_addons_enabled: "{{ oml_runs_omlapp_web }}"
    component_qa_enabled: "{{ qa_env is defined }}"
  tags:
    - always
