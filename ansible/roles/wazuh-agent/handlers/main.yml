# ISO/IEC 27001 — Control 8.9: reinicio controlado tras cambios de configuración.
# ISO/IEC 27001 — Control 8.16: garantiza continuidad del monitoreo en el host.
---
- name: restart wazuh-agent
  ansible.builtin.systemd:
    name: wazuh-agent
    state: restarted
    enabled: "{{ wazuh_agent_service_enabled | bool }}"
    daemon_reload: true
