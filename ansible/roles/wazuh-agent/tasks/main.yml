#
# ISO/IEC 27001 — Control 8.9 (Gestión de la configuración):
# Instalación y enrollment idempotentes del agente Wazuh vía Ansible, con estado
# deseado declarado (paquete, repos oficiales, servicio systemd).
#
# ISO/IEC 27001 — Control 8.16 (Monitoreo de actividades):
# Despliegue del agente que habilita FIM, recolección de logs del SO y detección
# de vulnerabilidades hacia el Wazuh Manager.
---
- name: WAZUH Validate manager endpoint is defined
  ansible.builtin.assert:
    that:
      - wazuh_manager is defined
      - wazuh_manager | string | length > 0
    fail_msg: >-
      wazuh_manager debe definir la IP o FQDN del Wazuh Manager
      (group_vars, host_vars o -e). No hardcodear secretos en el rol.
    success_msg: "WAZUH Manager configurado: {{ wazuh_manager }}"

- name: WAZUH Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto

- name: WAZUH Check existing client.keys (enrollment state)
  ansible.builtin.stat:
    path: /var/ossec/etc/client.keys
  register: wazuh_client_keys

- name: WAZUH Derive install and enrollment facts
  ansible.builtin.set_fact:
    wazuh_agent_installed: "{{ 'wazuh-agent' in ansible_facts.packages }}"
    wazuh_agent_registered: "{{ (wazuh_client_keys.stat.exists | default(false)) and ((wazuh_client_keys.stat.size | default(0) | int) > 0) }}"
    wazuh_agent_install_env: "{{ {'WAZUH_MANAGER': wazuh_manager | string, 'WAZUH_AGENT_GROUP': wazuh_agent_group | string} | combine(({'WAZUH_AGENT_NAME': wazuh_agent_name | string} if ((wazuh_agent_name | default('') | string | length) > 0) else {})) | combine(({'WAZUH_REGISTRATION_PASSWORD': wazuh_registration_password | string} if ((wazuh_registration_password | default('') | string | length) > 0) else {})) }}"
  no_log: "{{ (wazuh_registration_password | default('') | string | length) > 0 }}"
  changed_when: false

- name: WAZUH Skip enrollment messaging when already registered
  ansible.builtin.debug:
    msg: >-
      wazuh-agent ya instalado y registrado en este host
      (idempotencia: no se reintenta el enrollment).
  when:
    - wazuh_agent_installed | bool
    - wazuh_agent_registered | bool

# --- Repositorio oficial (Debian / Ubuntu) ------------------------------------

- name: WAZUH Ensure gnupg is present for keyring (Debian)
  ansible.builtin.apt:
    name: gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - ansible_os_family == "Debian"
    - not (wazuh_agent_installed | bool)

- name: WAZUH Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /usr/share/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - ansible_os_family == "Debian"
    - not (wazuh_agent_installed | bool)

- name: WAZUH Download official GPG key (Debian)
  ansible.builtin.get_url:
    url: "{{ wazuh_agent_gpg_key_url }}"
    dest: /tmp/GPG-KEY-WAZUH
    mode: "0644"
    force: false
  when:
    - ansible_os_family == "Debian"
    - not (wazuh_agent_installed | bool)

- name: WAZUH Install dearmored GPG keyring (Debian)
  ansible.builtin.command:
    cmd: gpg --batch --yes --dearmor -o /usr/share/keyrings/wazuh.gpg /tmp/GPG-KEY-WAZUH
    creates: /usr/share/keyrings/wazuh.gpg
  when:
    - ansible_os_family == "Debian"
    - not (wazuh_agent_installed | bool)

- name: WAZUH Ensure wazuh.gpg permissions (Debian)
  ansible.builtin.file:
    path: /usr/share/keyrings/wazuh.gpg
    owner: root
    group: root
    mode: "0644"
  when:
    - ansible_os_family == "Debian"
    - not (wazuh_agent_installed | bool)

- name: WAZUH Add official apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] {{ wazuh_agent_repo_apt }} stable main"
    filename: wazuh
    state: present
    update_cache: true
  when:
    - ansible_os_family == "Debian"
    - not (wazuh_agent_installed | bool)

# --- Repositorio oficial (RedHat / Rocky / Alma) ------------------------------

- name: WAZUH Import official GPG key (RedHat family)
  ansible.builtin.rpm_key:
    key: "{{ wazuh_agent_gpg_key_url }}"
    state: present
  when:
    - ansible_os_family == "RedHat"
    - not (wazuh_agent_installed | bool)

- name: WAZUH Add official yum/dnf repository
  ansible.builtin.yum_repository:
    name: wazuh
    description: Wazuh repository
    baseurl: "{{ wazuh_agent_repo_yum }}"
    gpgcheck: true
    gpgkey: "{{ wazuh_agent_gpg_key_url }}"
    enabled: true
    state: present
  when:
    - ansible_os_family == "RedHat"
    - not (wazuh_agent_installed | bool)

# --- Instalación desatendida + enrollment (solo si el paquete no está) --------
# Las variables WAZUH_* solo aplican en el postinst del primer install del paquete.

- name: WAZUH Install and enroll wazuh-agent (Debian/apt)
  ansible.builtin.apt:
    name: wazuh-agent
    state: "{{ wazuh_agent_package_state }}"
    update_cache: true
    cache_valid_time: 3600
  environment: "{{ wazuh_agent_install_env }}"
  when:
    - ansible_os_family == "Debian"
    - not (wazuh_agent_installed | bool)
  no_log: "{{ (wazuh_registration_password | default('') | string | length) > 0 }}"
  notify: restart wazuh-agent

- name: WAZUH Install and enroll wazuh-agent (RedHat/dnf)
  ansible.builtin.dnf:
    name: wazuh-agent
    state: "{{ wazuh_agent_package_state }}"
  environment: "{{ wazuh_agent_install_env }}"
  when:
    - ansible_os_family == "RedHat"
    - not (wazuh_agent_installed | bool)
  no_log: "{{ (wazuh_registration_password | default('') | string | length) > 0 }}"
  notify: restart wazuh-agent

# --- Enrollment diferido (paquete presente, client.keys vacío/ausente) --------
# Las env WAZUH_* solo aplican en el postinst; si el paquete ya existía sin
# registro, se usa agent-auth contra authd del Manager.

- name: WAZUH Build agent-auth argument list
  ansible.builtin.set_fact:
    wazuh_agent_auth_argv: "{{ ['/var/ossec/bin/agent-auth', '-m', wazuh_manager | string, '-p', wazuh_agent_authd_port | string, '-G', wazuh_agent_group | string] + (['-A', wazuh_agent_name | string] if ((wazuh_agent_name | default('') | string | length) > 0) else []) + (['-P', wazuh_registration_password | string] if ((wazuh_registration_password | default('') | string | length) > 0) else []) }}"
  when:
    - wazuh_agent_installed | bool
    - not (wazuh_agent_registered | bool)
  no_log: "{{ (wazuh_registration_password | default('') | string | length) > 0 }}"
  changed_when: false

- name: WAZUH Enroll existing agent via agent-auth
  ansible.builtin.command:
    argv: "{{ wazuh_agent_auth_argv }}"
  when:
    - wazuh_agent_installed | bool
    - not (wazuh_agent_registered | bool)
  no_log: "{{ (wazuh_registration_password | default('') | string | length) > 0 }}"
  register: wazuh_agent_auth_result
  changed_when: wazuh_agent_auth_result.rc == 0
  notify: restart wazuh-agent

# --- Servicio systemd ---------------------------------------------------------

- name: WAZUH Ensure wazuh-agent service is enabled and started
  ansible.builtin.systemd:
    name: wazuh-agent
    enabled: "{{ wazuh_agent_service_enabled | bool }}"
    state: "{{ wazuh_agent_service_state }}"
    daemon_reload: true
  when: wazuh_agent_package_state != "absent"
