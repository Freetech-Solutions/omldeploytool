# Asterisk Server common template (shared by acd-server and dialer-server)
x-asterisk-server-common: &asterisk-server-common
  <<: *acd-common
  build:
    context: ./$REPO_PATH/acd/
    dockerfile: Dockerfile
  entrypoint: [ "/docker-entrypoint.sh" ]
  depends_on:
    <<: *deps-gearman
  privileged: true
  stop_grace_period: 30s
  working_dir: /etc/asterisk
  healthcheck:
    test: [ "CMD-SHELL", "asterisk -rx 'core show channels' | grep -q 'active channels' || exit 1" ]
    <<: *healthcheck-tcp
  volumes:
    - asterisk_callrec:/var/spool/asterisk/recording
    - asterisk_conf:/etc/asterisk/retrieve_conf
    - asterisk_sounds:/var/lib/asterisk/sounds

# Asterisk Server common environment variables
x-asterisk-server-env: &asterisk-server-env
  AMI_USER: ${ACD_AMI_USER}
  AMI_PASSWORD: ${ACD_AMI_PASSWORD}
  ASTERISK_APP: ${ACD_APP}
  ASTERISK_HOSTNAME: ${ACD_HOSTNAME}
  FASTAGI: ${FASTAGI_HOSTNAME}
  GEARMAN_HOST: ${GEARMAN_HOSTNAME}
  HOMER_ENABLE: ${HOMER_ENABLE}
  HOMERHOST: ${HOMER_HOSTNAME}
  HOMERPORT: ${HOMER_PORT}
  LOG_LEVEL: ${ACD_LOG_LEVEL}
  NODE_ID: ${ACD_HOSTNAME}
  POSTGRES_HOSTNAME: ${POSTGRES_HOSTNAME}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  RTP_PORT_MAX: ${ACD_RTP_PORT_MAX}
  RTP_PORT_MIN: ${ACD_RTP_PORT_MIN}  
  VOIP_PROXY_HOSTNAME: ${KAMAILIO_PSTN_HOSTNAME:-kamailio-pstn}
  VOIP_PROXY_PORT: ${KAMAILIO_PSTN_UDP_PORT:-5060}
  TZ: ${TZ}
  WEBRTC_PROXY_HOSTNAME: ${KAMAILIO_WEBRTC_HOSTNAME:-kamailio-webrtc}
  WEBRTC_PROXY_PORT: ${KAMAILIO_WEBRTC_UDP_PORT:-10060}

# Asterisk Conf Generator common template
x-asterisk-conf-generator-common: &asterisk-conf-generator-common
  <<: *acd-common
  working_dir: /opt/asterisk/workers/
  entrypoint: [ "python", "astconf.py" ]
  stop_grace_period: 10s
  volumes:
    - asterisk_conf:/home/omnileads/astconf
    - asterisk_sounds:/home/omnileads/sounds

# Asterisk Conf Generator environment variables
x-asterisk-conf-generator-env: &asterisk-conf-generator-env
  ASTERISK_LOCATION: ""
  ARI_HOST: acd-server
  ARI_USER: ${ACD_AMI_USER}
  ARI_PASS: ${ACD_AMI_PASSWORD}
  OMNILEADS_HOSTNAME: ${NGINX_HOSTNAME}
  TZ: ${TZ}

# Callrec service common template
x-callrec-service-common: &callrec-service-common
  <<: *base-service-common
  depends_on:
    <<: *deps-minio-gearman

# Callrec environment variables base
