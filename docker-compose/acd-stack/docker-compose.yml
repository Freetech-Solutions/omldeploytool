  BUCKET_SECRET_ACCESS_KEY: ${BUCKET_SECRET_ACCESS_KEY}
  BUCKET_DEFAULT_REGION: ${BUCKET_DEFAULT_REGION}
  DB_HOST: ${POSTGRES_HOSTNAME}
  DB_NAME: ${POSTGRES_DB}
  DB_USER: ${POSTGRES_USER}
  DB_PASS: ${POSTGRES_PASSWORD}
