  GEARMAN_HOST: ${GEARMAN_HOSTNAME}
  S3_BUCKET_NAME: ${BUCKET_NAME}
  TZ: ${TZ}

# ACD Worker common template (for call-logger and similar workers)
x-acd-worker-common: &acd-worker-common
  <<: *acd-common
  working_dir: /opt/asterisk/workers/
  stop_grace_period: 10s
  depends_on:
    <<: *deps-pg-gearman-redis

# Dialer API common template
x-dialer-api-common: &dialer-api-common
  <<: *base-service-common
  stop_signal: SIGINT
  tty: true
  stdin_open: true
  depends_on:
    <<: *deps-pg

# Kamailio common template (WebRTC y PSTN comparten imagen y base)
x-kamailio-common: &kamailio-common
  <<: *base-service-common
  build:
    context: ./$REPO_PATH/kamailio
    dockerfile: Dockerfile
  image: ${KAMAILIO_IMG}
  privileged: true

# Vue.js dev tools common template
x-vue-common: &vue-common
  image: freetechsolutions/vue-cli:develop
  networks:
    - omnileads
  working_dir: /home/oml_frontend
  volumes:
    - ${REPO_PATH}/django/omnileads_ui/:/home/oml_frontend/

# ============================================================================
# NETWORKS & VOLUMES
# ============================================================================
networks:
  omnileads:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "${SUBNET}"

volumes:
  postgresql:
  redis:
  minio:
  django_media:
  django_static:
  django_callrec_zip:
  asterisk_callrec:
  asterisk_sounds:
  asterisk_conf:
  faster_whisper_cache:
  redis_redisinsight:
  pgadmin:

# ============================================================================
# SERVICES
# ============================================================================
services:

  # ----------------------------------------------------------------------------
  # TELEPHONY ACD
  # ----------------------------------------------------------------------------
  fastagi:
    build:
      context: ./$REPO_PATH/fastagi/
      dockerfile: Dockerfile
    image: ${FASTAGI_IMG}
    <<: *base-service-common
    depends_on:
      <<: *deps-pg-redis
    command: python /app/fastagi.py
    environment:
      DIALER_AMD_ENDPOINT: ${DIALER_API_HOST}
      GEARMAN_JOB_SERVERS: ${GEARMAN_JOB_SERVERS}
      OMNILEADS_HOSTNAME: ${NGINX_HOSTNAME}
      PGHOST: ${POSTGRES_HOSTNAME}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOSTNAME: ${REDIS_HOSTNAME}
      REDIS_PORT: ${REDIS_PORT}
      TZ: ${TZ}

  acd-conf-generator:
    <<: *asterisk-conf-generator-common
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      <<: *asterisk-conf-generator-env

  acd-server:
    <<: *asterisk-server-common
    networks:
      omnileads:
        ipv4_address: ${ACD_HOST_IP}
    environment:
      AMD_SAMPLE_REC: 1
      <<: *asterisk-server-env
    #volumes:
    #  - ../.custom_conf/acd_custom_exten.conf:/etc/asterisk/oml_extensions_custom.conf:ro

  acd-app:
    <<: *acd-ari-common
    entrypoint: [ "python", "main.py" ]
    depends_on:
      redis:
        condition: service_healthy
      acd-server:
        condition: service_healthy
    environment:
      <<: *acd-ari-env
      ASTERISK_APP: ${ACD_APP}
      SIP_EXTRA_HEADERS: "X-Verloop-callID: business_id|X-Verloop-customerID: id_customer|X-Verloop-CampID: camp_id"
    volumes:
      - asterisk_callrec:/var/spool/asterisk/recording
      # - ${REPO_PATH}/acd/source/ari-app/:/opt/asterisk/ari-app:ro