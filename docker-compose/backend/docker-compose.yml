# ============================================================================
# YAML Templates (Anchors)
# ============================================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart-policy: &restart-policy
  restart: on-failure

x-healthcheck-http: &healthcheck-http
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

x-healthcheck-tcp: &healthcheck-tcp
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

# Optional service common template
x-optional-service-common: &optional-service-common
  <<: *base-service-common
  stop_grace_period: 30s

# ============================================================================
# NETWORKS & VOLUMES
# ============================================================================
networks:
  omnileads:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "${SUBNET}"

volumes:
  postgresql:
  redis:
  minio:
  dialer_postgresql:
  redis_redisinsight:
  pgadmin:

services:

  # ----------------------------------------------------------------------------
  # BACKEND SERVICES
  # ----------------------------------------------------------------------------
  postgresql:
    image: ${POSTGRES_IMG}
    dns: 8.8.8.8
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - omnileads
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -q" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 90s
    volumes:
      - postgresql:/var/lib/postgresql

  redis:
    image: ${REDIS_IMG}
    dns: 8.8.8.8
    environment:
      TZ: ${TZ}
      BIND_IP: 0.0.0.0
    networks:
      - omnileads
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      <<: *healthcheck-tcp
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 30s
    volumes:
      - redis:/data

  minio:
    image: ${MINIO_IMG}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_HTTP_ADMIN_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_HTTP_ADMIN_PASS}
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
      TZ: ${TZ}
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      <<: *healthcheck-tcp
    networks:
      - omnileads
    ports:
      - 127.0.0.1:${MINIO_EXT_PORT:-9000}:9000/tcp
      - 127.0.0.1:${MINIO_EXT_CONSOLE_PORT:-9001}:9001/tcp
    restart: on-failure
    logging: *default-logging
    volumes:
      - minio:/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - omnileads
    logging: *default-logging
    restart: "no" # Solo ejecutar una vez
    entrypoint: >
      /bin/sh -c " echo 'Esperando a que MinIO esté listo...'; sleep 5; echo 'Configurando alias de MinIO...'; /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_HTTP_ADMIN_USER} ${MINIO_HTTP_ADMIN_PASS}; echo 'Verificando conexión...'; /usr/bin/mc admin info myminio; echo 'Creando bucket omnileads...'; /usr/bin/mc mb myminio/omnileads --ignore-existing; echo 'Creando usuario omlminio...'; /usr/bin/mc admin user add myminio omlminio ${BUCKET_SECRET_ACCESS_KEY}; echo 'Asignando política readwrite al usuario...'; /usr/bin/mc admin policy attach myminio readwrite --user omlminio; echo 'Configuración completada exitosamente'; "

  gearman:
    image: ${GEARMAN_IMG}
    environment:
      TZ: ${TZ}
    networks:
      - omnileads
    command: gearmand -t 1
    healthcheck:
      test: [ "CMD-SHELL", "gearadmin --status" ]
      <<: *healthcheck-tcp
      start_period: 40s
    restart: on-failure
    logging: *default-logging

  dialer-postgresql:
    image: ${POSTGRES_IMG}
    dns: 8.8.8.8
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${DIALER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DIALER_POSTGRES_DB}
      PGPORT: "5433"
    networks:
      - omnileads
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DIALER_POSTGRES_USER} -d ${DIALER_POSTGRES_DB} -q" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 90s
    volumes:
      - dialer_postgresql:/var/lib/postgresql
      - ../omnidialer.sql:/docker-entrypoint-initdb.d/init.sql

  redisinsight:
    image: redis/redisinsight:latest
    <<: *optional-service-common
    environment:
      BIND_IP: "0.0.0.0"
      TZ: ${TZ}
    ports:
      - '127.0.0.1:7963:5540'
    volumes:
      - redis_redisinsight:/data

  pgadmin:
    image: dpage/pgadmin4:latest
    <<: *optional-service-common
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@omnileads.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_WTF_CSRF_ENABLED: "True"
      PGADMIN_CONFIG_SESSION_COOKIE_SECURE: "False"
      TZ: ${TZ}
    ports:
      - 127.0.0.1:${PGADMIN_EXT_PORT:-5050}:80/tcp
    volumes:
      - pgadmin:/var/lib/pgadmin
    user: "5050:5050"
    depends_on:
      postgresql:
        condition: service_healthy
      dialer-postgresql:
        condition: service_healthy
