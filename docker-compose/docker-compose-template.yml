# ============================================================================
# YAML Templates (Anchors)
# ============================================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck-http: &healthcheck-http
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

x-healthcheck-tcp: &healthcheck-tcp
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

# Base service common template (networks, restart, logging, stop_grace_period)
x-base-service-common: &base-service-common
  networks:
    - omnileads
  restart: on-failure
  logging: *default-logging
  stop_grace_period: 10s

# Optional service common template
x-optional-service-common: &optional-service-common
  <<: *base-service-common
  stop_grace_period: 30s

# Mapas de dependencias componibles: se insertan dentro de depends_on: con
# <<: y se pueden extender con dependencias extra en el servicio.
x-deps-pg: &deps-pg
  postgresql:
    condition: service_healthy

x-deps-redis: &deps-redis
  redis:
    condition: service_healthy

x-deps-gearman: &deps-gearman
  gearman:
    condition: service_healthy

x-deps-pg-redis: &deps-pg-redis
  <<: *deps-pg
  redis:
    condition: service_healthy

x-deps-pg-redis-minio: &deps-pg-redis-minio
  <<: *deps-pg-redis
  minio:
    condition: service_healthy

x-deps-pg-gearman-redis: &deps-pg-gearman-redis
  <<: *deps-pg-redis
  gearman:
    condition: service_healthy

x-deps-minio-gearman: &deps-minio-gearman
  minio:
    condition: service_healthy
  gearman:
    condition: service_healthy

# Django common template
x-django-common: &django-common
  image: ${APP_IMG}
  networks:
    - omnileads
  restart: on-failure
  logging: *default-logging
  stdin_open: true
  tty: true
  environment: &django-env
    BUCKET_ACCESS_KEY_ID: ${BUCKET_ACCESS_KEY_ID}
    BUCKET_SECRET_ACCESS_KEY: ${BUCKET_SECRET_ACCESS_KEY}
    BUCKET_DEFAULT_REGION: ${BUCKET_DEFAULT_REGION}
    BUCKET_NAME: ${BUCKET_NAME}
    BUCKET_ENDPOINT: ${BUCKET_ENDPOINT}
    BUCKET_ENDPOINT_INTERNAL: ${BUCKET_ENDPOINT_INTERNAL}
    CALIFICACION_REAGENDA: ${CALIFICACION_REAGENDA}
    CALLREC_DEVICE: ${BUCKET_DEVICE}
    DJANGO_HOSTNAME: ${DJANGO_HOSTNAME}
    DJANGO_ALLOW_ASYNC_UNSAFE: "true"
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE}
    EMAIL_BACKEND: "django.core.mail.backends.dummy.EmailBackend"
    EPHEMERAL_USER_TTL: ${EPHEMERAL_USER_TTL}
    GEARMAN_JOB_SERVERS: ${GEARMAN_JOB_SERVERS}
    GEARMAN_QUEUE_CALL: acd-call-processor
    GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    GOOGLE_MAPS_CENTER: '${GOOGLE_MAPS_CENTER}'
    KAMAILIO_HOSTNAME: ${KAMAILIO_WEBRTC_HOSTNAME}
    KAMAILIO_PORT: ${KAMAILIO_WEBRTC_SIP_PORT}
    LOGIN_FAILURE_LIMIT: ${LOGIN_FAILURE_LIMIT}
    OML_BUILD_DATE: ${APP_IMG}
    OMNILEADS_HOSTNAME: ${NGINX_HOSTNAME}
    OML_OMNIDIALER_SECRET: ${DIALER_PASSWORD}
    OMNIDIALER_HOST: ${DIALER_API_HOST}
    PYTHONPATH: ${PYTHONPATH}
    PGHOST: ${POSTGRES_HOSTNAME}
    PGDATABASE: ${POSTGRES_DB}
    PGPORT: ${POSTGRES_PORT}
    PGUSER: ${POSTGRES_USER}
    PGPASSWORD: ${POSTGRES_PASSWORD}
    PGHOSTHA: ${POSTGRES_HA}
    PGHOSTRO: ${POSTGRES_NODE_RO}
    REDIS_HOSTNAME: ${REDIS_HOSTNAME}
    SESSION_COOKIE_AGE: ${SESSION_COOKIE_AGE}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
    SECRET_KEY: ${DJANGO_SECRET_KEY}
    SIP_SECRET_KEY: ${SIP_SECRET_KEY}
    PRESENCE_LOG_RECONNECT_COOLDOWN_MS: ${PRESENCE_LOG_RECONNECT_COOLDOWN_MS:-1500}
    PRESENCE_HEARTBEAT_INTERVAL_SEC: ${PRESENCE_HEARTBEAT_INTERVAL_SEC:-10}
    PRESENCE_HEARTBEAT_TIMEOUT_SEC: ${PRESENCE_HEARTBEAT_TIMEOUT_SEC:-30}
    PRESENCE_HEARTBEAT_SWEEP_SEC: ${PRESENCE_HEARTBEAT_SWEEP_SEC:-15}
    PRESENCE_HEARTBEAT_LOGOUT_RECENT_SEC: ${PRESENCE_HEARTBEAT_LOGOUT_RECENT_SEC:-90}
    PRESENCE_HEARTBEAT_GUARD_TTL_SEC: ${PRESENCE_HEARTBEAT_GUARD_TTL_SEC:-90}
    TZ: ${TZ}
    UWSGI_PORT: ${UWSGI_PORT}
    WEBSOCKET_HOST: ${WEBSOCKET_HOSTNAME}
    WEBSOCKET_PORT: ${WEBSOCKET_PORT}

# Django web common template
x-django-web-common: &django-web-common
  <<: *django-common
  working_dir: /opt/omnileads/ominicontacto
  stop_grace_period: 30s

# Django worker common template
x-django-worker-common: &django-worker-common
  <<: *django-common
  depends_on:
    <<: *deps-pg-redis
  working_dir: /opt/omnileads/ominicontacto
  stop_grace_period: 30s

# Worker common template
x-dialer-worker-common: &dialer-worker-common
  build:
    context: ./$REPO_PATH/dialer/workers/handle-campaign/src
  image: ${DIALER_WORKER_IMG}
  networks:
    - omnileads
  restart: on-failure
  logging: *default-logging
  stop_signal: SIGINT
  tty: true
  stdin_open: true
  depends_on:
    <<: *deps-pg-gearman-redis
  environment: &dialer-worker-env
    CAPS: ${DIALER_CAPS}
    GEARMAN_JOB_SERVERS: ${GEARMAN_JOB_SERVERS}
    POSTGRES_OML_SERVER: ${POSTGRES_HOSTNAME}
    POSTGRES_OML_PORT: ${POSTGRES_PORT}
    POSTGRES_OML_USER: ${POSTGRES_USER}
    POSTGRES_OML_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DIALER_SERVER: ${POSTGRES_HOSTNAME}
    POSTGRES_DIALER_PORT: ${POSTGRES_PORT}
    POSTGRES_DIALER_USER: ${POSTGRES_USER}
    POSTGRES_DIALER_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DIALER_DB: ${DIALER_POSTGRES_DB:-omnidialer}
    REDIS_OML_SERVER: ${REDIS_HOSTNAME}
    REDIS_OML_PORT: ${REDIS_PORT}
    REDIS_DIALER_SERVER: ${REDIS_HOSTNAME}
    REDIS_DIALER_PORT: ${REDIS_PORT}
    PYTHON_LOGLEVEL: ${DIALER_PYTHON_LOGLEVEL}
    TIME_BETWEEN_CALLS: ${DIALER_TIME_BETWEEN_CALLS}
    DIALER_CHANNEL_AUDIT_INTERVAL_SEC: ${DIALER_CHANNEL_AUDIT_INTERVAL_SEC:-60}
    DIALER_CHANNEL_AUDIT_LOCK_TTL_SEC: ${DIALER_CHANNEL_AUDIT_LOCK_TTL_SEC:-55}
    DIALER_RESERVE_GRACE_SEC: ${DIALER_RESERVE_GRACE_SEC:-30}
    DIALER_MAX_ABANDON_RATE: ${DIALER_MAX_ABANDON_RATE:-0.03}
    DIALER_WARM_UP_SAMPLE_SIZE: ${DIALER_WARM_UP_SAMPLE_SIZE:-50}
    DIALER_PREDICTIVE_TICK_MS: ${DIALER_PREDICTIVE_TICK_MS:-1000}
    DIALER_HIT_RATE_FLOOR: ${DIALER_HIT_RATE_FLOOR:-0.05}
    DIALER_DROP_RATE_ALPHA: ${DIALER_DROP_RATE_ALPHA:-0.1}
    DIALER_DEFAULT_ART_SEC: ${DIALER_DEFAULT_ART_SEC:-15}
    DIALER_P_LIB_REMAINING_EPS: ${DIALER_P_LIB_REMAINING_EPS:-1.0}
    DIALER_PREDICTIVE_ENABLED: ${DIALER_PREDICTIVE_ENABLED:-true}
    DIALER_GAMMA_THROTTLE_FLOOR: ${DIALER_GAMMA_THROTTLE_FLOOR:-0.2}
    TZ: ${TZ}

# ACD common template
