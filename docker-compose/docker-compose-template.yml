    <<: *deps-minio-gearman

# Callrec environment variables base
x-callrec-env-base: &callrec-env-base
  BUCKET_ACCESS_KEY_ID: ${BUCKET_ACCESS_KEY_ID}
  BUCKET_SECRET_ACCESS_KEY: ${BUCKET_SECRET_ACCESS_KEY}
  BUCKET_DEFAULT_REGION: ${BUCKET_DEFAULT_REGION}
  DB_HOST: ${POSTGRES_HOSTNAME}
  DB_NAME: ${POSTGRES_DB}
  DB_USER: ${POSTGRES_USER}
  DB_PASS: ${POSTGRES_PASSWORD}
  DB_PORT: ${POSTGRES_PORT}
  CALLREC_DEVICE: ${BUCKET_DEVICE}
  GEARMAN_HOST: ${GEARMAN_HOSTNAME}
  S3_BUCKET_NAME: ${BUCKET_NAME}
  TZ: ${TZ}

# ACD Worker common template (for call-logger and similar workers)
x-acd-worker-common: &acd-worker-common
  <<: *acd-common
  working_dir: /opt/asterisk/workers/
  stop_grace_period: 10s
  depends_on:
    <<: *deps-pg-gearman-redis

# Dialer API common template
x-dialer-api-common: &dialer-api-common
  <<: *base-service-common
  stop_signal: SIGINT
  tty: true
  stdin_open: true
  depends_on:
    <<: *deps-pg

# Kamailio common template (WebRTC y PSTN comparten imagen y base)
x-kamailio-common: &kamailio-common
  <<: *base-service-common
  build:
    context: ./$REPO_PATH/kamailio
    dockerfile: Dockerfile
  image: ${KAMAILIO_IMG}
  privileged: true

# Vue.js dev tools common template
x-vue-common: &vue-common
  image: freetechsolutions/vue-cli:develop
  networks:
    - omnileads
  working_dir: /home/oml_frontend
  volumes:
    - ${REPO_PATH}/django/omnileads_ui/:/home/oml_frontend/

# ============================================================================
# NETWORKS & VOLUMES
# ============================================================================
networks:
  omnileads:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "${SUBNET}"

volumes:
  postgresql:
  redis:
  minio:
  django_media:
  django_static:
  django_callrec_zip:
  asterisk_callrec:
  asterisk_sounds:
  asterisk_conf:
  faster_whisper_cache:
  redis_redisinsight:
  pgadmin:

# ============================================================================
# SERVICES
# ============================================================================
services:

  # ----------------------------------------------------------------------------
  # BACKEND SERVICES
  # ----------------------------------------------------------------------------
  postgresql:
    image: ${POSTGRES_IMG}
    <<: *base-service-common
    stop_grace_period: 90s
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -q" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - postgresql:/var/lib/postgresql
      - ./omnidialer.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: ${REDIS_IMG}
    <<: *base-service-common
    stop_grace_period: 30s
    environment:
      TZ: ${TZ}
      BIND_IP: 0.0.0.0
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      <<: *healthcheck-tcp
    volumes:
      - redis:/data

  minio:
    image: ${MINIO_IMG}
    <<: *base-service-common
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_HTTP_ADMIN_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_HTTP_ADMIN_PASS}
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
      TZ: ${TZ}
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      <<: *healthcheck-tcp
    volumes:
      - minio:/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

  createbuckets:
    image: minio/mc:latest
    <<: *base-service-common
    restart: "no" # Solo ejecutar una vez
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " echo 'Esperando a que MinIO esté listo...'; sleep 5; echo 'Configurando alias de MinIO...'; /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_HTTP_ADMIN_USER} ${MINIO_HTTP_ADMIN_PASS}; echo 'Verificando conexión...'; /usr/bin/mc admin info myminio; echo 'Creando bucket omnileads...'; /usr/bin/mc mb myminio/omnileads --ignore-existing; echo 'Creando usuario omlminio...'; /usr/bin/mc admin user add myminio omlminio ${BUCKET_SECRET_ACCESS_KEY}; echo 'Asignando política readwrite al usuario...'; /usr/bin/mc admin policy attach myminio readwrite --user omlminio; echo 'Configuración completada exitosamente'; "

  gearman:
    image: ${GEARMAN_IMG}
    <<: *base-service-common
    environment:
      TZ: ${TZ}
    command: gearmand -t 1
    healthcheck:
      test: [ "CMD-SHELL", "gearadmin --status" ]
      <<: *healthcheck-tcp
      start_period: 40s

  # ----------------------------------------------------------------------------
  # WEB SERVICES
  # ----------------------------------------------------------------------------

  nginx:
    build:
      context: ./$REPO_PATH/nginx/
      dockerfile: Dockerfile
    image: ${NGINX_IMG}
    depends_on:
      omlapp:
        condition: service_healthy
      daphne:
        condition: service_started
      websockets:
        condition: service_started
    environment:
      ASGI_PORT: ${DAPHNE_PORT}
      DJANGO_HOSTNAME: ${DJANGO_HOSTNAME}
      DAPHNE_HOSTNAME: ${DAPHNE_HOSTNAME}
      KAMAILIO_HOSTNAME: ${KAMAILIO_WEBRTC_HOSTNAME}
      KAMAILIO_PORT: ${KAMAILIO_HTTPS_PORT}
      S3_ENDPOINT: http://minio:9000
      TZ: ${TZ}
      WEBSOCKETS_HOSTNAME: ${WEBSOCKET_HOSTNAME}
      WEBSOCKETS_PORT: ${WEBSOCKET_PORT}
      WEBUI_MODE: ${NGINX_WEBUI_MODE}
      WALLBOARD_WEBUI_PATH: ${NGINX_WALLBOARD_WEBUI_PATH}
      PREMIUMREPORTS_WEBUI_PATH: ${NGINX_PREMIUMREPORTS_WEBUI_PATH}
      WSGI_PORT: ${UWSGI_PORT}
    <<: *base-service-common
    stop_grace_period: 15s
    ports:
      - 443:443
    healthcheck:
      test: [ "CMD", "curl", "-fk", "https://localhost/health" ]
      <<: *healthcheck-http
      start_period: 30s
    volumes:
      - django_static:/opt/omnileads/static
      - django_callrec_zip:/opt/omnileads/asterisk/var/spool/asterisk/monitor
      - .custom_conf/certs/:/etc/omnileads/certs:ro

  omlapp:
    build:
      context: ./$REPO_PATH/django/
      dockerfile: Dockerfile
    image: ${APP_IMG}
    <<: *django-web-common
    depends_on:
      <<: *deps-pg-redis-minio
      acd-server:
        condition: service_healthy
    environment:
      <<: *django-env
      UWSGI_CUSTOM: True
      UWSGI_PROCESSES: ${UWSGI_PROCESSES}
      UWSGI_THREADS: ${UWSGI_THREADS}
      UWSGI_LISTEN_QUEUE_SIZE: ${UWSGI_LISTEN_QUEUE_SIZE}
      UWSGI_WORKER_RELOAD_MERCY: ${UWSGI_WORKER_RELOAD_MERCY}
      UWSGI_EVIL_RELOAD_ON_RSS: ${UWSGI_EVIL_RELOAD_ON_RSS}
      VOICEBOT_DEBUG_PAYLOAD: True
    command: ${DJANGO_ENTRYPOINT}
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsSL -o /dev/null http://${DJANGO_HOSTNAME}:${DJANGO_PORT:-8099}/ || exit 1" ]
      <<: *healthcheck-http
      start_period: 90s
    volumes:
      - django_static:/opt/omnileads/static
      - django_media:/opt/omnileads/media_root
      - ${REPO_PATH}/django/:/opt/omnileads/ominicontacto/

  django-commands:
    <<: *django-common
    depends_on:
      <<: *deps-pg-redis-minio
    command: /opt/omnileads/bin/django_commands.sh
    working_dir: /opt/omnileads/ominicontacto
    volumes:
      - django_static:/opt/omnileads/static
      - django_callrec_zip:/opt/omnileads/asterisk/var/spool/asterisk/monitor
    stop_grace_period: 30s

  daphne:
    <<: *django-common
    depends_on:
      <<: *deps-redis
    environment:
      <<: *django-env
      DAPHNE_ENABLE: "true"
      DAPHNE_PORT: ${DAPHNE_PORT:-8098}
      DJANGO_HOSTNAME: ${DAPHNE_HOSTNAME}
    command: /opt/omnileads/bin/init_daphne.sh
    working_dir: /opt/omnileads/ominicontacto
    stop_grace_period: 90s

  websockets:
    build:
      context: ./$REPO_PATH/websocket-server/
      target: run
      dockerfile: ./etc/fts/oml/services/websockets/dockerfile
    image: ${WS_IMG}
    <<: *base-service-common
    stop_grace_period: 30s
    depends_on:
      - redis
    environment:
      BIND_ADDRESS: "0.0.0.0:8000"
      EVENT_LOOP: "uvloop"
      LOGGERS: ${WEBSOCKET_LOGGER}
      REDIS_HOST: ${WEBSOCKET_REDIS_HOSTNAME}
      PYTHONUNBUFFERED: 1
      TZ: ${TZ}

  kamailio-webrtc:
    <<: *kamailio-common
    entrypoint: [ "/entrypoint_webrtc.sh" ]
    depends_on:
      <<: *deps-redis
    environment:
      ACD_NET_ADDR: ${KAMAILIO_ACD_SERVER_NET}
      AUTHEPH_SK: ${AUTHEPH_SK}
      KAMAILIO_CERTS_LOCATION: ${KAMAILIO_CERTS_LOCATION}
      KAMAILIO_HOSTNAME: ${KAMAILIO_WEBRTC_HOSTNAME}
      KAMAILIO_IFACE: ${KAMAILIO_WEBRTC_IFACE}
      REDIS_HOSTNAME: ${REDIS_HOSTNAME}
      RTPENGINE_HOSTNAME: ${RTPENGINE_HOSTNAME}
      SHM_SIZE: ${KAMAILIO_SHM_SIZE}
      PKG_SIZE: ${KAMAILIO_PKG_SIZE}
      TZ: ${TZ}
      HOMER_ENABLE: ${HOMER_ENABLE}
      HOMER_HOST: ${HOMER_HOSTNAME}
      HOMER_PORT: ${HOMER_PORT}
      HOMER_CAPTURE_ID: ${HOMER_KAMAILIO_WEBRTC_CAPTURE_ID:-2003}
      HOMER_NODE_NAME: ${HOMER_WEBRTC_NODE_NAME:-}

  # ----------------------------------------------------------------------------
  # OMLAPP WORKERS
  # ----------------------------------------------------------------------------
  whatsapp:
    <<: *django-worker-common
    command: /opt/omnileads/bin/init_whatsapp.sh

  background-tasks:
    <<: *django-worker-common
    command: /opt/omnileads/bin/init_worker_bgtasks.sh

  supervision-events-listener:
    <<: *django-worker-common
    command: python manage.py supervision_events_listener

  presence-heartbeat-scheduler:
    <<: *django-worker-common
    command: python manage.py presence_heartbeat_scheduler

  daily-redis-cleanup:
    <<: *django-worker-common
    command: /opt/omnileads/bin/init_daily_redis_cleanup.sh

  background-dialer-tasks:
    <<: *django-worker-common
    command: python manage.py omnidialer_events_listener

  dashboard-agent-scheduler:
    <<: *django-worker-common
    command: python manage.py actualizar_reporte_dia_actual_agentes_scheduler

  supervision-agentes-scheduler:
    <<: *django-worker-common
    command: python manage.py actualizar_reporte_supervisores_scheduler

  call-logger:
    build:
      context: ./$REPO_PATH/acd/
      dockerfile: Dockerfile
    image: ${ACD_IMG}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    <<: *acd-worker-common
    entrypoint: [ "python", "logger.py" ]
    environment:
      GEARMAN_JOB_SERVERS: ${GEARMAN_JOB_SERVERS}
      PGHOST: ${POSTGRES_HOSTNAME}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PYTHON_LOGLEVEL: ${ACD_LOG_LEVEL}
      REDIS_HOST: ${REDIS_HOSTNAME}
      REDIS_PORT: ${REDIS_PORT}
      TZ: ${TZ}


  # ----------------------------------------------------------------------------
  # TELEPHONY ACD
  # ----------------------------------------------------------------------------
  fastagi:
    build:
      context: ./$REPO_PATH/fastagi/
      dockerfile: Dockerfile
    image: ${FASTAGI_IMG}
    <<: *base-service-common
    depends_on:
      <<: *deps-pg-redis
    command: python /app/fastagi.py
    environment:
      DIALER_AMD_ENDPOINT: ${DIALER_API_HOST}
      GEARMAN_JOB_SERVERS: ${GEARMAN_JOB_SERVERS}
      OMNILEADS_HOSTNAME: ${NGINX_HOSTNAME}
      PGHOST: ${POSTGRES_HOSTNAME}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOSTNAME: ${REDIS_HOSTNAME}
      REDIS_PORT: ${REDIS_PORT}
      TZ: ${TZ}

  acd-conf-generator:
    <<: *asterisk-conf-generator-common
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      <<: *asterisk-conf-generator-env

  acd-server:
    <<: *asterisk-server-common
    networks:
      omnileads:
        ipv4_address: ${ACD_HOST_IP}
    environment:
      <<: *asterisk-server-env
    #volumes:
    #  - ../.custom_conf/acd_custom_exten.conf:/etc/asterisk/oml_extensions_custom.conf:ro

  acd-app:
    <<: *acd-ari-common
    entrypoint: [ "python", "main.py" ]
    depends_on:
      redis:
        condition: service_healthy
      acd-server:
        condition: service_healthy
    environment:
      <<: *acd-ari-env
      ASTERISK_APP: ${ACD_APP}
      SIP_EXTRA_HEADERS: "X-Verloop-callID: business_id|X-Verloop-customerID: id_customer|X-Verloop-CampID: camp_id"
    volumes:
      - asterisk_callrec:/var/spool/asterisk/recording
      # - ${REPO_PATH}/acd/source/ari-app/:/opt/asterisk/ari-app:ro

  # ----------------------------------------------------------------------------
  # PROCESSING HEAVY METAL SERVICES
  # ----------------------------------------------------------------------------

  callrec-compressor:
    build:
      context: ./$REPO_PATH/postcall_actions/callrec_compressor/
      dockerfile: Dockerfile
    image: ${CALLREC_COMPRESSOR_IMG}
    <<: *callrec-service-common
    environment:
      <<: *callrec-env-base
      S3_ENDPOINT: ${BUCKET_ENDPOINT_INTERNAL}

  callrec-transcriber:
    build:
      context: ./$REPO_PATH/postcall_actions/callrec_transcriber/
      dockerfile: Dockerfile
    image: ${CALLREC_TRANSCRIBER_IMG}
    <<: *callrec-service-common
    environment:
      <<: *callrec-env-base
      GOOGLE_APPLICATION_CREDENTIALS: ${STT_GCP_JSON_PATH}
      S3_ENDPOINT: ${BUCKET_ENDPOINT_INTERNAL}
      STT_ENGINE: ${STT_ENGINE}
      STT_API_KEY: ${STT_API_KEY}
      # Modelo Gemini: si 404, el worker consulta ListModels y prueba modelos disponibles
      GEMINI_TRANSCRIPTION_MODEL: ${GEMINI_TRANSCRIPTION_MODEL:-gemini-1.5-flash}
      SUMMARIZE_MODEL: ${SUMMARIZE_MODEL:-gemini-1.5-flash}
      SUMMARIZE_ENGINE: ${SUMMARIZE_ENGINE:-gemini}
      SUMMARIZE_ENABLED: ${SUMMARIZE_ENABLED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PGHOST: ${POSTGRES_HOSTNAME}
      PGPORT: ${POSTGRES_PORT}
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_OML_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOSTNAME}
      REDIS_PORT: ${REDIS_PORT}
    volumes:
      - faster_whisper_cache:/opt/models
  #     - ../.custom_conf/google_credentials.json:/${STT_GCP_JSON_PATH}:ro

  # ----------------------------------------------------------------------------
  # DIALER STACK SERVICES
  # ----------------------------------------------------------------------------
  dialer-api:
    image: ${DIALER_API_IMG}
    build:
      target: run
      context: ./$REPO_PATH/dialer/interface/src
    <<: *dialer-api-common
    environment:
      GEARMAN_JOB_SERVERS: ${GEARMAN_JOB_SERVERS}
      WEBSOCKET_SERVER: ${DIALER_DCHANNELS_URL}
      TZ: ${TZ}

  dialer-process-contact:
    <<: *dialer-worker-common
    environment:
      <<: *dialer-worker-env
      GEARMAN_JOBS: "process-contact"
    deploy:
      replicas: ${DIALER_PROCESS_CONTACT_REPLICAS:-1}

  dialer-process-camp:
    <<: *dialer-worker-common
    environment:
      <<: *dialer-worker-env
      GEARMAN_JOBS: "process-campaign"
    deploy:
      replicas: ${DIALER_PROCESS_CAMPAIGN_REPLICAS:-5}

  dialer-process-event:
    <<: *dialer-worker-common
    environment:
      <<: *dialer-worker-env
      GEARMAN_JOBS: "process-event"
    deploy:
      replicas: ${DIALER_PROCESS_EVENT_REPLICAS:-1}

  dialer-scheduler:
    <<: *dialer-worker-common
    environment:
      <<: *dialer-worker-env
      GEARMAN_JOBS: "schedule-agenda"

  dialer-channel-audit:
    <<: *dialer-worker-common
    environment:
      <<: *dialer-worker-env
      GEARMAN_JOBS: "audit-active-channels"

  dialer-manage-campaign:
    <<: *dialer-worker-common
    environment:
      <<: *dialer-worker-env
      GEARMAN_JOBS: ${DIALER_GEARMAN_JOBS_MANAGE_CAMPAIGN:-}

  dialer-send-reports:
    <<: *dialer-worker-common
    environment:
      <<: *dialer-worker-env
      GEARMAN_JOBS: "send-reports"

  dialer-incidence-rules:
    <<: *dialer-worker-common
    environment:
      <<: *dialer-worker-env
      GEARMAN_JOBS: ${DIALER_GEARMAN_JOBS_MANAGE_INCIDENCE_RULES:-}

  dialer-render-template:
    <<: *dialer-worker-common
    environment:
      <<: *dialer-worker-env
      GEARMAN_JOBS: "render-template"

  # ----------------------------------------------------------------------------
  # TELEPHONY EDGE SERVICES
  # ----------------------------------------------------------------------------
  kamailio-pstn:
    <<: *kamailio-common
    entrypoint: [ "/entrypoint_pstn.sh" ]
    depends_on:
      <<: *deps-redis
      rtpengine:
        condition: service_started
    environment:
      ACD_NODES: ${KAMAILIO_ACD_NODES}
      DOMAIN: ${FQDN}
      FQDN: ${FQDN}
      IPADDR_PUBLIC: ${KAMAILIO_PSTN_IP}
      IPADDR_PRIVATE: ${KAMAILIO_PSTN_IP}
      ITSP_NODES: ${KAMAILIO_ITSP_NODES}
      RTPENGINE_SOCKET: udp:${RTPENGINE_HOSTNAME}:${RTPENGINE_BIND_UDP_PORT}
      KAMAILIO_CERTS_LOCATION: ${KAMAILIO_CERTS_LOCATION}
      KAMAILIO_PSTN_QA: ${KAMAILIO_PSTN_QA}
      HOMER_ENABLE: ${HOMER_ENABLE}
      HOMER_HOST: ${HOMER_HOSTNAME}
      HOMER_PORT: ${HOMER_PORT}
      HOMER_CAPTURE_ID: ${HOMER_KAMAILIO_PSTN_CAPTURE_ID:-2002}
      HOMER_NODE_NAME: ${HOMER_PSTN_NODE_NAME:-}
    hostname: kamailio-pstn
    networks:
      omnileads:
        ipv4_address: ${KAMAILIO_PSTN_IP}

  rtpengine:
    build:
      context: ./$REPO_PATH/rtpengine/
      dockerfile: Dockerfile
    image: ${RTPENGINE_IMG}
    <<: *base-service-common
    privileged: true
    environment:
      ENV: ${RTPENGINE_ENV}
      NG_BIND_UDP_PORT: ${RTPENGINE_BIND_UDP_PORT}
      NAT: ${RTPENGINE_NAT}
      LOG_LEVEL: ${RTPENGINE_LOG_LEVEL}
      PUBLIC_IP: ${RTPENGINE_HOSTNAME}
      RTPENGINE_HOSTNAME: ${RTPENGINE_HOSTNAME}
      RTP_PORT_MIN: ${RTPENGINE_RTP_PORT_MIN}
      RTP_PORT_MAX: ${RTPENGINE_RTP_PORT_MAX}
      TZ: ${TZ}

  # ----------------------------------------------------------------------------
  # QA & Dev Env Tools
  # ----------------------------------------------------------------------------

  vue-cli:
    <<: *vue-common
    tty: true
    ports:
      - 8081:8080
    #build:
    #  context: ./$REPO_PATH/django/omnileads_ui/
    #  dockerfile: Dockerfile

  vue-build:
    <<: *vue-common
    logging: *default-logging
    restart: "no"
    entrypoint:
      - /bin/sh
      - -lc
      - |
        set -e
        if [ ! -x node_modules/.bin/vue-cli-service ]; then
          echo "==> [vue-build] installing npm dependencies (npm ci)"
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
        else
          echo "==> [vue-build] node_modules ok, skipping install"
        fi
        if [ ! -f dist/index.html ]; then
          echo "==> [vue-build] running npm run build"
          npm run build
        else
          echo "==> [vue-build] dist/ already built, skipping (run: docker compose run --rm vue-build npm run build to force)"
        fi

  pbxemulator:
    image: ${PSTNEMULATOR_IMG}
    build:
      context: ./$REPO_PATH/omlqa/pstn_emulator/
    hostname: pbxemulator
    # kamailio-pstn debe estar creado antes: el wizard PJSIP resuelve
    # remote_hosts al cargar Asterisk (identify del trunk OML).
    depends_on:
      kamailio-pstn:
        condition: service_started
    environment:
      INBOUND_CALL_MODE: ${PSTN_EMULATOR_MODE}
      VOICEBOT_CALL_MODE: ${VOICEBOT_CALL_MODE}
      OML_API_HOST: https://nginx
      OML_USERNAME: ${VOICEBOT_USERNAME}
      OML_PASSWORD: ${VOICEBOT_PASSWORD}
      KAMAILIO_PSTN_HOSTNAME: ${KAMAILIO_PSTN_HOSTNAME:-kamailio-pstn}
      SUBNET: ${SUBNET}
      TZ: ${TZ}
    ports:
      - "4569:4569/udp"
    stdin_open: true
    tty: true
    networks:
      omnileads:
        ipv4_address: ${PSTN_EMULATOR_IP}
    #volumes:
    #  - ../.custom_conf/pstn_extensions.conf:/etc/asterisk/extensions.conf

  nginxcgi:
    image: ${NGINX_QA_IMG}
    build:
      context: ./$REPO_PATH/omlqa/nginx/
    <<: *optional-service-common
    environment:
      PGHOST: ${POSTGRES_HOSTNAME}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PSTN_HOSTNAME: pbxemulator
    ports:
      - 127.0.0.1:8888:8808/tcp

  redisinsight:
    image: redis/redisinsight:latest
    <<: *optional-service-common
    environment:
      BIND_IP: "0.0.0.0"
      TZ: ${TZ}
    ports:
      - '127.0.0.1:7963:5540'
    volumes:
      - redis_redisinsight:/data

  pgadmin:
    image: dpage/pgadmin4:9.17 
    <<: *optional-service-common
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@omnileads.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_WTF_CSRF_ENABLED: "True"
      PGADMIN_CONFIG_SESSION_COOKIE_SECURE: "False"
      TZ: ${TZ}
    ports:
      - 127.0.0.1:5050:80/tcp
    volumes:
      - pgadmin:/var/lib/pgadmin
    user: "5050:5050"
    depends_on:
      postgresql:
        condition: service_healthy

