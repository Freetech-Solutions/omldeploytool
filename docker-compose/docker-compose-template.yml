  ARI_USER: ${ACD_AMI_USER}
  ARI_PASSWORD: ${ACD_AMI_PASSWORD}
  ARI_APP: ${ACD_APP}
  BUCKET_ACCESS_KEY_ID: ${BUCKET_ACCESS_KEY_ID}
  BUCKET_SECRET_ACCESS_KEY: ${BUCKET_SECRET_ACCESS_KEY}
  BUCKET_NAME: ${BUCKET_NAME}
  BUCKET_ENDPOINT: ${BUCKET_ENDPOINT_INTERNAL}
  REDIS_URL: redis://${REDIS_HOSTNAME}:${REDIS_PORT}
  OMNILEADS_HOSTNAME: ${NGINX_HOSTNAME}
