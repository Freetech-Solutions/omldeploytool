x-acd-ari-common: &acd-ari-common
  <<: *acd-common
  working_dir: /opt/asterisk/ari-app/
  stop_grace_period: 10s

# ACD ARI environment variables
x-acd-ari-env: &acd-ari-env
  ASTERISK_HOST: ${ACD_HOSTNAME}
  ASTERISK_PORT: ${ACD_ARI_PORT}
  ASTERISK_USER: ${ACD_AMI_USER}  
  ASTERISK_PASS: ${ACD_AMI_PASSWORD}
  ACD_WEBHOOK_TRANSFER_TTL: ${ACD_WEBHOOK_TRANSFER_TTL}
