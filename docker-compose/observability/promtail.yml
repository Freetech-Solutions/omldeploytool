server:
  # Puerto HTTP de promtail (para métricas / health)
  http_listen_port: 9080
  
positions:
  # Archivo donde promtail recuerda por qué línea va leyendo cada log
  filename: /tmp/positions-promtail.yaml

clients:
  - url: http://192.168.1.138:3100/loki/api/v1/push
    tenant_id: test-localhost

# Opcional: etiquetas globales que se añaden a TODOS los logs
# (útil si querés distinguir este nodo satélite en Loki)
#  - url: http://loki:3100/loki/api/v1/push
#    tenant_id: ${TENANT_NAME}
#    external_labels:
#      node: "omnileads-satellite-01"
#      environment: "production"

scrape_configs:
  # ---------------------------------------------------------------------------
  # TODOS LOS CONTAINERS DOCKER DEL HOST
  # ---------------------------------------------------------------------------
  - job_name: docker-containers

    # Descubrimiento dinámico de containers vía Docker API
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s

    pipeline_stages:
      # Parsea el JSON de logs de Docker (driver json-file)
      - docker: {}

      # Añade etiquetas estáticas (útil para queries en Loki)
      - labels:
          tenant: "testing"
          source: "docker"

    relabel_configs:
      # Ruta del archivo de log del container -> __path__
      - source_labels: ['__meta_docker_container_logpath']
        target_label: '__path__'

      # Nombre del container (sin el "/")
      - source_labels: ['__meta_docker_container_name']
        target_label: 'container'
        regex: '/(.*)'

      # Nombre del servicio de docker-compose (si existe)
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # Nombre del proyecto/stack de docker-compose (si existe)
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'stack'

      # Etiqueta de red (por ejemplo, containers conectados a "omnileads")
      - source_labels: ['__meta_docker_network_name']
        target_label: 'network'

      # ----------------- EJEMPLOS DE FILTRO (OPCIONALES) -----------------
      # Si en algún momento quisieras filtrar solo tu stack de App,
      # podrías usar algo como (descomentar y adaptar):
      #
      # - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
      #   regex: 'omnileads'         # nombre del proyecto del stack de App
      #   action: keep
      #
      # O para excluir promtail de sus propios logs:
      #
      # - source_labels: ['__meta_docker_container_name']
      #   regex: '/promtail'
      #   action: drop
      # --------------------------------------------------------------------
