# ============================================================================
# YAML Templates (Anchors)
# ============================================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart-policy: &restart-policy
  restart: on-failure

x-healthcheck-http: &healthcheck-http
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

x-healthcheck-tcp: &healthcheck-tcp
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

# Base service common template (networks, restart, logging, dns, stop_grace_period)
x-base-service-common: &base-service-common
  networks:
    - omnileads
  restart: on-failure
  logging: *default-logging
  dns: 8.8.8.8
  stop_grace_period: 10s

# Optional service common template
x-optional-service-common: &optional-service-common
  <<: *base-service-common
  stop_grace_period: 30s

# Common dependencies templates
x-depends-on-postgres-redis: &depends-on-postgres-redis
  depends_on:
    postgresql:
      condition: service_healthy
    redis:
      condition: service_healthy

x-depends-on-minio-gearman: &depends-on-minio-gearman
  depends_on:
    minio:
      condition: service_healthy
    gearman:
      condition: service_healthy

x-depends-on-postgres-redis-minio: &depends-on-postgres-redis-minio
  depends_on:
    postgresql:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

# Django common template
x-django-common: &django-common
  image: ${APP_IMG}
  dns: 8.8.8.8
  networks:
    - omnileads
  restart: on-failure
  logging: *default-logging
  stdin_open: true
  tty: true
  environment: &django-env
    BUCKET_ACCESS_KEY_ID: ${BUCKET_ACCESS_KEY_ID}
    BUCKET_SECRET_ACCESS_KEY: ${BUCKET_SECRET_ACCESS_KEY}
    BUCKET_DEFAULT_REGION: ${BUCKET_DEFAULT_REGION}
    BUCKET_NAME: ${BUCKET_NAME}
    BUCKET_ENDPOINT: ${BUCKET_ENDPOINT}
    BUCKET_ENDPOINT_INTERNAL: ${BUCKET_ENDPOINT_INTERNAL}
    CALIFICACION_REAGENDA: ${CALIFICACION_REAGENDA}
    CALLREC_DEVICE: ${BUCKET_DEVICE}
    DJANGO_HOSTNAME: ${DJANGO_HOSTNAME}
    DJANGO_ALLOW_ASYNC_UNSAFE: "true"
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE}
    EMAIL_BACKEND: "django.core.mail.backends.dummy.EmailBackend"
    EPHEMERAL_USER_TTL: ${EPHEMERAL_USER_TTL}
    GEARMAN_JOB_SERVERS: ${GEARMAN_JOB_SERVERS}
    GEARMAN_QUEUE_CALL: acd-call-processor
    GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    GOOGLE_MAPS_CENTER: '${GOOGLE_MAPS_CENTER}'
    KAMAILIO_HOSTNAME: ${KAMAILIO_WEBRTC_HOSTNAME}
    KAMAILIO_PORT: ${KAMAILIO_WEBRTC_SIP_PORT}
    LOGIN_FAILURE_LIMIT: ${LOGIN_FAILURE_LIMIT}
    OML_BUILD_DATE: ${APP_IMG}
    OMNILEADS_HOSTNAME: ${NGINX_HOSTNAME}
    OML_OMNIDIALER_SECRET: ${DIALER_PASSWORD}
    OMNIDIALER_HOST: ${DIALER_API_HOST}
    PYTHONPATH: ${PYTHONPATH}
    PGHOST: ${POSTGRES_HOSTNAME}
    PGDATABASE: ${POSTGRES_DB}
    PGPORT: ${POSTGRES_PORT}
    PGUSER: ${POSTGRES_USER}
    PGPASSWORD: ${POSTGRES_PASSWORD}
    PGHOSTHA: ${POSTGRES_HA}
    PGHOSTRO: ${POSTGRES_NODE_RO}
    REDIS_HOSTNAME: ${REDIS_HOSTNAME}
    SESSION_COOKIE_AGE: ${SESSION_COOKIE_AGE}
    TZ: ${TZ}
    UWSGI_PORT: ${UWSGI_PORT}
    WEBSOCKET_HOST: ${WEBSOCKET_HOSTNAME}
    WEBSOCKET_PORT: ${WEBSOCKET_PORT}

# Django web common template
x-django-web-common: &django-web-common
  <<: *django-common
  working_dir: /opt/omnileads/ominicontacto
  stop_grace_period: 30s

# Django worker common template
x-django-worker-common: &django-worker-common
  <<: *django-common
  depends_on:
    postgresql:
      condition: service_healthy
    redis:
      condition: service_healthy
  working_dir: /opt/omnileads/ominicontacto
  stop_grace_period: 30s

# Worker common template
x-dialer-worker-common: &dialer-worker-common
  build:
    context: ./$REPO_PATH/dialer/workers/handle-campaign/src
  image: ${DIALER_WORKER_IMG}
  networks:
    - omnileads
  restart: on-failure
  logging: *default-logging
  stop_signal: SIGINT
  tty: true
  stdin_open: true
  depends_on:
    dialer-postgresql:
      condition: service_healthy
    gearman:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: &dialer-worker-env
    CAPS: ${DIALER_CAPS}
    GEARMAN_JOB_SERVERS: ${GEARMAN_JOB_SERVERS}
    POSTGRES_OML_SERVER: ${POSTGRES_HOSTNAME}
    POSTGRES_OML_PORT: ${POSTGRES_PORT}
    POSTGRES_OML_USER: ${POSTGRES_USER}
    POSTGRES_OML_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DIALER_SERVER: ${DIALER_POSTGRES_SERVER}
    POSTGRES_DIALER_PORT: ${DIALER_POSTGRES_PORT}
    POSTGRES_DIALER_USER: ${DIALER_POSTGRES_USER}
    POSTGRES_DIALER_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DIALER_DB: ${DIALER_POSTGRES_DB}
    REDIS_OML_SERVER: ${REDIS_HOSTNAME}
    REDIS_OML_PORT: ${REDIS_PORT}
    REDIS_DIALER_SERVER: ${REDIS_HOSTNAME}
    REDIS_DIALER_PORT: ${REDIS_PORT}
    PYTHON_LOGLEVEL: ${DIALER_PYTHON_LOGLEVEL}
    TIME_BETWEEN_CALLS: ${DIALER_TIME_BETWEEN_CALLS}
    TZ: ${TZ}

# ACD common template
x-acd-common: &acd-common
  image: ${ACD_IMG}
  platform: ${DOCKER_PLATFORM:-linux/amd64}
  networks:
    - omnileads
  restart: on-failure
  logging: *default-logging

# ACD ARI common template (for acd-app and acd-api)
x-acd-ari-common: &acd-ari-common
  <<: *acd-common
  working_dir: /opt/asterisk/ari-app/
  dns: 8.8.8.8
  stop_grace_period: 10s

# ACD ARI environment variables
x-acd-ari-env: &acd-ari-env
  ASTERISK_HOST: ${ACD_HOSTNAME}
  ASTERISK_PORT: ${ACD_ARI_PORT}
  ASTERISK_USER: ${ACD_AMI_USER}  
  ASTERISK_PASS: ${ACD_AMI_PASSWORD}
  ACD_WEBHOOK_TRANSFER_TTL: ${ACD_WEBHOOK_TRANSFER_TTL}
  ARI_URL: http://${ACD_HOSTNAME}:${ACD_ARI_PORT}
  ARI_USER: ${ACD_AMI_USER}
  ARI_PASSWORD: ${ACD_AMI_PASSWORD}
  ARI_APP: ${ACD_APP}
  BUCKET_ACCESS_KEY_ID: ${BUCKET_ACCESS_KEY_ID}
  BUCKET_SECRET_ACCESS_KEY: ${BUCKET_SECRET_ACCESS_KEY}
  BUCKET_NAME: ${BUCKET_NAME}
  BUCKET_ENDPOINT: ${BUCKET_ENDPOINT_INTERNAL}
  REDIS_URL: redis://${REDIS_HOSTNAME}:${REDIS_PORT}
  OMNILEADS_HOSTNAME: ${NGINX_HOSTNAME}
  OMNILEADS_PROTOCOL: https
  OMNILEADS_VERIFY_SSL: "false"
  GEARMAN_JOB_SERVERS: ${GEARMAN_JOB_SERVERS}  
  NODE_ID: ${ACD_HOSTNAME}
  TENANT_ID: ${FQDN}
  REDIS_HOST: ${REDIS_HOSTNAME}
  RECORDING_BASE_PATH: /var/spool/asterisk/recording
  PYTHON_LOGLEVEL: ${ACD_LOG_LEVEL:-error}
  TZ: ${TZ}
  WEBRTC_TRUNK: webrtc-trunk

# Asterisk Server common template (shared by acd-server and dialer-server)
x-asterisk-server-common: &asterisk-server-common
  <<: *acd-common
  build:
    context: ./$REPO_PATH/acd/
    dockerfile: Dockerfile
  entrypoint: [ "/docker-entrypoint.sh" ]
  depends_on:
    gearman:
      condition: service_healthy
  privileged: true
  stop_grace_period: 30s
  working_dir: /etc/asterisk
  healthcheck:
    test: [ "CMD-SHELL", "asterisk -rx 'core show channels' | grep -q 'active channels' || exit 1" ]
    <<: *healthcheck-tcp
  volumes:
    - asterisk_callrec:/var/spool/asterisk/recording
    - asterisk_conf:/etc/asterisk/retrieve_conf
    - asterisk_sounds:/var/lib/asterisk/sounds

# Asterisk Server common environment variables
x-asterisk-server-env: &asterisk-server-env
  AMI_USER: ${ACD_AMI_USER}
  AMI_PASSWORD: ${ACD_AMI_PASSWORD}
  ASTERISK_APP: ${ACD_APP}
  ASTERISK_HOSTNAME: ${ACD_HOSTNAME}
  FASTAGI: ${FASTAGI_HOSTNAME}
  GEARMAN_HOST: ${GEARMAN_HOSTNAME}
  HOMER_ENABLE: ${HOMER_ENABLE}
  HOMERHOST: ${HOMER_HOSTNAME}
  HOMERPORT: ${HOMER_PORT}
  LOG_LEVEL: ${ACD_LOG_LEVEL}
  NODE_ID: ${ACD_HOSTNAME}
  RTP_PORT_MAX: ${ACD_RTP_PORT_MAX}
  RTP_PORT_MIN: ${ACD_RTP_PORT_MIN}
  SCALE: ${ACD_SCALE}
  VOIP_PROXY_HOSTNAME: ${KAMAILIO_PSTN_HOSTNAME:-kamailio-pstn}
  VOIP_PROXY_PORT: ${KAMAILIO_PSTN_UDP_PORT:-5060}
  TZ: ${TZ}
  WEBRTC_PROXY_HOSTNAME: ${KAMAILIO_WEBRTC_HOSTNAME:-kamailio-webrtc}
  WEBRTC_PROXY_PORT: ${KAMAILIO_WEBRTC_UDP_PORT:-10060}

# Asterisk Conf Generator common template
x-asterisk-conf-generator-common: &asterisk-conf-generator-common
  <<: *acd-common
  working_dir: /opt/asterisk/workers/
  entrypoint: [ "python", "astconf.py" ]
  dns: 8.8.8.8
  stop_grace_period: 10s
  volumes:
    - asterisk_conf:/home/omnileads/astconf
    - asterisk_sounds:/home/omnileads/sounds

# Asterisk Conf Generator environment variables
x-asterisk-conf-generator-env: &asterisk-conf-generator-env
  ASTERISK_LOCATION: ""
  ARI_HOST: acd-server
  ARI_USER: ${ACD_AMI_USER}
  ARI_PASS: ${ACD_AMI_PASSWORD}
  OMNILEADS_HOSTNAME: ${NGINX_HOSTNAME}
  TZ: ${TZ}

# Callrec service common template
x-callrec-service-common: &callrec-service-common
  <<: *base-service-common
  depends_on:
    minio:
      condition: service_healthy
    gearman:
      condition: service_healthy

# Callrec environment variables base
x-callrec-env-base: &callrec-env-base
  BUCKET_ACCESS_KEY_ID: ${BUCKET_ACCESS_KEY_ID}
  BUCKET_SECRET_ACCESS_KEY: ${BUCKET_SECRET_ACCESS_KEY}
  BUCKET_DEFAULT_REGION: ${BUCKET_DEFAULT_REGION}
  DB_HOST: ${POSTGRES_HOSTNAME}
  DB_NAME: ${POSTGRES_DB}
  DB_USER: ${POSTGRES_USER}
  DB_PASS: ${POSTGRES_PASSWORD}
  DB_PORT: ${POSTGRES_PORT}
  CALLREC_DEVICE: ${BUCKET_DEVICE}
  GEARMAN_HOST: ${GEARMAN_HOSTNAME}
  S3_BUCKET_NAME: ${BUCKET_NAME}
  TZ: ${TZ}

# ACD Worker common template (for call-logger and similar workers)
x-acd-worker-common: &acd-worker-common
  <<: *acd-common
  working_dir: /opt/asterisk/workers/
  networks:
    - omnileads
  restart: on-failure
  logging: *default-logging
  dns: 8.8.8.8
  stop_grace_period: 10s
  depends_on:
    gearman:
      condition: service_healthy
    postgresql:
      condition: service_healthy
    redis:
      condition: service_healthy

# Dialer API common template
x-dialer-api-common: &dialer-api-common
  <<: *base-service-common
  stop_signal: SIGINT
  tty: true
  stdin_open: true
  depends_on:
    dialer-postgresql:
      condition: service_healthy

# ============================================================================
# NETWORKS & VOLUMES
# ============================================================================
networks:
  omnileads:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: "${SUBNET}"

volumes:
  postgresql:
  redis:
  minio:
  django_media:
  django_static:
  django_callrec_zip:
  asterisk_callrec:
  asterisk_sounds:
  asterisk_conf:
  dialer_postgresql:
  faster_whisper_cache:
  
# ============================================================================
# SERVICES
# ============================================================================
services:

  # ----------------------------------------------------------------------------
  # BACKEND SERVICES
  # ----------------------------------------------------------------------------
  postgresql:
    image: ${POSTGRES_IMG}
    dns: 8.8.8.8
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - omnileads
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -q" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 90s
    volumes:
      - postgresql:/var/lib/postgresql

  redis:
    image: ${REDIS_IMG}
    dns: 8.8.8.8
    environment:
      TZ: ${TZ}
      BIND_IP: 0.0.0.0
    networks:
      - omnileads
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      <<: *healthcheck-tcp
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 30s
    volumes:
      - redis:/data

  minio:
    image: ${MINIO_IMG}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_HTTP_ADMIN_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_HTTP_ADMIN_PASS}
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
      TZ: ${TZ}
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      <<: *healthcheck-tcp
    networks:
      - omnileads
    restart: on-failure
    logging: *default-logging
    volumes:
      - minio:/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - omnileads
    logging: *default-logging
    restart: "no" # Solo ejecutar una vez
    entrypoint: >
      /bin/sh -c " echo 'Esperando a que MinIO esté listo...'; sleep 5; echo 'Configurando alias de MinIO...'; /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_HTTP_ADMIN_USER} ${MINIO_HTTP_ADMIN_PASS}; echo 'Verificando conexión...'; /usr/bin/mc admin info myminio; echo 'Creando bucket omnileads...'; /usr/bin/mc mb myminio/omnileads --ignore-existing; echo 'Creando usuario omlminio...'; /usr/bin/mc admin user add myminio omlminio ${BUCKET_SECRET_ACCESS_KEY}; echo 'Asignando política readwrite al usuario...'; /usr/bin/mc admin policy attach myminio readwrite --user omlminio; echo 'Configuración completada exitosamente'; "

  gearman:
    image: ${GEARMAN_IMG}
    environment:
      TZ: ${TZ}
    networks:
      - omnileads
    command: gearmand -t 1
    healthcheck:
      test: [ "CMD-SHELL", "gearadmin --status" ]
      <<: *healthcheck-tcp
      start_period: 40s
    restart: on-failure
    logging: *default-logging

  dialer-postgresql:
    image: ${POSTGRES_IMG}
    dns: 8.8.8.8
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${DIALER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DIALER_POSTGRES_DB}
      PGPORT: "5433"
    networks:
      - omnileads
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DIALER_POSTGRES_USER} -d ${DIALER_POSTGRES_DB} -q" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 90s
    volumes:
      - dialer_postgresql:/var/lib/postgresql
      - ../omnidialer.sql:/docker-entrypoint-initdb.d/init.sql

  # ----------------------------------------------------------------------------
  # WEB SERVICES
  # ----------------------------------------------------------------------------

  nginx:
    build:
      context: ./$REPO_PATH/nginx/
      dockerfile: Dockerfile
    image: ${NGINX_IMG}
    depends_on:
      omlapp:
        condition: service_healthy
      daphne:
        condition: service_started
      kamailio-webrtc:
        condition: service_started
      websockets:
        condition: service_started
    environment:
      ASGI_PORT: ${DAPHNE_PORT}
      DJANGO_HOSTNAME: ${DJANGO_HOSTNAME}
      DAPHNE_HOSTNAME: ${DAPHNE_HOSTNAME}
      KAMAILIO_HOSTNAME: ${KAMAILIO_WEBRTC_HOSTNAME}
      KAMAILIO_PORT: ${KAMAILIO_HTTPS_PORT}
      S3_ENDPOINT: http://minio:9000
      TZ: ${TZ}
      WEBSOCKETS_HOSTNAME: ${WEBSOCKET_HOSTNAME}
      WEBSOCKETS_PORT: ${WEBSOCKET_PORT}
      WEBUI_MODE: ${NGINX_WEBUI_MODE}
      WALLBOARD_WEBUI_PATH: ${NGINX_WALLBOARD_WEBUI_PATH}
      PREMIUMREPORTS_WEBUI_PATH: ${NGINX_PREMIUMREPORTS_WEBUI_PATH}
      WSGI_PORT: ${UWSGI_PORT}
    dns: 8.8.8.8
    networks:
      - omnileads
    ports:
      - 443:443
    healthcheck:
      test: [ "CMD", "curl", "-fk", "https://localhost/health" ]
      <<: *healthcheck-http
      start_period: 30s
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 15s
    volumes:
      - django_static:/opt/omnileads/static
      - django_callrec_zip:/opt/omnileads/asterisk/var/spool/asterisk/monitor
      # - ../.custom_conf/certs/:/etc/omnileads/certs:ro

  omlapp:
    build:
      context: ./$REPO_PATH/django/
      dockerfile: Dockerfile
    image: ${APP_IMG}
    <<: *django-web-common
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      acd-server:
        condition: service_healthy
    environment:
      <<: *django-env
      UWSGI_CUSTOM: True
      UWSGI_PROCESSES: ${UWSGI_PROCESSES}
      UWSGI_THREADS: ${UWSGI_THREADS}
      UWSGI_LISTEN_QUEUE_SIZE: ${UWSGI_LISTEN_QUEUE_SIZE}
      UWSGI_WORKER_RELOAD_MERCY: ${UWSGI_WORKER_RELOAD_MERCY}
      UWSGI_EVIL_RELOAD_ON_RSS: ${UWSGI_EVIL_RELOAD_ON_RSS}
    command: /opt/omnileads/bin/init_uwsgi.sh
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsSL -o /dev/null http://${DJANGO_HOSTNAME}:${DJANGO_PORT:-8099}/ || exit 1" ]
      <<: *healthcheck-http
      start_period: 90s
    volumes:
      - django_static:/opt/omnileads/static
      - django_media:/opt/omnileads/media_root

  django-commands:
    <<: *django-common
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: /opt/omnileads/bin/django_commands.sh
    working_dir: /opt/omnileads/ominicontacto
    volumes:
      - django_static:/opt/omnileads/static
      - django_callrec_zip:/opt/omnileads/asterisk/var/spool/asterisk/monitor
    stop_grace_period: 30s

  daphne:
    <<: *django-common
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: *django-env
      DAPHNE_ENABLE: "true"
      DAPHNE_PORT: ${DAPHNE_PORT:-8098}
      DJANGO_HOSTNAME: ${DAPHNE_HOSTNAME}
    command: /opt/omnileads/bin/init_daphne.sh
    working_dir: /opt/omnileads/ominicontacto
    stop_grace_period: 90s

  websockets:
    build:
      context: ./$REPO_PATH/websocket-server/
      target: run
      dockerfile: ./etc/fts/oml/services/websockets/dockerfile
    image: ${WS_IMG}
    depends_on:
      - redis
    environment:
      BIND_ADDRESS: "0.0.0.0:8000"
      EVENT_LOOP: "uvloop"
      LOGGERS: ${WEBSOCKET_LOGGER}
      REDIS_HOST: ${WEBSOCKET_REDIS_HOSTNAME}
      PYTHONUNBUFFERED: 1
      TZ: ${TZ}
    networks:
      - omnileads
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 30s

  kamailio-webrtc:
    build:
      context: ./$REPO_PATH/kamailio
      dockerfile: Dockerfile
    image: ${KAMAILIO_IMG}
    entrypoint: [ "/bin/sh", "-c", "kamailio -DD -E -m ${SHM_SIZE} -M ${PKG_SIZE} -f /etc/kamailio/kamailio_webrtc.cfg" ]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ACD_NET_ADDR: ${ACD_SERVER_IP}
      AUTHEPH_SK: ${AUTHEPH_SK}
      KAMAILIO_CERTS_LOCATION: ${KAMAILIO_CERTS_LOCATION}
      KAMAILIO_HOSTNAME: ${KAMAILIO_WEBRTC_HOSTNAME}
      KAMAILIO_IFACE: ${KAMAILIO_WEBRTC_IFACE}
      REDIS_HOSTNAME: ${REDIS_HOSTNAME}
      RTPENGINE_HOSTNAME: ${RTPENGINE_HOSTNAME}
      SHM_SIZE: ${SHM_SIZE}
      PKG_SIZE: ${PKG_SIZE}
      TZ: ${TZ}
    dns: 8.8.8.8
    privileged: true
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 10s
    networks:
      - omnileads

  # ----------------------------------------------------------------------------
  # WORKERS
  # ----------------------------------------------------------------------------
  whatsapp:
    <<: *django-worker-common
    command: /opt/omnileads/bin/init_whatsapp.sh

  background-tasks:
    <<: *django-worker-common
    command: /opt/omnileads/bin/init_worker_bgtasks.sh

  supervision-events-listener:
    <<: *django-worker-common
    command: python manage.py supervision_events_listener

  presence-heartbeat-scheduler:
    <<: *django-worker-common
    command: python manage.py presence_heartbeat_scheduler

  daily-redis-cleanup:
    <<: *django-worker-common
    command: /opt/omnileads/bin/init_daily_redis_cleanup.sh

  background-dialer-tasks:
    <<: *django-worker-common
    command: python manage.py omnidialer_events_listener

  dashboard-agent-scheduler:
    <<: *django-worker-common
    command: python manage.py actualizar_reporte_dia_actual_agentes_scheduler

  supervision-agentes-scheduler:
    <<: *django-worker-common
    command: python manage.py actualizar_reporte_supervisores_scheduler

  call-logger:
    build:
      context: ./$REPO_PATH/acd/
      dockerfile: Dockerfile
    image: ${ACD_IMG}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    <<: *acd-worker-common
    entrypoint: [ "python", "logger.py" ]
    environment:
      GEARMAN_JOB_SERVERS: ${GEARMAN_JOB_SERVERS}
      PGHOST: ${POSTGRES_HOSTNAME}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PYTHON_LOGLEVEL: ${ACD_LOG_LEVEL}
      REDIS_HOST: ${REDIS_HOSTNAME}
      REDIS_PORT: ${REDIS_PORT}
      TZ: ${TZ}

  # ----------------------------------------------------------------------------
  # TELEPHONY EDGE SERVICES
  # ----------------------------------------------------------------------------
  kamailio-pstn:
    build:
      context: ./$REPO_PATH/kamailio
      dockerfile: Dockerfile
    image: ${KAMAILIO_IMG}
    entrypoint: [ "/entrypoint_pstn.sh" ]
    depends_on:
      redis:
        condition: service_healthy
      rtpengine:
        condition: service_started
    environment:
      ACD_NODES: ${ACD_NODES}
      FQDN: ${FQDN}
      IPADDR_PUBLIC: ${KAMAILIO_PSTN_HOSTNAME}
      IPADDR_PRIVATE: ${KAMAILIO_PSTN_HOSTNAME}
      ITSP_NODES: ${PSTN_EMULATOR_IP}
      RTPENGINE_SOCKET: udp:${RTPENGINE_HOSTNAME}:${RTPENGINE_BIND_UDP_PORT}
      KAMAILIO_CERTS_LOCATION: ${KAMAILIO_CERTS_LOCATION}
    dns: 8.8.8.8
    privileged: true
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 10s
    network_mode: host

  rtpengine:
    build:
      context: ./$REPO_PATH/rtpengine/
      dockerfile: Dockerfile
    image: ${RTPENGINE_IMG}
    environment:
      ENV: ${RTPENGINE_ENV}
      NG_BIND_UDP_PORT: ${RTPENGINE_BIND_UDP_PORT}
      NAT: ${RTPENGINE_NAT}
      LOG_LEVEL: ${RTPENGINE_LOG_LEVEL}
      PUBLIC_IP: ${RTPENGINE_HOSTNAME}
      RTPENGINE_HOSTNAME: ${RTPENGINE_HOSTNAME}
      RTP_PORT_MIN: ${RTPENGINE_RTP_PORT_MIN}
      RTP_PORT_MAX: ${RTPENGINE_RTP_PORT_MAX}
      TZ: ${TZ}
    privileged: true
    restart: on-failure
    logging: *default-logging
    stop_grace_period: 10s
    network_mode: host
      # command: rtpengine --config-file /etc/rtpengine.conf   
      # volumes:
      #   - ./.custom_conf/rtpengine.conf:/etc/rtpengine.conf:ro

  # ----------------------------------------------------------------------------
  # TELEPHONY ACD
  # ----------------------------------------------------------------------------
  fastagi:
    build:
      context: ./$REPO_PATH/fastagi/
      dockerfile: Dockerfile
    image: ${FASTAGI_IMG}
    <<: *base-service-common
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python /app/fastagi.py
    environment:
      DIALER_AMD_ENDPOINT: ${DIALER_API_HOST}
      GEARMAN_JOB_SERVERS: ${GEARMAN_JOB_SERVERS}
      OMNILEADS_HOSTNAME: ${NGINX_HOSTNAME}
      PGHOST: ${POSTGRES_HOSTNAME}
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOSTNAME: ${REDIS_HOSTNAME}
      REDIS_PORT: ${REDIS_PORT}
      TZ: ${TZ}

  acd-conf-generator:
    <<: *asterisk-conf-generator-common
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      <<: *asterisk-conf-generator-env

  acd-server:
    <<: *asterisk-server-common
    networks:
      omnileads:
        ipv4_address: ${ACD_SERVER_IP}
    environment:
      <<: *asterisk-server-env
    #volumes:
    #  - ../.custom_conf/acd_custom_exten.conf:/etc/asterisk/oml_extensions_custom.conf:ro

  acd-app:
    <<: *acd-ari-common
    entrypoint: [ "python", "main.py" ]
    depends_on:
      redis:
        condition: service_healthy
      acd-server:
        condition: service_healthy
    environment:
      <<: *acd-ari-env
      ASTERISK_APP: ${ACD_APP}
      SIP_EXTRA_HEADERS: "X-Verloop-callID: business_id|X-Verloop-customerID: id_customer|X-Verloop-CampID: camp_id"
    volumes:
      - asterisk_callrec:/var/spool/asterisk/recording
      # - ${REPO_PATH}/acd/source/ari-app/:/opt/asterisk/ari-app:ro

  # ----------------------------------------------------------------------------
  # PROCESSING HEAVY METAL SERVICES
  # ----------------------------------------------------------------------------

  callrec-compressor:
    build:
      context: ./$REPO_PATH/postcall_actions/callrec_compressor/
      dockerfile: Dockerfile
    image: ${CALLREC_COMPRESSOR_IMG}
    <<: *callrec-service-common
    environment:
      <<: *callrec-env-base
      S3_ENDPOINT: ${BUCKET_ENDPOINT_INTERNAL}

  callrec-transcriber:
    build:
      context: ./$REPO_PATH/postcall_actions/callrec_transcriber/
      dockerfile: Dockerfile
    image: ${CALLREC_TRANSCRIBER_IMG}
    <<: *callrec-service-common
    environment:
      <<: *callrec-env-base
      GOOGLE_APPLICATION_CREDENTIALS: ${STT_GCP_JSON_PATH}
      S3_ENDPOINT: ${BUCKET_ENDPOINT_INTERNAL}
      STT_ENGINE: ${STT_ENGINE}
      STT_API_KEY: ${STT_API_KEY}
      # Modelo Gemini: si 404, el worker consulta ListModels y prueba modelos disponibles
      GEMINI_TRANSCRIPTION_MODEL: ${GEMINI_TRANSCRIPTION_MODEL:-gemini-1.5-flash}
      SUMMARIZE_MODEL: ${SUMMARIZE_MODEL:-gemini-1.5-flash}
      SUMMARIZE_ENGINE: ${SUMMARIZE_ENGINE:-gemini}
      SUMMARIZE_ENABLED: ${SUMMARIZE_ENABLED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PGHOST: ${POSTGRES_HOSTNAME}
      PGPORT: ${POSTGRES_PORT}
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_OML_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOSTNAME}
      REDIS_PORT: ${REDIS_PORT}
    volumes:
      - faster_whisper_cache:/opt/models
  #     - ../.custom_conf/google_credentials.json:/${STT_GCP_JSON_PATH}:ro

  # ----------------------------------------------------------------------------
  # DIALER STACK SERVICES
  # ----------------------------------------------------------------------------
  dialer-api:
    image: ${DIALER_API_IMG}
    build:
      target: run
      context: ./$REPO_PATH/dialer/interface/src
    <<: *dialer-api-common
    environment:
      GEARMAN_JOB_SERVERS: ${GEARMAN_JOB_SERVERS}
      WEBSOCKET_SERVER: ${DIALER_DCHANNELS_URL}
      TZ: ${TZ}

  dialer-process-contact:
    <<: *dialer-worker-common
    environment:
      <<: *dialer-worker-env
      GEARMAN_JOBS: "process-contact"
    deploy:
      replicas: ${DIALER_PROCESS_CONTACT_REPLICAS:-1}

  dialer-process-camp:
    <<: *dialer-worker-common
    environment:
      <<: *dialer-worker-env
      GEARMAN_JOBS: "process-campaign"
    deploy:
      replicas: ${DIALER_PROCESS_CAMPAIGN_REPLICAS:-5}

  dialer-process-event:
    <<: *dialer-worker-common
    environment:
      <<: *dialer-worker-env
      GEARMAN_JOBS: "process-event"
    deploy:
      replicas: ${PROCESS_EVENT_REPLICAS:-1}

  dialer-scheduler:
    <<: *dialer-worker-common
    environment:
      <<: *dialer-worker-env
      GEARMAN_JOBS: "schedule-agenda"

  dialer-start-camp:
